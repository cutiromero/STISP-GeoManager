                enum: [lithology, faults, coverage, units, hematite, chlorite, hydromica, calcite, dolomite, null]
                description: 建议角色
              reason: {type: string, description: 判断依据或规则退回说明}
    AgentWorkflowUploadField:
      type: object
      description: 上传资料中的一个字段及示例取值
      additionalProperties: false
      required: [name, type, samples, distinctCount]
      properties:
        name: {type: string, description: 原始字段名}
        type: {type: string, description: 推断的字段类型，例如text、integer、number}
        samples:
          type: array
          description: 最多8个不同的示例取值，统一为文本
          maxItems: 8
          items: {type: string, description: 示例取值}
        distinctCount: {type: integer, minimum: 0, description: 前1000条记录中的不同取值个数}
    AgentWorkflowUploadProfile:
      type: object
      description: 平台读取的资料识别结果
      additionalProperties: false
      required: [kind, fields]
      properties:
        kind: {type: string, enum: [vector, raster, table], description: 资料类型}
        crs: {type: [string, 'null'], description: 坐标系，例如EPSG:32646；无法识别时为null}
        geometryTypes:
          type: array
          description: 矢量几何类型
          items: {type: string, description: 几何类型}
        featureCount: {type: [integer, 'null'], description: 要素数或表格行数}
        bounds:
          type: [array, 'null']
          description: WGS84外包范围[west,south,east,north]
          items: {type: number, description: 坐标}
        bandCount: {type: [integer, 'null'], description: 栅格波段数}
        width: {type: [integer, 'null'], description: 栅格列数}
        height: {type: [integer, 'null'], description: 栅格行数}
        fields:
          type: array
          description: 矢量或表格字段；栅格为空数组
          items: {$ref: '#/components/schemas/AgentWorkflowUploadField'}
        warnings:
          type: array
          description: 识别中发现的问题，例如缺少坐标系
          items: {type: string, description: 问题说明}
    AgentWorkflowUpload:
      type: object
      description: 通用地质推理任务的一份资料，上传文件或系统目录引用
      additionalProperties: false
      required: [id, batchId, resourceId, name, fileName, dataType, sizeBytes, roleHint, profile, workflowId, createdAt]
      properties:
        source: {type: string, enum: [upload, catalog], description: 资料来源；历史未返回此字段的记录为上传文件。目录引用移除时绝不改变目录资源}
        id: {type: string, format: uuid, description: 上传记录 UUID}
        batchId: {type: string, description: 上传批次号}
        resourceId: {type: integer, description: 数据资源ID；上传资源仅本人可见，目录引用沿用原资源访问权限}
        name: {type: string, description: 资料名称，目录引用取原资源名称}
        fileName: {type: string, description: 原始文件名；目录引用为原资源名称}
        dataType: {type: string, enum: [vector, raster, table], description: 资料类型}
        sizeBytes: {type: integer, minimum: 0, description: 原始文件大小}
        roleHint:
          type: [string, 'null']
          description: 平台推荐的资料角色；无法判断时为null
          enum: [lithology, faults, coverage, units, hematite, chlorite, hydromica, calcite, dolomite, null]
        profile: {$ref: '#/components/schemas/AgentWorkflowUploadProfile'}
        workflowId: {type: [string, 'null'], description: 已绑定的工作流UUID；未绑定时为null}
        createdAt: {type: string, format: date-time, description: 上传时间}
    AgentWorkflowUploadList:
      type: object
      description: 一个批次的上传资料
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          description: 按上传时间排列
          items: {$ref: '#/components/schemas/AgentWorkflowUpload'}
    AgentFieldMappingTarget:
      type: object
      description: 一个规范字段的对应建议
      additionalProperties: false
      required: [key, label, required, field, reason]
      properties:
        key: {type: string, description: 规范字段名，例如name、geo_sym}
        label: {type: string, description: 规范字段的中文说明}
        required: {type: boolean, description: 是否必须对应}
        field: {type: [string, 'null'], description: 建议对应的原始字段；不对应时为null}
        reason: {type: string, description: 智能体给出的判断依据}
    AgentFieldMappingRole:
      type: object
      description: 一份资料的字段对应建议
      additionalProperties: false
      required: [role, label, resourceId, fileName, fields, targets]
      properties:
        role: {type: string, description: 资料角色}
        label: {type: string, description: 角色中文名}
        resourceId: {type: integer, description: 上传资料的数据资源ID}
        fileName: {type: string, description: 原始文件名}
        fields:
          type: array
          description: 可选择的原始字段
          items: {type: string, description: 字段名}
        targets:
          type: array
          description: 规范字段及建议
          items: {$ref: '#/components/schemas/AgentFieldMappingTarget'}
    AgentFieldMappingReview:
      type: object
      description: 通用地质推理的字段确认环节；只在geology_generic场景出现
      additionalProperties: false
      required: [roles, questions, modelMode, confirmed]
      properties:
        roles:
          type: array
          description: 需要确认字段的资料；栅格资料不出现
          items: {$ref: '#/components/schemas/AgentFieldMappingRole'}
        questions:
          type: array
          description: 智能体需要用户回答的问题，例如无法识别地层字段
          items: {type: string, description: 问题}
        modelMode: {type: string, enum: [real, mock], description: 建议来自真实模型或模拟模型}
        confirmed: {type: boolean, description: 用户是否已确认}
    AgentWorkflowConfirmation:
      type: object
      description: 用户对当前预览计划或候选结果的审核选择。
      additionalProperties: false
      required:
      - planHash
      properties:
        planHash:
          type: string
          description: 当前预览返回的计划哈希。
          minLength: 1
          maxLength: 64
        decision:
          type: string
          description: approve 继续现有确认流程；reject 仅在等待审核时停止后续流程。
          enum: [approve, reject]
          default: approve
        feedback:
          type: string
          description: 人工审核意见，作为判断依据保存。
          maxLength: 4000
          default: ''
        selectedSuggestionIds:
          type: array
          description: 地质成果review_modifications阶段approve提交本字段或综合推理紧凑选择suggestionSelection，只执行当前planHash下所选建议。传统地质修正场景至少一项且最多30项；综合推理同族不设对象数量上限，允许空数组明确选择不修改。新蚀变流程每组一个ID，岩性构造及旧任务按对象。待裁定/例外只有明确选择候选编号后执行，不属于普通建议全选；模型不得裁定。只接受快照的候选动作和目标，不接受额外目标参数。reject省略，其他阶段不得扩大操作范围。
          minItems: 0
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 64, description: 当前实际问题与模型建议或用户候选绑定的稳定标识}
        suggestionSelection:
          type: object
          description: 综合推理审批的紧凑选择，与selectedSuggestionIds互斥。后端在当前planHash冻结方案内展开；普通建议默认全选，待裁定和例外只有includedIds显式选择才纳入。新蚀变组视为一个建议。
          additionalProperties: false
          required: [base, excludedIds, includedIds]
          properties:
            base: {type: string, const: suggested, description: 以本次冻结方案中可执行普通建议为基集，不含待裁定和例外}
            excludedIds:
              type: array
              uniqueItems: true
              description: 从普通建议基集排除的建议ID
              items: {type: string, minLength: 1, maxLength: 64, description: 冻结建议ID}
            includedIds:
              type: array
              uniqueItems: true
              description: 额外明确批准的待裁定或例外候选ID
              items: {type: string, minLength: 1, maxLength: 64, description: 冻结候选建议ID}
        alterationActions:
          type: object
          description: 新蚀变流程用户对已选择稳定组的动作覆盖；键为AG组标识，值为保留、降权或剔除。仅综合推理review_modifications批准时允许，必须属于本次冻结且已选择的组；系统校验后冻结并执行。岩性构造及历史对象不得使用。
          additionalProperties:
            type: string
            enum: [keep, downweight, exclude]
            description: 用户明确批准的组动作，降权固定0.5，保留1，剔除0
        fieldMapping:
          type: object
          description: 通用地质推理字段确认环节approve必填。键为资料角色，值为规范字段到原始字段的对应；null表示不对应。必需字段必须对应真实字段，其他阶段不得提交。
          maxProperties: 9
          additionalProperties:
            type: object
            description: 一份资料的字段对应
            maxProperties: 8
            additionalProperties:
              type: [string, 'null']
              description: 原始字段名
              maxLength: 120
    AgentModificationReview:
      type: object
      description: 地质成果修改建议及持久批准范围；仅相应工作流提供，客户端不提交修改坐标或目标值。
      additionalProperties: false
      required: [proposalHash, suggestions, approvedSuggestionIds]
      properties:
        proposalHash:
          type: string
          description: 实际问题清单与规范化模型建议的内容哈希；方案改变必须重新批准。
        suggestions:
          type: array
          description: 由模型选择、由实际检查清单固定对象与空间范围的建议；综合场景支持按对象和动作集中批准。
          items: {$ref: '#/components/schemas/AgentModificationSuggestion'}
        approvedSuggestionIds:
          type: array
          description: 后端已保存的获批建议标识；尚未批准时为空。
          items: {type: string, description: 当前建议标识}
    AgentTrialRuleBinding:
      type: object
      description: 服务端核验项目、场景和修订后的试用知识；状态保持草稿，仅本案例可用
      additionalProperties: false
      required: [id, revision, ruleId, ruleVersion, title, parameters]
      properties:
        id: {type: integer, minimum: 1, description: 知识条目编号}
        revision: {type: integer, minimum: 1, description: 冻结知识修订}
        ruleId: {type: string, description: 本案例规则编号}
        ruleVersion: {type: string, description: 冻结规则版本}
        title: {type: string, description: 试用规则标题}
        parameters: {type: object, description: 实际传给算子的规则参数, additionalProperties: true}
    AgentMultiElementMap:
      type: object
      description: 当前真实任务的地图资源；输入为模拟识别演示，输出只引用本轮实际计算，不引用交付包PNG
      additionalProperties: false
      properties:
        alterationRasters:
          type: array
          description: 新栅格流程各矿物的修改前后与变更栅格，引用本次计算输出ID，经现有map-preview接口鉴权读取统一配色PNG；不是资源ID
          items:
            type: object
            additionalProperties: false
            required: [mineral, beforeOutputId]
            properties:
              mineral: {type: string, description: 矿物角色名}
              beforeOutputId: {type: integer, minimum: 1, description: 修改前识别栅格计算输出ID}
              afterOutputId: {type: integer, minimum: 1, description: 修正后COG计算输出ID}
              changesOutputId: {type: integer, minimum: 1, description: 规则变更编码栅格计算输出ID}
        before:
          type: object
          description: 当前检查采用的明确上游版本
          additionalProperties: false
          properties:
            lithology: {type: integer, minimum: 1, description: 岩性输入资源}
            faults: {type: integer, minimum: 1, description: 构造输入资源}
        after:
          type: object
          description: 获批计算形成的新版本，未形成时缺省
          additionalProperties: false
          properties:
            lithology: {type: integer, minimum: 1, description: 本轮修正岩性资源}
            faults: {type: integer, minimum: 1, description: 本轮修正构造资源；算子1.0.5起为删除获批剔除线的干净图层，全剔除时缺省，不回退原图}
        changes:
          type: array
          description: 真实变化线点面图层，不含未批准建议；算子1.0.5起为修改前几何的修正记录，含实际动作、原/新代号、宿主编号、规则与批准理由
          items: {type: integer, minimum: 1, description: 变化图层资源}
        checks:
          type: array
          description: 当前实际检查的疑点及待核查图层
          items: {type: integer, minimum: 1, description: 问题图层资源}
        beforeAlterations: {type: integer, minimum: 1, description: 本次检查实际读取的修改前矿物面图层，历史任务可缺省}
        alterations: {type: integer, minimum: 1, description: 算子1.0.5起为仅含有效参与项的干净蚀变面图层（feature_id及alt），全剔除时缺省；历史任务为保留原识别信息和处理状态的图层}
        beforeIntersections: {type: integer, minimum: 1, description: 同参数下修改前实际重建的交汇点，历史任务未保存时可缺省}
        intersections: {type: integer, minimum: 1, description: 几何与推测交汇点，inferred字段决定实心或空心}
        beforeProspects: {type: integer, minimum: 1, description: 同参数下修正前优先核查远景区}
        afterProspects: {type: integer, minimum: 1, description: 同参数下修正后优先核查远景区；A/B为证据组合等级}
    AgentModificationSuggestion:
      type: object
      description: 一项有实际图斑、规则、知识与空间预览支持的修改建议。
      additionalProperties: false
      required: [id, kind, featureId, title, currentState, suggestedState, reason, areaM2, ruleId, knowledgeRefs, preview, bounds]
      properties:
        groupId: {type: string, description: 综合推理按要素、规则、动作、目标代号及检查状态形成的稳定分组；审批仍提交展开后的对象建议ID，待裁定与例外不纳入整组批准}
        id: {type: string, description: 当前问题与建议内容绑定的标识，不由客户端编造}
        kind: {type: string, enum: [fill_gap, set_age, multi_element], description: 内部漏填、时代属性或多要素建议；综合场景具体操作由action标识}
        featureId: {type: string, description: 当前数据中的稳定图斑标识}
        title: {type: string, description: 简短问题标题}
        currentState: {type: string, description: 当前地图或属性的可读状态}
        suggestedState: {type: string, description: 建议修正后的可读状态}
        reason: {type: string, description: 模型根据当次实际知识和结果给出的简短理由}
        areaM2: {type: number, minimum: 0, description: 实际修改范围平方米面积；属性修改展示对应对象范围}
        ruleId: {type: string, description: 本次结构化专家规则标识}
        element: {type: string, enum: [lithology, structure, alteration], description: 综合场景建议作用于岩性、构造或蚀变}
        action: {type: string, description: 服务端冻结的建议动作；降权、保留、待裁定与剔除分别记录，客户端不提交新动作}
        observations: {type: object, description: 当次算法实测值与量纲，用于核对规则条件, additionalProperties: true}
        ruleConditions:
          type: array
          description: 当次规则成立所需条件
          items: {type: string, description: 可核对条件}
        exceptions:
          type: array
          description: 必须保留的地质例外与证据缺口
          items: {type: string, description: 例外或证据缺口}
        ruleRefs:
          type: array
          description: 本案例试用规则及具体知识版本来源
          items:
            type: object
            description: 一条显式绑定的试用规则引用
            additionalProperties: false
            required: [id, version, title, knowledgeId, revision, source]
            properties:
              id: {type: string, description: 规则编号}
              version: {type: string, description: 冻结规则版本}
              title: {type: string, description: 规则标题}
              knowledgeId: {type: integer, minimum: 1, description: 已授权试用知识条目编号}
              revision: {type: integer, minimum: 1, description: 知识修订}
              source: {type: string, description: 原来源及核实程度}
        lengthM: {type: number, minimum: 0, description: 构造对象实测米制长度；不以面积代替线长度}
        status: {type: string, description: 检查规则的建议、待裁定、例外、保留、降权或剔除状态；用户选候选不会改变规则判断}
        candidateAction: {type: string, enum: [reclassify, exclude, downweight], description: 本次冻结检查快照的候选动作；仅待裁定或例外对象提供，默认保留且不得被模型或建议全选纳入，须用户明确选择其建议编号}
        candidateTargetCode: {type: string, description: 候选重分类的实测相邻目标代号；非类别动作为空，不接受用户或模型另填目标}
        knowledgeRefs:
          type: array
          minItems: 1
          description: 当前检索实际返回的知识与修订，权限继续按原项目检查。
          items:
            type: object
            additionalProperties: false
            required: [id, revision, title]
            description: 一条实际知识依据。
            properties:
              id: {type: integer, minimum: 1, description: 实际知识编号}
              revision: {type: integer, minimum: 1, description: 实际知识修订}
              title: {type: string, description: 用户可读知识标题}
        preview:
          $ref: '#/components/schemas/GeoJSONGeometry'
          description: 从实际问题计算得到的WGS84修改范围，不是客户端编辑参数。
        bounds:
          type: array
          minItems: 4
          maxItems: 4
          description: WGS84西、南、东、北界，用于建议预览与定位。
          items: {type: number, description: 经纬度边界值}
    ResourceDeletePreviewRequest:
      type: object
      description: 当前项目内的待删除资源集合，预览不产生删除。
      additionalProperties: false
      required: [resourceIds]
      properties:
        resourceIds:
          type: array
          minItems: 1
          maxItems: 100
          description: 待核对资源，重复编号只处理一次。
          items: {type: integer, minimum: 1, description: 数据资源编号}
    ResourceDeletePreviewItem:
      type: object
      description: 当前授权资源的引用影响，历史清理需要用户明确确认。
      additionalProperties: false
      required: [resourceId, name, status, detail, historyReferenceCount]
      properties:
        resourceId: {type: integer, description: 请求中的资源编号}
        name: {type: [string, 'null'], description: 可访问资源名称，不可访问时为空}
        status: {type: string, enum: [deletable, confirmation_required, blocked, not_found], description: 可删除、需确认历史清理、仍受保护或不存在}
        detail: {type: string, description: 对用户可读的引用影响或保护原因}
        historyReferenceCount: {type: integer, minimum: 0, description: 删除将解除的已结束任务或工作流关联数量}
    ResourceDeletePreviewResponse:
      type: object
      description: 删除影响与绑定用户、项目、资源和引用快照的签名确认凭证。
      additionalProperties: false
      required: [items, confirmationToken]
      properties:
        items:
          type: array
          description: 按首次请求顺序返回，受保护项确认后仍不删除。
          items: {$ref: '#/components/schemas/ResourceDeletePreviewItem'}
        confirmationToken: {type: string, description: 10分钟内有效，引用变化后重新预览，不授予新权限}
    ResourceBulkDeleteRequest:
      type: object
      description: 当前项目待删除资源，不接受文件路径或其他项目资源。
      additionalProperties: false
      required: [resourceIds, confirmed]
      properties:
        resourceIds:
          type: array
          description: 1 至 100 个正整数资源编号，重复编号只处理一次。
          minItems: 1
          maxItems: 100
          items:
            type: integer
            minimum: 1
        confirmed:
          type: boolean
          const: true
          description: 用户在界面明确确认永久删除。
        historyConfirmationToken:
          type: string
          description: 用户检查预览并确认清理历史关联后的签名凭证；仅计算结果允许清理已结束计算和科研记录，名称、来源与删除记录保留，运行中依赖继续保护。
    ResourceBulkDeleteItem:
      type: object
      description: 一项资源的真实删除结果。
      additionalProperties: false
      required: [resourceId, name, status, detail]
      properties:
        resourceId:
          type: integer
          description: 请求中的资源编号。
        name:
          type: [string, 'null']
          description: 可访问资源名称；not_found 时为空。
        status:
          type: string
          description: deleted 已删除；blocked 存在引用等保护；not_found 不存在或不可访问；failed 存储或数据库操作失败。
          enum: [deleted, blocked, not_found, failed]
