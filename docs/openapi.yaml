                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 活动运行或设置版本冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 并发、排队或每日额度已满
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
