        description:
          type: string
          description: 能力说明。
    QueryRequest:
      type: object
      required:
      - attributeFilters
      - spatialFilter
      - limit
      properties:
        displayGeometry:
          type: boolean
          default: false
          description: 仅地图显示使用的量化几何；WGS84统一1e-5度网格，全体图斑边界共同节点化并量化，保持共享边界一致；不做任何形状简化，仅移除连续重复点和零面积退化环。超过280 KiB gzip目标仍保留量化精度并返回警告。不修改存储数据，不用于编辑、计算或精确导出。省略时返回原精度。
        attributeFilters:
          type: array
          description: 属性过滤条件
          items:
            $ref: '#/components/schemas/AttributeFilter'
        spatialFilter:
          oneOf:
          - $ref: '#/components/schemas/SpatialFilter'
          - type: 'null'
          description: 空间过滤条件；不启用空间过滤时为 null
        limit:
          type: integer
          default: 30000
          description: 返回结果上限
    AttributeFilter:
      type: object
      required:
      - field
      - operator
      - value
      properties:
        field:
          type: string
          description: 字段名
        operator:
          type: string
          enum:
          - contains
          - eq
          - ne
          - gt
          - gte
          - lt
          - lte
          - between
          description: 过滤操作符
        value:
          type: string
          description: 过滤值
        valueTo:
          type: string
          description: between 操作符时使用的结束值
    SpatialFilter:
      type: object
      required:
      - mode
      - geometry
      properties:
        mode:
          type: string
          enum:
          - rectangle
          - circle
          - ellipse
          - polygon
          description: 空间过滤绘制模式
        geometry:
          $ref: '#/components/schemas/GeoJSONGeometry'
    QueryResponse:
      type: object
      required:
      - resourceId
      - resourceName
      - totalCount
      - returnedCount
      - limit
      - limitExceeded
      - bounds
      - elapsedMs
      - fields
      - geojson
      - warnings
      properties:
        resourceId:
          type: integer
          description: 查询资源 ID
        resourceName:
          type: string
          description: 查询资源名称
        totalCount:
          type: integer
          description: 过滤后的总数
        returnedCount:
          type: integer
          description: 本次返回数量
        limit:
          type: integer
          description: 返回上限
        limitExceeded:
          type: boolean
          description: 命中数量是否超过返回上限；为 true 时 geojson 仅包含前 limit 条有效结果。
        bounds:
          type: array
          minItems: 0
          maxItems: 4
          description: 本次返回有效结果的 WGS84 边界 [minLng, minLat, maxLng, maxLat]；无有效返回结果时为空数组。
          items:
            type: number
        elapsedMs:
          type: integer
          minimum: 0
          description: 后端执行本次资源查询耗时，单位毫秒。
        fields:
          type: array
          description: 查询结果字段
          items:
            $ref: '#/components/schemas/FieldInfo'
        geojson:
          $ref: '#/components/schemas/GeoJSONFeatureCollection'
        warnings:
          type: array
          description: 地理坐标校验警告
          items:
            $ref: '#/components/schemas/ValidationWarning'
    ExportRequest:
      type: object
      required:
      - reproject
      - clip
      - items
      properties:
        epsg:
          type:
          - integer
          - 'null'
          default: 4326
          description: 目标 EPSG，reproject 为 true 时使用
        reproject:
          type: boolean
          default: true
          description: 是否重投影导出
        clip:
          type: boolean
          default: false
          description: 是否按空间范围裁切
        clipGeometry:
          oneOf:
          - $ref: '#/components/schemas/GeoJSONGeometry'
          - type: 'null'
          description: 裁切 GeoJSON 几何
        format:
          type: string
          enum:
          - geojson
          - shapefile
          default: geojson
          description: 矢量图层导出格式；选择 shapefile 时后端将 Shapefile 组件文件写入目录后压缩为 ZIP
        items:
          type: array
          description: 待导出图层
          items:
            $ref: '#/components/schemas/ExportItem'
    ExportItem:
      type: object
      required:
      - layerType
      - name
      properties:
        layerType:
          type: string
          enum:
          - vector
          - raster
          description: 图层类型
        name:
          type: string
          description: 导出图层名称
        resourceId:
          type:
          - integer
          - 'null'
          description: 数据资源 ID
        geojson:
          oneOf:
          - $ref: '#/components/schemas/GeoJSONFeatureCollection'
          - type: 'null'
          description: 矢量图层查询结果
        datasetId:
          type:
          - integer
          - 'null'
          description: 栅格数据集 ID
        sourceCrs:
          oneOf:
          - type: string
          - type: integer
          - type: 'null'
          description: 源坐标系统
    LayerListResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          description: 可加载图层列表
          items:
            $ref: '#/components/schemas/MapLayer'
    SearchResponse:
      type: object
      required:
      - resources
      properties:
        resources:
          type: array
          description: 匹配的数据资源
          items:
            $ref: '#/components/schemas/DataResource'
    RasterDatasetListResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          description: 栅格数据集列表
          items:
            $ref: '#/components/schemas/RasterDataset'
    RasterImportRequest:
      type: object
      required:
      - sourcePath
      properties:
        sourcePath:
          type: string
          description: 源文件相对路径（相对于科研数据根目录）
        name:
          type: string
          description: 前端显示的数据集名称；为空时默认取源文件名，不包含后端后台唯一存储文件名
        async:
          type: boolean
          default: true
          description: 是否异步执行
    RasterImportUploadRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
          description: 兼容旧调用的单个栅格文件。新前端应使用 files。
        files:
          type: array
          minItems: 1
          description: 栅格主文件及配套文件，支持 GeoTIFF/COG、IMG、VRT 数据包和 ENVI DAT/BSQ/BIL/BIP + HDR。
          items:
            type: string
            format: binary
        name:
          type: string
          description: 前端显示的数据集名称；为空时默认取上传文件名，不展示后端保存到 uploaded/ 目录的唯一存储文件名
        payload:
          type: string
          description: JSON 字符串，结构遵循 RasterImportCommitRequest；省略时使用兼容默认值。
    RasterSourceAsset:
      type: object
      required:
      - name
      - size
      - role
      properties:
        name:
          type: string
          description: 数据包内文件名
        size:
          type: integer
          minimum: 0
          description: 文件大小，单位字节
        role:
          type: string
          enum:
          - primary
          - header
          - auxiliary
          - referenced
          description: 文件在栅格数据包中的作用
    RasterImportPreviewResponse:
      type: object
      required:
      - primaryFileName
      - sourceFormat
      - files
      - metadata
      - bounds4326
      - defaultRules
      - suggestedName
      - rasterKind
      - resampling
      - warnings
      properties:
        primaryFileName:
          type: string
          description: 识别到的主栅格文件名
        sourceFormat:
          type: string
          description: GDAL 驱动简称，例如 GTiff、ENVI、HFA 或 VRT
        files:
          type: array
          description: 数据包文件及角色
          items:
            $ref: '#/components/schemas/RasterSourceAsset'
        metadata:
          $ref: '#/components/schemas/RasterMetadata'
        bounds4326:
          type: array
          description: WGS84 空间范围 [west, south, east, north]
          items:
            type: number
        defaultRules:
          $ref: '#/components/schemas/RasterSymbolizationRules'
        suggestedName:
          type: string
          description: 建议的资源显示名称
        rasterKind:
          type: string
          enum:
          - imagery
          - continuous
          - categorical
          description: 根据波段数量和数据类型推断的栅格语义
        resampling:
          type: string
          enum:
          - nearest
          - bilinear
          - cubic
          description: 建议的预处理重采样方式
        warnings:
          type: array
          description: 非阻断预检提示，例如缺少波段语义或无法识别 EPSG
          items:
            type: string
    RasterImportCommitRequest:
      type: object
      required:
        - primaryFileName
        - name
        - rasterKind
        - resampling
        - defaultRules
        - accessGroupIds
      properties:
        primaryFileName:
          type: string
          description: 预检确认的主栅格文件名
        name:
          type: string
          description: 数据资源、栅格数据集和地图图层的显示名称
        rasterKind:
          type: string
          enum:
            - imagery
            - continuous
            - categorical
          description: 栅格数据语义
        resampling:
          type: string
          enum:
            - nearest
            - bilinear
            - cubic
          description: 生成 EPSG:3857 展示 COG 时使用的重采样方式
        defaultRules:
          $ref: "#/components/schemas/RasterSymbolizationRules"
        accessGroupIds:
          deprecated: true
          type: array
          description: 历史角色元数据，不参与对象可见性判断。访问由当前项目标签、发布状态和功能权限控制；新界面不提供角色可见性配置。
          items:
            type: integer
        categoryCode:
          type: string
          description: 甲方地理/非地理两类体系中的业务主分类节点编码；V1 新客户端提交，旧客户端兼容期可省略
    RasterRenderRequest:
      type: object
      required:
      - layerId
      properties:
        layerId:
          type: integer
          description: 栅格图层 ID
        rulesMode:
          type: string
          enum:
          - default
          - custom
          default: default
          description: 符号化规则模式
        rules:
          oneOf:
          - $ref: '#/components/schemas/RasterSymbolizationRules'
          - type: 'null'
          description: 自定义符号化规则
    RasterRenderAsyncRequest:
      type: object
      properties:
        layerId:
          type:
          - integer
          - 'null'
          description: 栅格图层 ID
        datasetId:
          type:
          - integer
          - 'null'
          description: 栅格数据集 ID
        rulesMode:
          type: string
          enum:
          - default
          - custom
          default: default
          description: 符号化规则模式
        rules:
          oneOf:
          - $ref: '#/components/schemas/RasterSymbolizationRules'
          - type: 'null'
          description: 自定义符号化规则
    RasterRenderResult:
      type: object
      required:
      - delivery
      - datasetId
      - layerId
      - styleHash
      - tileUrl
      - minZoom
      - maxZoom
      - tileSampling
      - status
      - bounds3857
      - bounds4326
      - imageCoordinates
      - rules
      properties:
        delivery:
          type: string
          enum:
          - xyz
          description: 栅格交付方式
        datasetId:
          type: integer
          description: 栅格数据集 ID
        layerId:
          type:
          - integer
          - 'null'
          description: 关联图层 ID
        styleHash:
          type: string
          description: 符号化样式哈希
        tileUrl:
          type: string
          description: XYZ 瓦片 URL 模板
        minZoom:
          type: integer
          minimum: 0
          maximum: 22
          description: XYZ 瓦片源可用的最小级别；当前统一为 0
        maxZoom:
          type: integer
          minimum: 0
          maximum: 22
          description: 数据原生分辨率对应的最大瓦片级别；客户端超过该级别时只放大该级瓦片，不继续请求更高层级
        tileSampling:
          type: string
          enum:
          - nearest
          - linear
          description: 客户端纹理采样方式；分类栅格固定为 nearest，连续栅格与影像为 linear
        status:
          type: string
          enum:
          - ready
          description: 渲染结果状态
        bounds3857:
          type: array
          description: EPSG:3857 边界
          items:
            type: number
        bounds4326:
          type: array
          description: WGS84 边界
          items:
            type: number
        imageCoordinates:
          type: array
          description: WGS84 图像角点坐标
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: number
        rules:
          $ref: '#/components/schemas/RasterSymbolizationRules'
    UniqueValuesRequest:
      type: object
      required:
      - datasetId
      properties:
        datasetId:
          type: integer
          description: 栅格数据集 ID
        band:
          type: integer
          default: 1
          description: 1-based 波段编号
    UniqueValuesResponse:
      type: object
      required:
      - band
      - items
      properties:
        band:
          type: integer
          description: 1-based 波段编号
        items:
          type: array
          description: 唯一值分类项
          items:
            type: object
            required:
            - value
            - color
            - label
            properties:
              value:
                type: number
                description: 栅格像元值
              color:
                type: string
                description: 分类颜色
              label:
                type: string
                description: 分类标签
    GeoJSONGeometry:
      type: object
      required:
      - type
      - coordinates
      properties:
        type:
          type: string
          enum:
          - Point
          - LineString
          - Polygon
          - MultiPoint
          - MultiLineString
          - MultiPolygon
          description: GeoJSON 几何类型
        coordinates:
          description: GeoJSON 坐标数组
    ValidationWarning:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: 警告代码，如 missing_geometry、invalid_longitude、coordinate_uncertainty
        count:
          type: integer
          description: 受影响的记录数
        message:
          type: string
          description: 警告描述
        minMeters:
          type: number
          description: 坐标不确定性最小误差，单位米
        maxMeters:
          type: number
          description: 坐标不确定性最大误差，单位米
        ratio:
          type: number
          description: 坐标不确定性误差倍率
    GeoJSONFeatureCollection:
      type: object
      required:
      - type
      - features
      properties:
        type:
          type: string
          enum:
          - FeatureCollection
          description: GeoJSON FeatureCollection 类型
        features:
          type: array
          description: GeoJSON 要素列表
          items:
            $ref: '#/components/schemas/GeoJSONFeature'
    GeoJSONFeature:
      type: object
      required:
      - type
      - geometry
      - properties
      properties:
        id:
          oneOf:
          - type: string
          - type: integer
          description: GeoJSON 要素 ID
        type:
          type: string
          enum:
          - Feature
          description: GeoJSON Feature 类型
        geometry:
          $ref: '#/components/schemas/GeoJSONGeometry'
        properties:
          type: object
          additionalProperties: true
          description: GeoJSON 属性对象
    WorkspaceSceneSummary:
      type: object
      required:
        - id
        - kind
        - name
        - description
        - owner
        - accessGroups
        - isOwner
        - canEdit
        - canDelete
        - canManageAccess
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          description: 工程 ID
        kind:
          type: string
          enum:
            - project
          description: 场景类型，固定为工程
        name:
          type: string
          description: 工程或专题名称
        description:
          type: string
          description: 工程或专题说明
        owner:
          $ref: "#/components/schemas/WorkspaceSceneOwner"
        accessGroups:
          type: array
          description: 历史兼容元数据；工程按创建者、已接受分享及超级管理员规则访问，旧角色字段不授予访问。
          items:
            $ref: "#/components/schemas/AdminDataResourceAccessGroup"
          deprecated: true
        isOwner:
          type: boolean
          description: 当前用户是否为该工程专题所属用户
        canEdit:
          type: boolean
          description: 当前用户是否可在普通工作台编辑该工程专题；仅所属用户或超级管理员且具备 `catalog.change_workspacescene` 时为 true
        canDelete:
          type: boolean
          description: 当前用户是否可在普通工作台删除该工程专题；仅所属用户或超级管理员且具备 `catalog.delete_workspacescene` 时为 true
        canManageAccess:
          type: boolean
          description: 兼容管理标记；仅创建者或超级管理员可管理分享，接受分享的用户为 false，旧角色字段不授予访问。
          deprecated: true
        createdAt:
          type: string
          format: date-time
          description: 创建时间
        updatedAt:
          type: string
          format: date-time
          description: 更新时间
        projectTagId:
          type: integer
          description: 单个业务项目标签 ID，缺省为公开项目 1。all 汇总已取消，业务接口读写均仅接受一个具体项目，传 all 返回 400。与地图工程
            projectId 不同；平台管理接口独立执行管理权限检查。
      description: 工程摘要；不传输图层快照，加载工程时调用详情接口。

    "ComputeInputSpec": {"type": "object", "description": "命名输入及数据条件", "properties": {"key": {"type": "string", "description": "稳定名称"}, "label": {"type": "string", "description": "显示名称"}, "kind": {"type": "string", "description": "输入类型", "enum": ["raster", "vector", "table"]}, "required": {"type": "boolean", "description": "必填"}, "minBands": {"type": "integer", "description": "最少波段数"}, "geometryTypes": {"type": "array", "description": "允许的几何类型，空表示不限", "items": {"type": "string", "description": "文字"}}}, "required": ["key", "label", "kind", "required"]}
    "ComputeParameterSpec": {"type": "object", "description": "受控参数表单描述；不接受脚本", "properties": {"key": {"type": "string", "description": "参数名"}, "label": {"type": "string", "description": "名称"}, "type": {"type": "string", "description": "控件类型", "enum": ["number", "integer", "string", "boolean", "enum", "field", "band"]}, "required": {"type": "boolean", "description": "必填"}, "default": {"description": "默认值"}, "min": {"type": "number", "description": "最小值"}, "max": {"type": "number", "description": "最大值"}, "choices": {"type": "array", "description": "枚举值", "items": {"type": "string", "description": "文字"}}, "input": {"type": "string", "description": "字段或波段所属输入"}, "help": {"type": "string", "description": "说明"}, "when": {"type": "object", "description": "条件显示：key 和 equals；只支持前置参数等值", "additionalProperties": true}}, "required": ["key", "label", "type", "required"]}
    "ComputeOutputSpec": {"type": "object", "description": "算法输出声明", "properties": {"key": {"type": "string", "description": "名称"}, "label": {"type": "string", "description": "显示名称"}, "kind": {"type": "string", "description": "类型", "enum": ["raster", "vector", "table", "image", "report", "archive"]}, "file": {"type": "string", "description": "输出目录内文件名"}, "required": {"type": "boolean", "description": "是否必须输出"}}, "required": ["key", "label", "kind", "file", "required"]}
    "ComputeManifest": {"type": "object", "description": "operator.yaml 规范化清单 v1；入口固定 main.py:run(context)", "properties": {"schemaVersion": {"type": "integer", "description": "清单版本", "const": 1}, "identifier": {"type": "string", "description": "算法稳定标识"}, "name": {"type": "string", "description": "名称"}, "version": {"type": "string", "description": "不可变版本"}, "description": {"type": "string", "description": "用途与限制"}, "author": {"type": "string", "description": "作者和来源"}, "runtime": {"type": "string", "description": "经管理员配置的运行环境 ID"}, "inputs": {"type": "array", "description": "列表", "items": {"$ref": "#/components/schemas/ComputeInputSpec"}}, "parameters": {"type": "array", "description": "列表", "items": {"$ref": "#/components/schemas/ComputeParameterSpec"}}, "outputs": {"type": "array", "description": "列表", "items": {"$ref": "#/components/schemas/ComputeOutputSpec"}}, "timeoutSeconds": {"type": "integer", "description": "算法时限，受平台上限约束"}, "deterministic": {"type": "boolean", "description": "中断后是否可安全重做一次"}, "agent": {"type": "object", "description": "可选智能体调用策略；旧清单省略时保持原权限行为，显式false禁止智能体调用", "properties": {"enabled": {"type": "boolean", "description": "是否允许受平台策略与用户权限控制的智能体调用"}}, "required": ["enabled"], "additionalProperties": false}, "qualityReport": {"type": "object", "description": "可选质量报告声明；worker验证并传播到输出。声明但缺失/无效或needs_review时阻止自动入库，报告最大64KiB", "properties": {"file": {"type": "string", "description": "单层ASCII JSON文件名，与普通输出不重名", "pattern": "^[a-zA-Z0-9][a-zA-Z0-9_.-]{0,145}\\.json$"}}, "required": ["file"], "additionalProperties": false}}, "required": ["schemaVersion", "identifier", "name", "version", "description", "author", "runtime", "inputs", "parameters", "outputs", "timeoutSeconds", "deterministic"]}
    "ComputeVersion": {"type": "object", "description": "不可变算法版本及验证状态", "properties": {"id": {"type": "integer", "description": "标识"}, "version": {"type": "string", "description": "文字"}, "status": {"type": "string", "description": "版本状态", "enum": ["draft", "published", "archived"]}, "checksum": {"type": "string", "description": "ZIP SHA256"}, "manifest": {"$ref": "#/components/schemas/ComputeManifest"}, "runtimeDigest": {"type": "string", "description": "镜像不可变摘要"}, "validated": {"type": "boolean", "description": "有成功的隔离试运行"}, "createdAt": {"type": "string", "description": "上传时间", "format": "date-time"}}, "required": ["id", "version", "status", "checksum", "manifest", "runtimeDigest", "validated", "createdAt"]}
