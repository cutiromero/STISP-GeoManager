        budgetProfile:
          $ref: '#/components/schemas/AgentBudgetProfileId'
        maxOutputTokens:
          type: integer
          description: 思考与正文生成额度
          minimum: 128
        model:
          type: string
          description: 可见模型别名
        prompt:
          type: string
          description: 问题
          minLength: 1
          maxLength: 1048576
        idempotencyKey:
          type: string
          description: 每次用户操作唯一键，网络重试复用
          minLength: 8
          maxLength: 80
        thinkingMode:
          type: string
          description: 思考模式
          enum:
          - fast
          - deep
        resourceIds:
          type: array
          description: 空数组表示自主发现；非空进一步缩小数据范围，数量服从管理员maxResources策略（0不限）
          items:
            type: integer
            description: 对象 ID
            minimum: 1
        attachmentIds:
          type: array
          description: 当前用户已上传且授权的附件 ID
          items:
            type: integer
            description: 附件 ID
            minimum: 1
        internetEnabled:
          type: boolean
          description: 是否允许本轮使用受控互联网检索；服务端仍按策略和权限复核
      required:
      - model
      - prompt
      - idempotencyKey
      additionalProperties: false
    AgentResearchScenario:
      type: string
      description: 当前授权项目内已登记科研场景；geology_map_review 为已有地质检查；geology_multi_element_reasoning 为海德乌拉岩性、构造与蚀变综合推理演示，分段由parameters.segment明确；geology_generic 为用户上传资料的通用地质推理，资料在任务中上传，不提供预设
      enum: [ecology_investigation, geology_correction, geology_age_correction, geology_map_review, geology_multi_element_reasoning, geology_generic]
    AgentResearchQuestion:
      type: object
      description: 模型提出的必要澄清；选择与自由文本均由后续模型重新解析
      properties:
        key: {type: string, description: 稳定问题键}
        label: {type: string, description: 面向用户的问题}
        kind: {type: string, enum: [choice, text, number, resource], description: 答案控件}
        required: {type: boolean, description: 是否必须回答}
        options:
          type: array
          description: 可选回答；resource值为平台资源标识的字符串
          items:
            type: object
            description: 可读选项
            properties:
              value: {type: string, description: 提交值}
              label: {type: string, description: 展示文字}
              description: {type: string, description: 选择含义}
            required: [value, label]
            additionalProperties: false
      required: [key, label, kind, required, options]
      additionalProperties: false
    AgentResearchIntent:
      type: object
      description: 跨聊天轮次保存的科研任务意图、澄清和工作流关联；不以聊天文字冒充计算完成
      properties:
        originRunId: {type: integer, minimum: 1, description: 原科研请求运行}
        revision: {type: string, description: 当前计划修订，回答与审核须精确匹配}
        scenario: {$ref: '#/components/schemas/AgentResearchScenario'}
        status:
          type: string
          description: 科研任务状态，独立于聊天运行生成状态
          enum: [clarifying, planning, running, waiting_approval, succeeded, failed, cancelled]
        goal: {type: string, description: 解析后的用户目标}
        message: {type: string, description: 当前进度或需要回答的问题}
        questions:
          type: array
          description: 当前待回答问题，已明确时为空
          items: {$ref: '#/components/schemas/AgentResearchQuestion'}
        inputs:
          type: object
          description: 明确输入角色到已授权资源标识
          additionalProperties: {type: integer, minimum: 1, description: 当前项目资源}
        parameters: {type: object, description: 已解析并验证的任务参数；由场景受控校验, additionalProperties: true}
        inputSummary:
          type: array
          description: 面向用户的数据角色、名称及模拟说明
          items:
            type: object
            description: 一个确定的输入角色
            properties:
              role: {type: string, description: 输入角色键}
              label: {type: string, description: 可读角色}
              resourceId: {type: integer, minimum: 1, description: 已授权资源}
              name: {type: string, description: 数据名称}
              sourceNote: {type: string, description: 模拟资料或真实来源说明}
            required: [role, label, resourceId, name, sourceNote]
            additionalProperties: false
        workflowId: {type: [string, 'null'], format: uuid, description: 关联真实工作流，尚未创建时为空}
      required: [originRunId, revision, scenario, status, goal, message, questions, inputs, parameters, inputSummary, workflowId]
      additionalProperties: false
    AgentResearchIntentUpdate:
      type: object
      description: 回答或确认当前计划；自由文本与结构化选项由模型共同解析
      properties:
        action: {type: string, enum: [answer, confirm, cancel], description: 回答、明确审核确认或取消；通用地质推理的answer按当前阶段严格解析自然语言，不明确时保留卡片确认，不自动批准}
        revision: {type: string, minLength: 1, description: 最后读取的意图修订}
        answers:
          type: object
          description: 问题键到用户答案，不把选项标题当作代码执行；通用地质角色核对使用upload_资源ID到角色键（或skip），须完整核对所有资料，角色不得重复
          additionalProperties: {type: string, description: 用户选择或输入的文字}
        answer: {type: string, maxLength: 12000, description: 用户自由补充说明；通用地质任务已沿用配置且尚在本次计划批准前时，明确提交“修改角色和字段”会停止未执行的旧计划，保留历史并重新核对本批资料，不授权执行}
      required: [action, revision]
      additionalProperties: false
    AgentResearchDemoSummaryList:
