    AgentInteractionOption:
      type: object
      description: 模型依据当前任务提供的用户可选答案，不自动提交默认值。
      additionalProperties: false
      required: [value, label]
      properties:
        value: {type: string, description: 传回原任务的稳定选项值}
        label: {type: string, description: 用户可读选项}
        description: {type: string, description: 选项影响或适用条件}
    AgentInteractionQuestion:
      type: object
      description: 一项必要澄清或审核问题，允许用户选择或补充说明。
      additionalProperties: false
      required: [key, label, type, required]
      properties:
        key: {type: string, description: 本问题卡中的稳定字段键}
        label: {type: string, description: 需要用户确认的内容}
        type: {type: string, enum: [single, multiple, text], description: 单选、多选或文字}
        required: {type: boolean, description: 结构化作答是否必填，信息澄清可由补充文字交给模型解析}
        options:
          type: array
          description: 单选或多选项；文字问题可省略。
          items: {$ref: '#/components/schemas/AgentInteractionOption'}
        defaultValue:
          description: 供用户检查的建议值，需要用户点击确认。
          oneOf:
          - {type: string}
          - type: array
            items: {type: string}
          - {type: 'null'}
    AgentInteractionAnswer:
      type: object
      description: 已提交给原任务的用户回答快照。
      additionalProperties: false
      required: [submittedAt, submissionKey, answers, text]
      properties:
        submittedAt: {type: string, description: 服务端保存时间}
        submissionKey: {type: string, description: 本次提交的幂等键}
        answers:
          type: object
          description: 与问题字段键对应的单选、多选或文字答案。
          additionalProperties:
            oneOf:
            - {type: string}
            - type: array
              items: {type: string}
        text: {type: string, description: 用户提供的补充条件或自由文字回答}
    AgentInteraction:
      type: object
      description: 同一智能体任务内持久化的问题卡，旧卡不能覆盖新方案。
      additionalProperties: false
      required: [questionId, revision, kind, title, reason, questions, status, createdAt]
      properties:
        questionId: {type: string, description: 服务端签发的问题标识}
        revision: {type: integer, minimum: 1, description: 方案修订号}
        kind: {type: string, enum: [input, review], description: 信息澄清或用户审核；不替代已有地图修改批准机制}
        title: {type: string, description: 问题卡标题}
        reason: {type: string, description: 为什么需要用户确认，依据当前输入与工具结果}
        plan: {type: string, description: 当前简短执行计划}
        questions:
          type: array
          description: 模型提出的本轮必要问题。
          items: {$ref: '#/components/schemas/AgentInteractionQuestion'}
        status: {type: string, enum: [pending, answered, cancelled], description: 等待、已回答或已取消}
        createdAt: {type: string, description: 提问保存时间}
        answer: {$ref: '#/components/schemas/AgentInteractionAnswer'}
    AgentInteractionUpdate:
      type: object
      description: 将答案送回原任务或取消等待，重试复用同一提交键。
      additionalProperties: false
      required: [action, questionId, revision, submissionKey]
      properties:
        action: {type: string, enum: [answer, cancel], description: 确认回答并继续，或取消等待}
        questionId: {type: string, description: 当前问题标识，旧问题返回409}
        revision: {type: integer, minimum: 1, description: 当前问题的方案修订号}
        submissionKey: {type: string, minLength: 8, maxLength: 80, description: 唯一用户提交键，重复提交不重复启动}
        answers:
          type: object
          description: 结构化答案；文字澄清可配合text交给模型理解。
          additionalProperties:
            oneOf:
            - {type: string}
            - type: array
              items: {type: string}
        text: {type: string, description: 补充信息，与此前证据一同恢复给模型}
    AgentRun:
      type: object
