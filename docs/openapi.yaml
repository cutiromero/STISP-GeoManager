      summary: 查询操作日志
      description: 基于真实操作日志表返回可分页、可筛选的后台操作日志。登录用户始终可查看自己的操作日志；更大范围由 `core.view_all_operation_logs`、`core.view_group_operation_logs`
        和当前用户配置的 `operationLogGroupIds` 共同裁剪。非超级管理员主体无法看到超级管理员用户产生的日志。可通过 `userId` 精确筛选授权范围内的指定用户日志。
