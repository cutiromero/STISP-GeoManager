  /api/agent/workflows/:
    get:
      tags: [智能体]
      operationId: listAgentWorkflows
      summary: 恢复本人科研编排记录
      description: 默认保留当前项目本人最近三十个完整工作流。view=summary返回分页轻量历史，支持workflowType筛选，不读取plan/evidence/steps或重新扫描输入；详情接口另行验证数据权限。所有模式重新检查账号、项目及智能体权限。
      security:
      - sessionAuth: []
      parameters:
      - name: X-Project-Id
        in: header
        required: true
        description: 当前项目 ID
        schema: {type: integer, minimum: 1}
      - name: view
        in: query
        description: summary选择分页轻量历史；省略时返回原完整列表。
        schema: {type: string, enum: [summary]}
      - name: workflowType
        in: query
        description: 可选的工作流类型精确筛选。
        schema: {type: string, maxLength: 40}
      - name: offset
        in: query
        description: summary分页起始偏移。
        schema: {type: integer, minimum: 0, default: 0}
      - name: limit
        in: query
        description: summary每页数量。
        schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: 工作流列表
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/AgentWorkflowList'}
                - {$ref: '#/components/schemas/AgentWorkflowSummaryList'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - 智能体
      operationId: createAgentWorkflow
      summary: 创建科研工作流
      description: 创建项目内科研编排预览，校验授权输入、固定算法版本与参数后进入待确认状态；executeOperators=true 的直接执行请求返回400（策略禁止时403）。通过 confirm 接口确认 planHash 后执行并按 importResults 跟踪入库。
      security:
      - sessionAuth: []
      parameters:
      - name: X-Project-Id
        in: header
        required: true
        description: 唯一当前项目 ID，禁止 all
        schema:
          type: integer
          minimum: 1
      requestBody:
        required: true
        description: 科研工作流目标与受控输入
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentWorkflowInput'
      responses:
        '202':
          description: 已进入工作流队列
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentWorkflow'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/agent/workflows/{workflowId}/:
    get:
      tags:
      - 智能体
      operationId: getAgentWorkflow
      summary: 查询科研工作流
      description: 查询当前用户在当前项目内的工作流。默认返回完整步骤、证据和结果引用；view=card仅返回卡片所需状态、计数和阶段成果引用，steps与evidence为空，不包含模型交互、完整计划或修改审核。展开明细时请求默认视图。
      security:
      - sessionAuth: []
      parameters:
      - name: X-Project-Id
        in: header
        required: true
        description: 唯一当前项目 ID，禁止 all
        schema:
          type: integer
          minimum: 1
      - name: workflowId
        in: path
        required: true
        description: 工作流 UUID
        schema:
          type: string
          format: uuid
      - name: view
        in: query
        required: false
        description: full为完整详情（默认）；card为轻量卡片，保留当前字段确认卡与沿用配置提示所需字段；compare为对比摘要及按需实际修改分页；inspection为审批摘要及按需建议或步骤分页，同样保留字段确认与沿用配置状态。全部沿用本人、项目及资源权限校验。
        schema:
          type: string
          enum: [full, card, compare, inspection]
          default: full
      - name: part
        in: query
        description: inspection分页内容；compare仅支持changes。省略时inspection取suggestions，compare取changes。
        schema:
          type: string
          enum: [suggestions, steps, changes]
      - name: suggestionId
        in: query
        description: compare或inspection定位指定审批对象，返回其所在页；compare摘要同时提供focusOffset用于深链接按需读取。不匹配时保持offset。
        schema:
          type: string
          maxLength: 100
      - name: element
        in: query
        description: compare实际修改按要素过滤后分页；all保留全部。页签counts始终为全局数量，蚀变新流程以组计数并提供像元数与面积。其他视图仅允许all。
        schema:
          type: string
          enum: [all, lithology, structure, alteration]
          default: all
      - name: offset
        in: query
        description: 分页起始位置；compare按要素、规则及动作分组连续排列。
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: limit
        in: query
        description: 最多返回对象数，0仅取摘要；compare默认0，inspection默认50。单对象完整原因只在该对象所在页返回。
        schema:
          type: integer
          minimum: 0
          maximum: 50
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentWorkflow'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/agent/workflows/{workflowId}/cancel/:
    post:
      tags:
      - 智能体
      operationId: cancelAgentWorkflow
      summary: 取消科研工作流
      description: 请求在安全边界停止当前用户的科研工作流。可选replacePlanHash仅用于重新生成初始计划，后端原子核对相同计划摘要、等待初始批准、尚未授权执行且没有计算任务；过期或已开始时409且不取消任务。
      security:
      - sessionAuth: []
      parameters:
