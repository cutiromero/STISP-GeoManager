        required: true
        description: 唯一当前项目 ID，禁止 all
        schema:
          type: integer
          description: 项目 ID
          minimum: 1
      - name: runId
        in: path
        required: true
        description: 对象 ID
        schema:
          type: integer
          description: 对象 ID
          minimum: 1
  /api/agent/resources/:
