    post:
      tags: [智能体]
      operationId: answerAgentInteraction
      summary: 回答原任务的问题或取消等待
      description: 在原AgentRun中保存回答并恢复模型判断，不创建新任务或重新执行已保存步骤。当前用户、项目、模型和数据权限重新核验；问题标识与方案修订匹配，重复提交键幂等，过期问题或不同答案冲突返回409。等待期间释放模型执行槽。
      security: [{sessionAuth: []}]
      parameters:
      - name: runId
        in: path
        required: true
        description: 原任务编号。
        schema: {type: integer, minimum: 1}
      - name: X-Project-Id
        in: header
        required: true
        description: 当前唯一项目。
        schema: {type: integer, minimum: 1}
      requestBody:
        required: true
        description: 对当前问题的回答、补充信息或取消动作。
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentInteractionUpdate'}
      responses:
        '200':
          description: 已保存并返回原任务及问题历史；当前未处于重新排队状态，例如取消、拒绝，或幂等重试时任务已经继续处理。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentRun'}
        '202':
          description: 已在原任务中保存回答，原任务当前排队等待继续处理；没有新建任务。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentRun'}
        '400':
          description: 回答格式或必填审核选项无效。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: 请先登录。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403':
          description: 项目、用户、模型或数据授权变化。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: 任务不存在或不属于当前用户及项目。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: 旧问题、方案修订变化、任务状态变化或幂等键对应不同回答。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: 模型或执行服务暂不可用，原问题保留等待。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
