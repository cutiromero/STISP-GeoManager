      - snapshotChecksum
      - previewUrl
      - thumbnailUrl
      - downloadUrl
      - createdAt
      properties:
        id:
          type: integer
          description: 成果版本记录 ID
        compositionId:
          type: integer
          description: 所属出图稿 ID
        versionNumber:
          type: integer
          minimum: 1
          description: 出图稿内递增的版本号
        format:
          type: string
          enum:
          - png
          - jpg
          - pdf
          description: 正式成果格式
        dpi:
          type: integer
          minimum: 72
          maximum: 600
          description: 输出 DPI
        widthPx:
          type: integer
          description: 输出宽度像素
        heightPx:
          type: integer
          description: 输出高度像素
        note:
          type: string
          description: 版本说明
        snapshotSchemaVersion:
          type: integer
          minimum: 1
          description: 工程快照结构版本
        snapshotChecksum:
          type: string
          description: 版式和工程快照的 SHA-256 校验值
        previewUrl:
          type: string
          description: PNG 预览地址 URL 包含所属项目的 projectTagId；预览只读，原文件下载仍要求下载/导出权限。
        thumbnailUrl:
