    KnowledgeEntryList:
      type: object
      description: 当前项目与公共已发布基础知识
      properties:
        domains:
          type: array
          description: 四个知识分区与可见数量
          items:
            $ref: '#/components/schemas/KnowledgeDomainOption'
        items:
          type: array
          description: 匹配的知识条目
          items:
            $ref: '#/components/schemas/KnowledgeEntry'
        total:
          type: integer
          description: 匹配总数
        categories:
          type: array
          description: 可见领域分类
          items:
            type: string
        canEdit:
          type: boolean
          description: 是否具有知识维护权限
      required:
      - items
      - total
      - categories
      - canEdit
      additionalProperties: false
    KnowledgeFinding:
      type: object
      description: 规则核查结果
      properties:
        entryId:
          type: integer
          description: 规则条目 ID
        title:
          type: string
          description: 规则标题
        status:
          type: string
          description: 结果状态
          enum:
          - conflict
          - pass
          - needs_context
        detail:
          type: string
          description: 判定理由或缺少的条件
        revision:
          type: integer
          description: 所用规则版本
        sources:
          type: array
          description: 规则证据
          items:
            $ref: '#/components/schemas/KnowledgeSource'
      required:
      - entryId
      - title
      - status
      - detail
      - revision
      - sources
      additionalProperties: false
    KnowledgeCheckInput:
      type: object
      description: 对显式事实进行条件化核查
      properties:
        facts:
          type: object
          description: 观测事实：minerals/equilibrium/system/values/fields 等；未知条件不自动补全
          additionalProperties: true
        entryIds:
          type: array
          description: 可选已发布规则 ID；省略则使用可见规则
          items:
            type: integer
            minimum: 1
          maxItems: 50
      required:
      - facts
      additionalProperties: false
    KnowledgeCheckResult:
      type: object
      description: 核查结果和覆盖条数
      properties:
        findings:
          type: array
          description: 冲突、通过或缺少上下文
          items:
            $ref: '#/components/schemas/KnowledgeFinding'
        checked:
          type: integer
          description: 已检查条目数
      required:
      - findings
      - checked
      additionalProperties: false
    AgentWorkflowDecision:
      type: [object, 'null']
      description: 模型在行动时形成的可核对判断摘要；绑定实际证据与计算，不包含隐藏思维链
      properties:
        problem:
          type: string
          description: 本步骤要解决的问题
        findings:
          type: array
          description: 来自实际数据或计算的发现
          items:
            type: string
        judgement:
          type: string
          description: 当前判断及适用范围
        uncertainties:
          type: array
          description: 尚待核实的问题或需要补充的资料
          items:
            type: string
        nextAction:
          type: string
          description: 模型选择的下一步受限动作
        knowledgeQuery:
          type: string
          minLength: 1
          maxLength: 300
          description: 仅地质成果检查的search_expert_knowledge阶段提供，由模型根据实际资料形成的专家知识检索词；其他阶段省略
        algorithmReason:
          type: string
          description: 为什么选择该算法、输入角色及参数
        evidenceRefs:
          type: array
          description: 本次授权数据、知识修订、真实任务及输出引用
          items:
            type: object
            description: 可回查的实际证据引用
            properties:
              kind:
                type: string
                description: 引用类型
                enum: [resource, knowledge, output, task]
              id:
                type: string
                description: 真实对象标识，界面使用对应友好标题
              revision:
                type: integer
                description: 实际知识修订（知识引用提供时）
              role:
                type: string
                description: 前期影像、后期影像、初始图或修复图等输入角色
              title:
                type: string
                description: 用户可见的证据标题
            required: [kind, id, title]
            additionalProperties: false
        resultSummary:
          type: string
          description: 读取本次实际结果后的简短说明
        modelMode:
          type: string
          description: 实际调用的模型模式，模拟验证单独标识
          enum: [real, mock]
        modelName:
          type: string
          description: 实际模型的公开名称
      required: [problem, findings, judgement, uncertainties, nextAction, algorithmReason, evidenceRefs, modelMode, modelName]
      additionalProperties: false
    AgentWorkflowStep:
      type: object
      description: 科研工作流的可审计步骤
      properties:
        id:
          type: integer
          description: 步骤 ID
        sequence:
          type: integer
          description: 步骤序号
        kind:
          type: string
          description: 节点类型
        status:
          type: string
          description: 步骤状态
        message:
          type: string
          description: 用户可见简要状态
        action:
          type: object
          description: 已校验的结构化动作
          additionalProperties: true
        decision:
          $ref: '#/components/schemas/AgentWorkflowDecision'
        inputRefs:
          type: object
          description: 输入引用
          additionalProperties: true
        outputRefs:
          type: object
          description: 输出引用。analysis_model_attempt 节点包含 modelResponse 审计产物；仅当前工作流授权用户可读，不含请求提示词。inspection 的 steps 分页保留此产物，不使用普通摘要裁剪。
          properties:
            modelResponse:
              type: object
              description: 本次尝试的持久化审计响应，成功、校验失败及流式异常均保留。
              required: [content, truncated, sizeBytes]
              properties:
                content:
                  type: string
                  description: 凭据脱敏后的原始模型正文，含原始发现与待核实项；UTF-8 最多2 MiB，超出附中文截断标记；未返回正文时为空字符串。
                truncated:
                  type: boolean
                  description: 是否因审计体积上限截断。
                sizeBytes:
                  type: integer
                  minimum: 0
                  description: 脱敏后、截断前的 UTF-8 字节数。
              additionalProperties: false
          additionalProperties: true
        metrics:
          type: object
          description: 质量指标摘要
          additionalProperties: true
        computeTaskId:
          type: string
          description: 关联的计算任务 UUID
        errorCode:
          type: string
          description: 结构化错误码
        startedAt:
          type: string
          description: 开始时间
        finishedAt:
          type: string
          description: 完成时间
      required:
      - id
      - sequence
      - kind
      - status
      - message
      - action
      - decision
      - inputRefs
      - outputRefs
      - metrics
      - computeTaskId
      - errorCode
      - startedAt
      - finishedAt
      additionalProperties: false
    AgentWorkflowValidation:
      type: object
      description: 与运行输入隔离的工作流独立评价，仅用于授权页面与文件验收
      additionalProperties: false
      required: [workflowId, available, scope, summary, sections, files]
      properties:
        workflowId: {type: string, format: uuid, description: 绑定的实际工作流}
        available: {type: boolean, description: 是否已存在可读取的独立评价；false时sections及files为空}
        scope: {type: string, description: 数据性质与评价范围，明确模拟输入及未覆盖项目}
        summary: {type: string, description: 通俗评价结论或尚无评价的原因}
        sections:
          type: array
          description: 按规则、关系、岩性对照或置信度标定组织的实际评价统计
          items: {$ref: '#/components/schemas/AgentWorkflowValidationSection'}
        files:
          type: array
          description: 受控独立评价清单中的真实文件
          items: {$ref: '#/components/schemas/AgentWorkflowValidationFile'}
    AgentWorkflowValidationSection:
      type: object
      description: 一项独立评价表格，列定义与每行实际统计对应
      additionalProperties: false
      required: [key, title, summary, columns, rows]
      properties:
        key: {type: string, description: 分项稳定键}
        title: {type: string, description: 用户可读的分项名称}
        summary: {type: string, description: 本项统计口径、结论及证据范围}
        columns:
          type: array
          description: 显示列及其稳定字段键
          items:
            type: object
            description: 单个统计列
            additionalProperties: false
            required: [key, label]
            properties:
              key: {type: string, description: 对应rows中的字段键}
              label: {type: string, description: 中文列标题}
        rows:
          type: array
          description: 独立计算得到的统计行，保持零值、未定义值和未验证结果的区别
          items:
            type: object
            description: 一行统计，键对应columns，值仅为可显示标量
            additionalProperties:
              type: [string, number, boolean, 'null']
              description: 实际统计值或明确文字说明，未计算为null
    AgentWorkflowValidationFile:
      type: object
      description: 只读独立评价文件，文件访问时再次核验来源、大小和SHA256
      additionalProperties: false
      required: [key, fileName, contentType, sizeBytes, checksum, previewUrl, downloadUrl, canDownload]
      properties:
        key: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$', description: 受控文件键，不是路径}
        fileName: {type: string, description: 用户可读的真实下载文件名}
        contentType: {type: string, description: 清单登记的真实文件媒体类型}
        sizeBytes: {type: integer, minimum: 0, description: 已保存文件字节数}
        checksum: {type: string, pattern: '^[a-f0-9]{64}$', description: 已保存文件SHA256}
        previewUrl: {type: [string, 'null'], description: Markdown预览端点，其余类型为null}
        downloadUrl: {type: string, description: 受工作流授权及数据导出权限保护的下载地址}
        canDownload: {type: boolean, description: 当前用户是否具备下载所需权限}
    AgentWorkflowReport:
      type: object
      description: 已生成并持久保存的科研Markdown报告，操作能力根据当前权限返回
      additionalProperties: false
      properties:
        fileName:
          type: string
          description: 可下载的真实文件名
        label:
          type: string
          description: 用户可读的报告标题
        contentType:
          type: string
          enum: [text/markdown]
          description: 报告文件类型
        sizeBytes:
          type: integer
          minimum: 0
          description: 实际文件字节数
        checksum:
          type: string
          description: 已保存文件的SHA256
        previewUrl:
          type: string
          description: 受授权保护的报告预览接口
        downloadUrl:
          type: string
          description: 受授权及数据导出权限保护的下载地址
        resourceId:
          type: [integer, 'null']
          description: 已登记文档资源ID，未入库为null
        resourceName:
          type: string
          description: 入库资源名称，未入库为空字符串
        resourceLocation:
          type: string
          description: 用户可读的项目与计算结果目录位置，未入库为空字符串
        canDownload:
          type: boolean
          description: 当前用户具有下载所需权限
        canImport:
          type: boolean
          description: 当前用户具有入库所需权限
      required: [fileName, label, contentType, sizeBytes, checksum, previewUrl, downloadUrl, resourceId, resourceName, resourceLocation, canDownload, canImport]
    AgentWorkflowReportPreview:
      type: object
      description: 持久报告的受控在线预览正文
      additionalProperties: false
      properties:
        content:
          type: string
          description: 已保存Markdown文本，前端受控渲染
        fileName:
          type: string
          description: 已保存报告文件名
        contentType:
          type: string
          enum: [text/markdown]
          description: 文件类型
        truncated:
          type: boolean
          description: 正文超过预览字符上限时为true，下载仍为完整文件
      required: [content, fileName, contentType, truncated]
    AgentWorkflow:
      type: object
      description: 可恢复的项目科研工作流；card视图省略完整计划和审核，steps/evidence为空
      properties:
        view:
          type: string
          enum: [full, card, compare, inspection]
          description: 详情投影视图；省略等同full
        stepCount:
          type: integer
          description: 实际步骤总数，card视图用于按需展开入口
          minimum: 0
        id:
          type: string
          format: uuid
          description: 工作流 UUID
        projectId:
          type: integer
          description: 所属项目
        workflowType:
          type: string
          description: 工作流类型
        goal:
          type: string
          description: 用户目标
        model:
          type: string
          description: 本地模型别名
        status:
          type: string
          description: 工作流状态
          enum:
          - queued
          - running
          - waiting_compute
          - waiting_approval
          - paused
          - succeeded
          - failed
          - cancelled
          - interrupted
        detail:
          type: string
          description: 可读状态
        pauseRequested:
          type: boolean
          description: 已请求暂停，运行中的判断在保存进度后进入paused
        pausedFrom:
          type: [string, 'null']
          description: 暂停前阶段，恢复保留原计算或审核位置
        currentStep:
          type: string
          description: 当前节点
        iteration:
          type: integer
          description: 当前迭代轮次
        operatorSteps:
          type: integer
          description: 已提交算子步骤数
        maxIterations:
          type: integer
          description: 最大迭代轮次
        maxOperatorSteps:
          type: integer
          description: 最大算子步骤数
        executeOperators:
          type: boolean
          description: 是否请求执行算子
        resourceIds:
          type: array
          description: 授权输入资源 ID
          items:
            type: integer
        algorithmVersionId:
          type: [integer, 'null']
          description: 固定算法版本 ID
        parameters:
          type: object
          description: 已校验参数
          additionalProperties: true
        resultIds:
          type: array
          description: 结果引用 ID
          items:
            type: integer
        evidence:
          type: array
          description: 证据摘要
          items:
            type: object
            additionalProperties: true
        runtime:
          type: string
          description: 实际运行时或离线兼容状态
        steps:
          type: array
          description: 工作流步骤
          items:
            $ref: '#/components/schemas/AgentWorkflowStep'
        createdAt:
          type: string
          description: 创建时间
        updatedAt:
          type: string
          description: 更新时间
        plan:
          type: object
          description: 经预检的输入、算法、参数与知识依据
          properties:
            multiElementMap:
              $ref: '#/components/schemas/AgentMultiElementMap'
            trialRuleBindings:
              type: array
              description: 仅当前项目与综合地质场景可读取的显式试用规则及冻结版本；不改变普通知识检索对草稿的可见性
              items: {$ref: '#/components/schemas/AgentTrialRuleBinding'}
            fieldMappingReview:
              $ref: '#/components/schemas/AgentFieldMappingReview'
            reusedConfiguration:
              type: boolean
              description: 本次资料与服务端已确认配置一致，沿用角色和字段；card和inspection视图也保留此值，不表示计划或处置获批
            pagination:
              $ref: '#/components/schemas/AgentWorkflowPage'
            reviewIndex:
              $ref: '#/components/schemas/AgentWorkflowReviewIndex'
            compareFeatures:
              $ref: '#/components/schemas/GeoJSONFeatureCollection'
          additionalProperties: true
        planHash:
          type: string
          description: 确认计划时校验的内容哈希
        modificationReview:
          $ref: '#/components/schemas/AgentModificationReview'
        importResults:
          type: boolean
          description: 执行完成后自动登记结果
        resultResourceIds:
          type: array
          description: 实际完成入库的数据资源 ID
          items:
            type: integer
      required:
      - plan
      - planHash
      - importResults
      - resultResourceIds
      - id
      - projectId
      - workflowType
      - goal
      - model
      - status
      - detail
      - currentStep
      - iteration
      - operatorSteps
      - maxIterations
      - maxOperatorSteps
      - executeOperators
      - resourceIds
      - algorithmVersionId
      - parameters
      - resultIds
      - evidence
      - runtime
      - steps
      - createdAt
      - updatedAt
      additionalProperties: false
    AgentWorkflowGroup:
      type: object
      description: 不包含对象完整原因或几何的规则分组索引
      required: [element, ruleId, action, count]
      properties:
        key:
          type: string
          description: 对比页分组稳定标识
        element:
          type: [string, 'null']
          description: lithology、structure或alteration，旧场景可为空
        ruleId:
          type: string
          description: 冻结规则编号
        action:
          type: [string, 'null']
          description: 本组执行动作，待裁定组按规则聚合时为空
        count:
          type: integer
          minimum: 0
          description: 完整分组对象数，不仅为本页数量
        offset:
          type: integer
          minimum: 0
          description: 对比页组内首个实际修改在完整导航中的位置
        held:
          type: boolean
          description: 是否为默认保留的待裁定或例外组
        ids:
          type: array
          description: 审批组完整对象ID；待裁定组仅列冻结候选，不能由模型批准
          items:
            type: string
            description: 冻结审批对象ID
        reasons:
          type: object
          description: 原因类别及完整计数，不拼接对象原因原文
          additionalProperties:
            type: integer
            minimum: 0
            description: 此原因类别命中的对象数
      additionalProperties: false
    AgentWorkflowPage:
      type: object
      description: 工作流按需投影的分页与分组索引
      required: [part, offset, limit, total, groups]
      properties:
        element:
          type: string
          enum: [all, lithology, structure, alteration]
          description: 当前分页要素
        counts:
          type: object
          description: 全局实际修改数量，不随页变化；蚀变以归类组计数，旧任务仍以对象计数
          additionalProperties: {type: integer, minimum: 0, description: 该要素完整修改数}
        alterationPixels: {type: integer, minimum: 0, description: 新栅格流程全部实际修改像元数}
        alterationAreaM2: {type: number, minimum: 0, description: 新栅格流程全部实际修改像元面积，平方米}
        revision: {type: string, maxLength: 64, description: 冻结批准与真实执行输出的内容哈希，分页与无关阶段状态不改变此值}
        part:
          type: string
          enum: [suggestions, steps, changes]
          description: 当前页内容类型
        offset:
          type: integer
          minimum: 0
          description: 当前页起点
        limit:
          type: integer
          minimum: 0
          maximum: 50
          description: 当前页最多对象数，0表示摘要
        total:
          type: integer
          minimum: 0
          description: 当前类型完整对象数量
        focusOffset:
          type: integer
          minimum: 0
          description: suggestionId深链接对象所在页起点
        groups:
          type: array
          description: 完整实际修改的分组索引；其他分页为空
          items:
            $ref: '#/components/schemas/AgentWorkflowGroup'
      additionalProperties: false
    AgentWorkflowReviewIndex:
      type: object
      description: 冻结方案的审批集合索引，完整对象原因按suggestions分页返回
      required: [total, suggestedIds, candidateIds, groups]
      properties:
        total:
          type: integer
          minimum: 0
          description: 完整方案对象数
        suggestedIds:
          type: array
          description: 模型建议默认勾选集合，不包含待裁定或例外
          items: {type: string, description: 模型建议对象ID}
        candidateIds:
          type: array
          description: 只有用户明确选择才可批准的冻结待裁定或例外候选
          items: {type: string, description: 用户裁定候选对象ID}
        groups:
          type: array
          description: 完整审批分组与分类原因计数
          items:
            $ref: '#/components/schemas/AgentWorkflowGroup'
      additionalProperties: false
    AgentWorkflowInput:
      type: object
      description: 创建科研工作流的输入
      properties:
        workflowType:
          type: string
          description: 工作流类型；geology_multi_element_reasoning 为海德乌拉综合推理，geology_generic 为上传资料的通用地质推理，保留生态与既有地质场景；默认 hyperspectral_interpretation
          default: hyperspectral_interpretation
          maxLength: 40
        goal:
          type: string
          description: 目标，例如识别矿物并按成矿理论迭代
          minLength: 1
          maxLength: 12000
        model:
          type: string
          description: 已配置的本地模型别名
        resourceIds:
          type: array
          description: 可选授权输入；为空时自主发现
          maxItems: 12
          items:
            type: integer
            minimum: 1
        algorithmVersionId:
          type: [integer, 'null']
          description: 可选的已发布智能体算法版本
        parameters:
          type: object
          description: 算子参数候选；服务端按manifest校验。综合地质场景segment为all、lithology、structure或alteration，分段所用上游资源与版本必须保存在计划中。
          additionalProperties: true
        executeOperators:
          type: boolean
          description: 创建时为 false；实际执行须通过 confirm 接口确认冻结计划
          default: false
        idempotencyKey:
          type: string
          description: 网络重试复用的幂等键
          minLength: 8
          maxLength: 80
        inputs:
          type: object
          description: 输入端口或场景角色到授权资源的明确绑定。综合地质场景使用lithology、faults、coverage、rules、hematite、chlorite、hydromica、calcite、dolomite。通用地质场景使用lithology（必需）及可选的faults、coverage、units和五类蚀变角色，规则由服务端选用当前项目已绑定的试用规则。既有生态和地质角色保持原协议。真实计算输出按持久来源接入后续步骤。
          additionalProperties:
            type: integer
            minimum: 1
        knowledgeSelection:
          $ref: '#/components/schemas/AgentKnowledgeSelection'
        importResults:
          type: boolean
          description: 完成后自动登记计算结果
          default: true
        previousWorkflowId:
          type: string
          format: uuid
          description: 可选的本人当前项目已完成生态分析；仅替换观测证据，复用实际变化结果并保存旧判断与新增证据，用于更新调查建议。
        uploadBatchId:
          type: string
          pattern: '^[0-9a-f]{32}$'
          description: geology_generic必填。本人当前项目尚未绑定任务的上传批次；inputs只能引用该批次资料，创建后批次绑定到本任务。
      required:
      - goal
      - model
      - idempotencyKey
      additionalProperties: false
    AgentAdmin:
      type: object
