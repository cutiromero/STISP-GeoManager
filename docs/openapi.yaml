                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 对象不存在或不属于当前用户及项目
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 活动运行或设置版本冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 并发、排队或每日额度已满
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 工作进程或模型不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: X-Project-Id
