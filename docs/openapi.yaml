              $ref: '#/components/schemas/ResultColorAdvice'
          additionalProperties: true
        resource:
          $ref: '#/components/schemas/DataResource'
        fields:
          type: array
          description: 属性字段信息
          items:
            $ref: '#/components/schemas/FieldInfo'
        featureCount:
          type:
          - integer
          - 'null'
          description: 矢量要素数量；栅格和非空间资源为 null
        geometryType:
          type: string
          description: 几何类型
        bounds:
          type: array
          description: WGS84 边界 [minLng, minLat, maxLng, maxLat]，无法计算时为空数组
          items:
            type: number
        raster:
          oneOf:
          - $ref: '#/components/schemas/RasterDataset'
          - type: 'null'
          description: 栅格资源详情；非栅格资源可能省略或为 null
    FieldInfo:
      type: object
      required:
      - name
      - type
      - nullable
      - sampleValues
      - description
      properties:
        name:
          type: string
          description: 字段名
        type:
          type: string
          description: 字段数据类型
        nullable:
          type: boolean
          description: 是否存在空值
        sampleValues:
          type: array
          description: 非空样例值
          items:
            oneOf:
            - type: string
            - type: number
            - type: boolean
            - type: 'null'
        description:
          type: string
          description: 字段描述
    NonGeoScalar:
      oneOf:
