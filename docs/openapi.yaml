components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: sessionid
      description: Django Session Cookie
  parameters:
    ShareInvitationId:
      name: invitationId
      in: path
      required: true
      description: 本人收发邀请的整数标识
      schema: {type: integer, minimum: 1, description: 邀请标识}
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: 资源 ID
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
      description: 异步任务 ID
  responses:
    BadRequest:
      description: 请求错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            detail: 请求参数错误
    Unauthorized:
      description: 未认证
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            detail: 请先登录
    Forbidden:
      description: 权限不足或 CSRF 校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            detail: CSRF 验证失败
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            detail: 未找到请求的资源
    Conflict:
      description: 当前资源状态或名称发生冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            detail: 同名工程已存在
    PayloadTooLarge:
      description: 请求体超过接口安全上限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            detail: 请求体过大
    ServiceUnavailable:
      description: 服务当前没有可用的重型任务执行槽；可按 Retry-After 退避重试
      headers:
        Retry-After:
          description: 建议等待的秒数
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            detail: 查询任务繁忙，请稍后重试
  schemas:
    ShareKind:
      type: string
      description: 工程、专题图或单个计算输出；不分享整个计算任务
      enum: [workspace, composition, compute_output]
    SharePerson:
      type: object
      description: 已知邀请双方的最少身份信息，不提供用户枚举
      required: [username, displayName]
      properties:
        username: {type: string, description: 准确用户名}
        displayName: {type: string, description: 显示名称}
    ShareTarget:
      type: object
      description: 原项目中的只读目标；不复制资料或增加项目权限
      required: [kind, objectId, name, projectTagId, projectName, openUrl]
      properties:
        kind: {$ref: '#/components/schemas/ShareKind'}
        objectId: {type: integer, minimum: 1, description: 工程/专题图/单输出标识}
        name: {type: string, description: 分享对象名称}
        projectTagId: {type: integer, minimum: 1, description: 业务项目标识}
        projectName: {type: string, description: 业务项目名称}
        openUrl: {type: string, description: 安全站内入口；计算输出使用/compute?sharedInvitation=邀请编号，预检时为空}
    ShareCheckRequest:
      type: object
      description: 精确用户名与当前项目的一个对象
      required: [kind, objectId, username]
      properties:
        kind: {$ref: '#/components/schemas/ShareKind'}
        objectId: {type: integer, minimum: 1, description: 单个对象标识}
        username: {type: string, minLength: 1, maxLength: 150, description: 区分大小写的完整用户名，不接受模糊选择}
      additionalProperties: false
    ShareCreateRequest:
      type: object
      description: 发出单对象邀请
      required: [kind, objectId, username, idempotencyKey]
      properties:
        kind: {$ref: '#/components/schemas/ShareKind'}
        objectId: {type: integer, minimum: 1, description: 单个对象标识}
        username: {type: string, minLength: 1, maxLength: 150, description: 区分大小写的完整用户名}
        idempotencyKey: {type: string, minLength: 1, maxLength: 80, description: 本账号唯一提交键，同键不同请求409}
      additionalProperties: false
    ShareCheckResponse:
      type: object
      description: 可发送性及明确原因，不可用时不返回目标用户或私有依赖信息
      required: [eligible, detail]
      properties:
        eligible: {type: boolean, description: 当前是否允许发送}
        detail: {type: string, description: 可理解的成功或失败原因}
        target: {$ref: '#/components/schemas/ShareTarget'}
        recipient: {$ref: '#/components/schemas/SharePerson'}
    ShareInvitation:
      type: object
      description: 持久邀请和本人这侧通知；接受只授该对象只读入口
      required: [id, status, sender, recipient, target, createdAt, respondedAt, unread, detail, canRespond]
      properties:
        id: {type: integer, minimum: 1, description: 邀请标识}
        status: {type: string, enum: [pending, accepted, rejected, unavailable], description: 等待回应/接受/拒绝/源对象或权限失效}
        sender: {$ref: '#/components/schemas/SharePerson'}
        recipient: {$ref: '#/components/schemas/SharePerson'}
        target: {$ref: '#/components/schemas/ShareTarget'}
        createdAt: {type: string, format: date-time, description: 发出时间}
        respondedAt: {type: [string, 'null'], format: date-time, description: 决定或确认失效的时间}
        unread: {type: boolean, description: 收件通知或分享者决定通知是否未读}
        detail: {type: string, description: 发出、等待、接受、拒绝或失效的反馈}
        canRespond: {type: boolean, description: 本人是否为仍待回应的接收人；接受前继续重新核权}
    ShareInvitationList:
      type: object
      description: 本人跨仍有权项目收件或发件分页
      required: [items, total, unreadCount, limit, offset]
      properties:
        items: {type: array, description: 本页邀请, items: {$ref: '#/components/schemas/ShareInvitation'}}
        total: {type: integer, description: 当前箱邀请总数}
        unreadCount: {type: integer, description: 当前箱全部未读数}
        limit: {type: integer, description: 每页条数}
        offset: {type: integer, description: 当前偏移}
    ShareResponseRequest:
      type: object
      description: 接收人明确响应
      required: [decision, idempotencyKey]
      properties:
        decision: {type: string, enum: [accept, reject], description: 接受或拒绝}
        idempotencyKey: {type: string, minLength: 1, maxLength: 80, description: 响应提交键，防重复操作}
      additionalProperties: false
    ShareOpenResponse:
      type: object
      description: 实时核验后返回目标；计算输出仅一份最少元信息
      required: [target]
      properties:
        target: {$ref: '#/components/schemas/ShareTarget'}
        output: {$ref: '#/components/schemas/ComputeOutput'}
    AgentAudience:
      type: object
      description: 附加可见范围；不授予功能或项目权限
      properties:
        restricted:
          type: boolean
          description: 启用用户范围限制；组或用户允许任一匹配即可
        groupIds:
          type: array
          description: 允许的用户组
          items:
            type: integer
            description: 对象 ID
            minimum: 1
        userIds:
          type: array
          description: 允许的单个用户
          items:
            type: integer
            description: 对象 ID
            minimum: 1
        deniedUserIds:
          type: array
          description: 明确禁用的用户，优先于允许项
          items:
            type: integer
            description: 对象 ID
            minimum: 1
      required:
      - restricted
      - groupIds
      - userIds
      - deniedUserIds
      additionalProperties: false
    AgentModelPolicy:
      type: object
      description: 超管模型使用策略，无地址或凭据
      properties:
        alias:
          type: string
          description: 部署注册别名
        enabled:
          type: boolean
          description: 启用模型
        allowAgent:
          type: boolean
          description: 允许参与数据智能体，仍需部署协议支持
        sortOrder:
          type: integer
          description: 排序
          minimum: 0
          maximum: 999
        concurrency:
          type: integer
          description: 模型并发
          minimum: 1
          maximum: 3
        audience:
          $ref: '#/components/schemas/AgentAudience'
      required:
      - alias
      - enabled
      - allowAgent
      - sortOrder
      - concurrency
      - audience
      additionalProperties: false
    AgentQuota:
      type: object
      description: 按用户或组进一步收窄全局额度
      properties:
        kind:
          type: string
          description: 适用对象
          enum:
          - user
          - group
        id:
          type: integer
          description: 对象 ID
          minimum: 1
        dailyRuns:
          type: integer
          description: 当日运行上限；0表示本规则不限制，多个正数策略取最小值
          minimum: 0
      required:
      - kind
      - id
      - dailyRuns
      additionalProperties: false
    AgentBudgetProfileId:
      type: string
      description: 普通分析、长材料、长推理
      enum:
      - normal
      - materials
      - reasoning
    AgentBudgetPreset:
      type: object
      description: 每种任务的默认预算
      additionalProperties: false
      properties:
        maxOutputTokens:
          type: integer
          description: 思考与正文生成额度
          minimum: 128
        maxRunSeconds:
          type: integer
          description: 任务时限，秒
          minimum: 60
        reasoningEffort:
          type: string
          description: 深度模式下的思考强度
          enum:
          - low
          - medium
          - xhigh
      required:
      - maxOutputTokens
      - maxRunSeconds
      - reasoningEffort
    AgentBudgetLimit:
      type: object
      description: 当前角色允许范围
      additionalProperties: false
      properties:
        contextWindowTokens:
          type: integer
          description: 角色允许的总窗口，实际仍受模型服务约束
          minimum: 1024
        maxOutputTokens:
          type: integer
          description: 思考与正文生成额度
          minimum: 128
        maxRunSeconds:
          type: integer
          description: 任务时限，秒
          minimum: 60
      required:
      - contextWindowTokens
      - maxOutputTokens
      - maxRunSeconds
    AgentBudgetChoice:
      type: object
      description: 受用户额度限制后的默认值；提交时核对所选模型
      additionalProperties: false
      properties:
        budgetProfile:
          $ref: '#/components/schemas/AgentBudgetProfileId'
        tier:
          type: string
          description: 服务器判定的额度级别
          enum:
          - standard
          - superadmin
        contextWindowTokens:
          type: integer
          description: 角色允许的总窗口，实际仍受模型服务约束
          minimum: 1024
        maxOutputTokens:
          type: integer
          description: 思考与正文生成额度
          minimum: 128
        maxRunSeconds:
          type: integer
          description: 任务时限，秒
          minimum: 60
        reasoningEffort:
          type: string
          description: 深度模式下的思考强度
          enum:
          - low
          - medium
          - xhigh
        requestedMaxOutputTokens:
          type: [integer, 'null']
          description: 显式要求的额度，未设置为null
      required:
      - budgetProfile
      - tier
      - contextWindowTokens
      - maxOutputTokens
      - maxRunSeconds
      - reasoningEffort
      - requestedMaxOutputTokens
    AgentBudgetOptions:
      type: object
      description: 当前用户可用方案和额度
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          description: 是否开启任务预算
        tier:
          type: string
          description: 服务器判定的额度级别
          enum:
          - standard
          - superadmin
        defaultProfile:
          $ref: '#/components/schemas/AgentBudgetProfileId'
        limits:
          $ref: '#/components/schemas/AgentBudgetLimit'
        profiles:
          type: array
          description: 三种任务的默认值
          items:
            $ref: '#/components/schemas/AgentBudgetChoice'
        maxPromptCharacters:
          type: integer
          description: 文字长度保护；仍需对完整输入分词校验
      required:
      - enabled
      - tier
      - defaultProfile
      - limits
      - profiles
      - maxPromptCharacters
    AgentPolicy:
      type: object
      description: 超级管理员控制策略；工具执行仍受项目与功能权限约束
      properties:
        taskBudgetsEnabled:
          type: boolean
          description: 启用按任务与角色分配预算，关闭时使用旧版全局配置
        defaultBudgetProfile:
          $ref: '#/components/schemas/AgentBudgetProfileId'
        budgetProfiles:
          type: object
          description: 三种任务的默认值
          additionalProperties: false
          properties:
            normal:
              $ref: '#/components/schemas/AgentBudgetPreset'
            materials:
              $ref: '#/components/schemas/AgentBudgetPreset'
            reasoning:
              $ref: '#/components/schemas/AgentBudgetPreset'
          required:
          - normal
          - materials
          - reasoning
        budgetLimits:
          type: object
          description: 服务端鉴权决定额度
          additionalProperties: false
          properties:
            standard:
              $ref: '#/components/schemas/AgentBudgetLimit'
            superadmin:
              $ref: '#/components/schemas/AgentBudgetLimit'
          required:
          - standard
          - superadmin
        enabled:
          type: boolean
          description: 模块总开关
        chatEnabled:
          type: boolean
          description: 模型对话开关
        agentEnabled:
          type: boolean
          description: 数据智能体开关
        thinkingEnabled:
          type: boolean
          description: 允许 Qwen 深度思考
        workflowEnabled:
          type: boolean
          description: 科研工作流计划与恢复开关
        operatorEnabled:
          type: boolean
          description: 允许智能体实际提交已登记算子；仍受算法和计算权限约束
        systemInfoEnabled:
          type: boolean
          description: 允许智能体读取平台运行参数和资源摘要
        internetEnabled:
          type: boolean
          description: 允许用户在提交任务时请求受控互联网检索
        allowAttachments:
          type: boolean
          description: 允许上传文档和图片供多模态模型分析
        maxAttachmentBytes:
          type: integer
          description: 单个智能体附件大小上限（字节）
          minimum: 1024
          maximum: 200000000
        maxAttachments:
          type: integer
          description: 单次任务最多引用附件数
          minimum: 1
        chatAudience:
          $ref: '#/components/schemas/AgentAudience'
        agentAudience:
          $ref: '#/components/schemas/AgentAudience'
        defaultChatModel:
          type: string
          description: 普通对话默认模型别名
        defaultAgentModel:
          type: string
          description: 数据智能体默认模型别名
        dailyRuns:
          type: integer
          description: 单用户每日运行上限；0表示不限，用户或组的正数额度仍生效
          minimum: 0
        maxContextBytes:
          type: integer
          description: 输入文本大小保护上限（UTF-8字节）；实际窗口另外通过模型分词器核验
          minimum: 8000
        maxOutputTokens:
          type: integer
          description: 单次模型调用的思考与正文合计生成 token 上限
          minimum: 128
        maxContextTokens:
          type: integer
          description: 输入 token 预算；同时受实际模型窗口减去生成预留和256 token安全余量限制
          minimum: 1024
        reasoningEffort:
          type: string
          description: Qwen深度思考强度，通过chat_template_kwargs传至推理服务
          enum: [low, medium, xhigh]
        temperature:
          type: number
          description: 采样温度
          minimum: 0
          maximum: 2
        topP:
          type: number
          description: 核采样阈值
          minimum: 0
          maximum: 1
        maxSteps:
          type: integer
          description: 最多工具动作；0表示不限，仍受运行时限与权限约束
          minimum: 0
        maxResources:
          type: integer
          description: 最多详细读取资源数；0表示不限，仍限当前项目可见资源
          minimum: 0
        maxIterations:
          type: integer
          description: 科研工作流最大迭代轮次
          minimum: 1
        maxOperatorSteps:
          type: integer
          description: 科研工作流最大算子步骤数
          minimum: 1
        maxProtocolRetries:
          type: integer
          description: 协议纠错次数
          minimum: 0
        maxRunSeconds:
          type: integer
          description: 单次运行最长秒数
          minimum: 60
        allowDocuments:
          type: boolean
          description: 允许文档文本读取
        allowCompare:
          type: boolean
          description: 允许跨资源比较
        dataTypes:
          type: array
          description: 允许的资源类型
          items:
            type: string
            description: 资源类型
            enum:
            - table
            - vector
            - raster
            - gene
            - document
            - image
        models:
          type: array
          description: 模型策略
          items:
            $ref: '#/components/schemas/AgentModelPolicy'
        quotas:
          type: array
          description: 用户与组配额
          items:
            $ref: '#/components/schemas/AgentQuota'
      required:
      - taskBudgetsEnabled
      - defaultBudgetProfile
      - budgetProfiles
      - budgetLimits
      - enabled
      - chatEnabled
      - agentEnabled
      - thinkingEnabled
      - workflowEnabled
      - operatorEnabled
      - systemInfoEnabled
      - internetEnabled
      - allowAttachments
      - maxAttachmentBytes
      - maxAttachments
      - chatAudience
      - agentAudience
      - defaultChatModel
      - defaultAgentModel
      - dailyRuns
      - maxContextBytes
      - maxOutputTokens
      - maxContextTokens
      - reasoningEffort
      - temperature
      - topP
      - maxSteps
      - maxResources
      - maxIterations
      - maxOperatorSteps
      - maxProtocolRetries
      - maxRunSeconds
      - allowDocuments
      - allowCompare
      - dataTypes
      - models
      - quotas
      additionalProperties: false
    AgentModel:
      type: object
      description: 用户可见模型，不包含服务器地址
      properties:
        alias:
          type: string
          description: 稳定别名
        name:
          type: string
          description: 显示名称
        allowAgent:
          type: boolean
          description: 支持并获准智能体协议
        contextWindowTokens:
          type: integer
          description: 模型上下文窗口 token 数
          minimum: 1
