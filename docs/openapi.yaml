openapi: 3.1.0
info:
  title: 时空智能服务平台 API
  description: '时空智能服务平台后端接口文档。


    ## 认证方式

    本平台使用 Django Session 认证机制：

    1. `GET /api/auth/csrf/` 获取 CSRF Token

    2. `POST /api/auth/login/` 登录建立 Session

    3. 后续请求携带 `sessionid` Cookie 和 `X-CSRFToken` 请求头


    ## 权限体系

    - **功能权限**：30 余项细粒度功能权限，通过用户组分配，按后台权限、日志权限、概览权限、数据权限、人员权限分组管理

    - **数据访问权限**：基于 `access_groups` 的数据隔离


    ## 错误处理

    所有错误响应包含 `detail` 字段描述错误原因。

    API 接口不会返回登录页 HTML：未认证请求返回 JSON `401`，CSRF 校验失败返回 JSON `403`。

    '
  version: 0.1.0
  contact:
    name: API Support
    email: support@huyang.example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: /
  description: 平台同源入口（浏览器与默认 SDK）
- url: http://localhost:8000
  description: 后端本地直连开发环境
- url: https://api.huyang.example.com
  description: 生产环境
tags:
- name: 公共接口
  description: 无需认证的公共接口
- name: 认证接口
  description: 用户认证相关接口
- name: 数据目录
  description: 数据资源管理接口
- name: 图层
  description: 地图图层接口
- name: 搜索
  description: 全局搜索接口
- name: 栅格数据
  description: 栅格数据管理接口
- name: 异步任务
  description: 异步任务状态查询接口
- name: 管理后台
  description: Ant Design Pro 管理后台用户、用户组、权限偏好和用户可配置设置接口
- name: 智能体
  description: 本地模型对话与当前项目只读数据智能体
- name: 邀请分享
  description: 精确用户名邀请及本人站内通知，不扩张项目和私有资源权限
paths:
  /api/sharing/check/:
    post:
      tags: [邀请分享]
      summary: 精确用户名分享预检
      description: 当前单项目内检查分享者对象管理权、目标账号及双方功能/项目/全部依赖权限，不列出或搜索用户，不创建邀请或授予访问。
      operationId: checkShareInvitation
      security: [{sessionAuth: []}]
      parameters:
      - {name: X-Project-Id, in: header, description: 单个业务项目，缺省公开项目1，不支持all, schema: {type: integer, minimum: 1, default: 1}}
      requestBody:
        required: true
        description: 分享对象和准确用户名，区分大小写
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ShareCheckRequest'}
      responses:
        '200':
          description: eligible表示能否发送，失败说明不暴露私有依赖名称
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShareCheckResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/sharing/invitations/:
    get:
      tags: [邀请分享]
      summary: 本人跨有权项目收发通知
      description: 仅本人收件或发件，跨当前仍有权访问的项目；通知不授予访问，打开和接受时重新核对权限。
      operationId: listShareInvitations
      security: [{sessionAuth: []}]
      parameters:
      - {name: box, in: query, description: 收件或发件，默认received, schema: {type: string, enum: [received, sent], default: received}}
      - {name: limit, in: query, description: 每页条数, schema: {type: integer, minimum: 1, maximum: 100, default: 30}}
      - {name: offset, in: query, description: 分页偏移, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        '200':
          description: 通知及该箱全部未读数
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShareInvitationList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [邀请分享]
      summary: 发出待接受邀请
      description: 当前单项目重新核对预检条件。相同幂等键复用原邀请；同对象同收件人已有pending/accepted时复用，不重复通知。只允许对象owner或既有有权管理员发送，工程限创建者或超级管理员；工程默认私有，接受后才授予只读，待接受或拒绝不授权。不赋予项目成员或owner_only权限。
      operationId: createShareInvitation
      security: [{sessionAuth: []}]
      parameters:
      - {name: X-Project-Id, in: header, description: 分享源对象所属单个业务项目，缺省公开项目1, schema: {type: integer, minimum: 1, default: 1}}
      requestBody:
        required: true
        description: 准确用户名、单个对象和提交幂等键
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ShareCreateRequest'}
      responses:
        '201':
          description: 邀请已发出，等待对方接受
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShareInvitation'}
        '200':
          description: 复用已有邀请，无重复通知
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShareInvitation'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/sharing/invitations/{invitationId}/respond/:
    post:
      tags: [邀请分享]
      summary: 接受或拒绝邀请
      description: 仅收件人响应pending邀请。接受前在邀请所属项目重验双方及所有依赖权限；失效记录unavailable并通知分享者。首次决定持久保存，重复同决定幂等，不同决定409。拒绝不授予任何访问。
      operationId: respondShareInvitation
      security: [{sessionAuth: []}]
      parameters:
      - {$ref: '#/components/parameters/ShareInvitationId'}
      requestBody:
        required: true
        description: 用户明确选择和幂等键
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ShareResponseRequest'}
      responses:
        '200':
          description: 持久决定或失效状态
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShareInvitation'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/sharing/invitations/{invitationId}/read/:
    post:
      tags: [邀请分享]
      summary: 标记本人这侧通知已读
      description: 仅邀请参与人；收件标记与分享者决定通知标记分别保存，重复请求无副作用。
      operationId: readShareInvitation
      security: [{sessionAuth: []}]
      parameters:
      - {$ref: '#/components/parameters/ShareInvitationId'}
      responses:
        '200':
          description: 更新后的邀请
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShareInvitation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/sharing/invitations/{invitationId}/open/:
    get:
      tags: [邀请分享]
      summary: 核对并打开已接受的单个对象
      description: 仅参与人，邀请须accepted。每次重新核对双方功能、当前项目、源对象及依赖；返回安全站内地址。单计算输出不返回整任务、输入快照、日志或兄弟输出；预览下载/入库继续各自鉴权。
      operationId: openShareInvitation
      security: [{sessionAuth: []}]
      parameters:
      - {$ref: '#/components/parameters/ShareInvitationId'}
      responses:
        '200':
          description: 当次核验后的目标及可选单输出
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShareOpenResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/bootstrap/:
    get:
      tags:
      - 公共接口
      summary: 获取系统启动配置
      description: 获取前端应用初始化所需的全局配置信息
      operationId: getBootstrap
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/login/overview/:
    get:
      tags:
      - 公共接口
      summary: 获取登录页平台概览
      description: '返回登录页首屏需要公开展示的平台品牌、数据统计、能力标签、服务状态和版本信息。

        该接口用于替换前端登录页中的静态展示数据，便于前后端分离开发时统一统计口径。

        接口无需登录，但不得返回敏感路径、内部配置、具体用户、权限组、服务器资源明细或未公开数据清单。

        '
      operationId: getLoginOverview
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginOverviewResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: 项目或对象不存在，或当前用户无权访问。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/health/:
    get:
      tags:
      - 公共接口
      summary: 健康检查
      operationId: getHealth
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  "/api/map/thumbnail-tiles/{z}/{x}/{y}.png":
    get:
      tags:
        - 公共接口
      summary: 获取地图缩略图同源瓦片
      description: |-
        返回右侧当前视角平面缩略图使用的底图瓦片。浏览器只请求平台同源地址，
        由服务器按当前 application.map 配置代理 Mapbox 或 OSM 瓦片并缓存到应用数据目录。
        成功瓦片会缓存到应用数据目录，缓存命中时按图片文件头保留真实 MIME 类型。
        当外部瓦片源暂时不可达且本地无缓存时，服务器返回本地生成的 Web Mercator 2D 世界地图瓦片，
        缺省 purpose=thumbnail 时保证缩略图可用。制图预览与正式导出必须指定 purpose=export，
        仅返回真实底图或其缓存，外部服务不可达且无缓存时返回 503，禁止用简化世界地图替代正式底图。

        导出显式传 basemap，按对应样式和服务商最大层级取图；缺少服务商配置返回 503。缓存按样式和注记层隔离。
      operationId: getMapThumbnailTile
      security: []
      parameters:
        - name: purpose
          in: query
          required: false
          description: thumbnail 为普通缩略图，允许网络故障时生成简化背景；export 用于制图预览和正式导出，仅接受真实底图或缓存，失败返回
            503 且不缓存失败响应。
          schema:
            type: string
            enum:
              - thumbnail
              - export
            default: thumbnail
        - name: z
          in: path
          required: true
          description: Web Mercator 层级；Mapbox 0–22、天地图 0–18、OSM 0–19。
          schema:
            type: integer
            minimum: 0
            maximum: 22
        - name: x
          in: path
          required: true
          description: Web Mercator 瓦片 X 坐标，必须在指定层级有效范围内。
          schema:
            type: integer
            minimum: 0
        - name: y
          in: path
          required: true
          description: Web Mercator 瓦片 Y 坐标，必须在指定层级有效范围内。
          schema:
            type: integer
            minimum: 0
        - name: basemap
          in: query
          required: false
          description: 受控底图标识；指定后不替换为服务器默认底图。天地图标签层使用 labels=1。
          schema:
            type: string
            enum:
              - mapbox-satellite
              - mapbox-streets
              - tianditu-vector
              - tianditu-imagery
              - osm
        - name: labels
          in: query
          required: false
          description: 天地图注记瓦片；1 为透明注记层，其余为主图。
          schema:
            type: string
            enum:
              - "0"
              - "1"
            default: "0"
      responses:
        "200":
          description: 成功返回图片瓦片。
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/avif:
              schema:
                type: string
                format: binary
            image/svg+xml:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: 项目或对象不存在，或当前用户无权访问。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: 制图底图暂时不可用且无真实瓦片缓存，返回 JSON 错误，Cache-Control 为 no-store，Retry-After 为
            2 秒。
          headers:
            Retry-After:
              description: 建议重试前等待的秒数。
              schema:
                type: integer
                example: 2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/csrf/:
    get:
      tags:
      - 认证接口
      summary: 获取 CSRF Cookie
      description: 设置 csrftoken Cookie，后续所有非 GET 请求需读取此 Cookie 值
      operationId: getCsrfCookie
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: 项目或对象不存在，或当前用户无权访问。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/login/:
    post:
      tags:
      - 认证接口
      summary: 用户登录
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: 项目或对象不存在，或当前用户无权访问。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/guest-login/:
    post:
      tags:
      - 认证接口
      summary: 游客登录
      description: '使用系统维护的专用 `guest` 账号建立游客会话。游客账号不可使用密码登录，只归属 `游客` 用户组；默认仅具备公开数据浏览、查询、图层加载和共享成果查看权限，管理员可在认证授权中调整游客角色权限。同一对象选择
        `游客` 访问角色即表示公开共享，其他已登录角色也保留对该公开对象的访问权。

        '
      operationId: guestLogin
      security: []
      responses:
        '200':
          description: 游客登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          description: 请求参数无效或项目范围冲突。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 项目或对象不存在，或当前用户无权访问。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/register/:
    post:
      tags:
      - 认证接口
      summary: 用户注册
      description: '注册新用户。系统首次初始化会自动创建用户名为 `admin` 的完整功能账号和超级管理员用户组，自助注册用户始终先加入普通用户角色。

        邮箱为必填项，后端统一转为小写并保证非空邮箱唯一；当前阶段不发送验证邮件，邮箱将为后续账号验证和密码找回保留。

        `accountPurpose=research` 只提交科研用户角色申请，不会在注册时直接授予科研用户权限；申请审核前账号仍按普通用户权限使用。

        注册功能受系统配置 `allowRegistration` 控制。

        '
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 项目或对象不存在，或当前用户无权访问。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/browser-session/:
    post:
      tags:
      - 认证接口
      summary: 维护当前平台页面的登录生命周期
      description: 登录、注册或游客登录后先使用start登记页面；resume恢复刷新页面或加入仍在线的同源标签。heartbeat每30秒续期120秒；suspend在页面离开时立即挂起当前页，20秒内可凭原令牌恢复正常刷新。没有可续接页面时abandon在后端注销旧会话。最后页面挂起或租约过期后，受保护接口返回401。令牌只保存在页面会话内，不用于URL、持久Cookie或本地持久存储。
      operationId: updateBrowserSession
      security:
      - sessionAuth: []
      requestBody:
        required: true
        description: 当前页面及动作；除abandon外必须提供该会话的随机令牌。
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrowserSessionRequest'
      responses:
        '200':
          description: 页面生命周期已更新；active表示仍存在有效页面租约。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/auth/logout/:
    post:
      tags:
      - 认证接口
      summary: 用户登出
      operationId: logout
      security:
      - sessionAuth: []
      responses:
        '200':
          description: 登出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          description: 请求参数无效或项目范围冲突。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 项目或对象不存在，或当前用户无权访问。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/access/:
    get:
      tags:
      - 认证授权
      summary: 读取本人可用功能和科研用户申请
      description: 只返回本人有效功能及智能体实际开放操作，升级差异按当前科研角色配置计算。
      operationId: getAccountAccess
      security:
      - sessionAuth: []
      responses:
        '200': &id001
          description: 当前账号功能和申请状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountAccess'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
  /api/auth/research-application/:
    post:
      tags:
      - 认证授权
      summary: 普通用户申请科研用户
