        numericFieldCount:
          type: integer
          minimum: 0
          description: 推断为数值指标的字段数
        textFieldCount:
          type: integer
          minimum: 0
          description: 推断为文本或标识符的字段数
        categoricalFieldCount:
          type: integer
          minimum: 0
          description: 推断为分类字段的字段数
        completeness:
          type: number
          minimum: 0
          maximum: 1
          description: 所有字段完整率的平均值
        updatedAt:
