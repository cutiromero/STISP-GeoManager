  /api/agent/runs/{runId}/compute-tasks/:
    get:
      tags:
      - 智能体
      operationId: getAgentComputeTasks
      summary: 读取智能体关联计算的实时状态
      description: 读取智能体关联计算的实时状态；重新核对当前项目、本人记录及实际计算权限。
      security:
      - sessionAuth: []
      parameters:
      - name: X-Project-Id
        in: header
        required: true
        description: 唯一当前项目 ID
        schema:
          type: integer
          minimum: 1
      - name: runId
        in: path
        required: true
        description: 本人智能体运行 ID
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentComputeTaskList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/agent/workflows/{workflowId}/confirm/:
    post:
      tags:
      - 智能体
      operationId: confirmAgentWorkflow
      summary: 提交计划或结果人工审核意见
      description: 确认计划并执行，或在 waiting_approval 时拒绝并停止后续操作。重新核对当前项目、本人记录、实际计算权限及计划哈希。审核意见持久保存，仅作为审核依据；不是算法编辑指令。拒绝保留已有计算和候选输出。暂停、状态冲突或过期计划返回409。批准时若本人另一工作流在queued、running、waiting_compute，返回409 detail明确任务、项目与来源对话，保留本次审批状态和选择，可通过活动任务摘要查看或结束计算任务后重试；拒绝不受计算名额限制。
      security:
      - sessionAuth: []
      parameters:
      - name: X-Project-Id
        in: header
        required: true
        description: 唯一当前项目 ID
        schema:
          type: integer
          minimum: 1
      - name: workflowId
        in: path
        required: true
        description: 工作流 UUID
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentWorkflow'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      requestBody:
        required: true
        description: 已审核计划的哈希、审核选择和可选意见。
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentWorkflowConfirmation'
  /api/agent/workflow-uploads/references/:
    parameters:
    - {name: X-Project-Id, in: header, required: true, description: 当前具体逻辑推理项目ID, schema: {type: integer, minimum: 1}}
    get:
      tags: [Agent]
      operationId: listAgentWorkflowCatalogResources
      summary: 搜索可供逻辑推理引用的系统数据
      description: 当前单项目内按资源访问权限筛选活动矢量、栅格、表格，排除任务资料；按更新时间、登记时间、ID倒序分页，返回总数和可见数据目录。需要智能体、工作流、算子和数据登记权限。
      security: [{sessionAuth: []}]
      parameters:
      - in: query
        name: q
        description: 名称或说明搜索词，最多200字
        schema: {type: string, maxLength: 200}
      - {in: query, name: page, description: 页码，从1开始, schema: {type: integer, minimum: 1, default: 1}}
      - {in: query, name: pageSize, description: 每页条数，上限50, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
      - {in: query, name: directoryId, description: 数据目录（存量数据组别）ID，0表示未分组, schema: {type: integer, minimum: 0}}
      responses:
        '200':
          description: 有权访问的目录资源
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentWorkflowCatalogPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Agent]
      operationId: addAgentWorkflowCatalogReferences
      summary: 将系统数据引用加入任务批次
      description: 仅逻辑推理项目使用，权限与上传一致。原子加入有权访问的当前项目活动资源，不复制或改变目录资源；同一资源可被多个批次引用。重复加入同批次返回原条目，已发送或绑定批次返回409。移除仅解除引用。资料画像读取真实计算输入（栅格原始数据而非可能增加alpha波段的显示COG）。
      security: [{sessionAuth: []}]
      requestBody:
        required: true
        description: 批次及目录资源ID
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [batchId, resourceIds]
              properties:
                batchId: {type: string, pattern: '^[0-9a-f]{32}$', description: 客户端生成的批次号}
                resourceIds:
                  type: array
                  minItems: 1
                  maxItems: 12
                  uniqueItems: true
                  description: 当前项目的目录资源ID，含上传资料合计最多12份
                  items: {type: integer, minimum: 1, description: 资源ID}
      responses:
        '200':
          description: 本次引用的批次条目
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentWorkflowUploadList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/agent/workflow-uploads/batch/:
    post:
      tags: [智能体]
      operationId: uploadAgentWorkflowBatch
      summary: 批量上传任务资料或总压缩包
      description: 权限与单文件上传相同。多个文件或ZIP内子目录中的资料登记到同一批次，Shapefile同目录同名组成文件合并。忽略系统及旁车文件。拒绝绝对路径、父目录、链接、重复路径、加密条目；最多512个条目，累计解压上限为uploadMaxMb与512MiB的较小值，每批最多12份资料。安全预检失败的ZIP不登记任何资料，其余逐份返回错误；已有单Shapefile ZIP接口不变。
      security: [{sessionAuth: []}]
      parameters:
      - name: X-Project-Id
        in: header
        required: true
        description: 唯一当前项目ID
        schema: {type: integer, minimum: 1}
      requestBody:
        required: true
        description: 同批次的多个文件或总ZIP
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [batchId, files]
              properties:
                batchId: {type: string, pattern: '^[0-9a-f]{32}$', description: 客户端批次号}
                files:
                  type: array
                  minItems: 1
                  maxItems: 512
                  description: 资料文件、Shapefile组成文件或总ZIP
                  items: {type: string, format: binary, description: 上传文件}
      responses:
        '200':
          description: 逐份登记结果，允许部分或全部失败
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentWorkflowBatchResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/agent/logic-configuration/:
    parameters:
    - {name: X-Project-Id, in: header, required: true, description: 当前具体逻辑推理项目ID, schema: {type: integer, minimum: 1}}
    get:
      tags: [Agent]
      operationId: getAgentLogicConfiguration
      summary: 读取本人上次已确认的逻辑推理配置
      description: 按当前用户和项目隔离，重验资源权限；失效资源仅返回ID，不暴露名称。只保存系统数据，上传资料不进入配置。需要与逻辑推理上传相同的权限。
      security: [{sessionAuth: []}]
      responses:
        '200':
          description: 配置与失效资源ID；没有配置时configuration为null
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentLogicConfigurationResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Agent]
      operationId: restoreAgentLogicConfiguration
      summary: 将上次配置的有效系统数据引用加入新批次
      description: 按本人和当前项目重新鉴权并读取真实画像；不复用临时上传。字段和角色仅在本次发送显式请求复用、资料及画像完全一致时沿用，计划和逐项批准始终重新确认。
      security: [{sessionAuth: []}]
      requestBody:
        required: true
        description: 尚未发送的新资料批次
        content:
          application/json:
            schema:
              type: object
              required: [batchId]
              additionalProperties: false
              properties:
                batchId: {type: string, pattern: '^[a-f0-9]{32}$', description: 资料批次号}
      responses:
        '200':
          description: 恢复的引用、配置与失效资源ID
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentLogicConfigurationResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/agent/workflow-uploads/recognize/:
    post:
      tags: [智能体]
      operationId: recognizeAgentWorkflowRoles
      summary: 识别本批次资料角色
      description: 与上传相同权限；只处理本人当前项目的未绑定批次。真实模型依据完整资料画像给出建议；模拟模型、模型失败或结果校验失败时退回规则，并明确规则理由。每个角色最多一份且类型与几何必须匹配；未识别地质图时返回问题。不创建工作流，不执行算法。
      security: [{sessionAuth: []}]
      parameters:
      - name: X-Project-Id
        in: header
        required: true
        description: 唯一当前项目ID
        schema: {type: integer, minimum: 1}
      requestBody:
        required: true
        description: 批次和当前可用模型
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [batchId, model]
              properties:
                batchId: {type: string, pattern: '^[0-9a-f]{32}$', description: 上传批次号}
                model: {type: string, description: 当前授权模型标识}
      responses:
        '200':
          description: 可由用户修改的角色建议
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentWorkflowRoleResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/agent/workflows/active/:
    get:
      tags: [智能体]
      operationId: getActiveAgentWorkflow
      summary: 读取本人计算中与停放的工作流
      description: 需要当前项目智能体和MH-workflow权限。item仅返回queued、running、waiting_compute中的唯一计算任务；parked返回waiting_approval、paused的待处理任务，不阻挡新建。跨项目仅返回本人任务摘要、来源对话及项目ID，不返回资料或计划。新建、批准或恢复若遇另一计算任务返回409 detail，包含任务、对话及项目标识，用户可在本摘要查看或结束该任务后重试；原确认与暂停点保持不变。查看详情与取消仍校验目标项目权限。
      security: [{sessionAuth: []}]
      parameters:
      - name: X-Project-Id
        in: header
        required: true
        description: 唯一当前项目ID
        schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: 本人活动任务摘要，没有时item为null
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [item, parked]
                properties:
                  item:
                    description: 挡路任务摘要或null
                    oneOf:
                    - {$ref: '#/components/schemas/AgentActiveWorkflow'}
                    - {type: 'null'}
                  parked:
                    type: array
                    description: 按更新时间倒序的本人停放任务，可查看或结束，不占计算名额
                    items: {$ref: '#/components/schemas/AgentActiveWorkflow'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/agent/workflow-uploads/:
    get:
      tags: [智能体]
      operationId: listAgentWorkflowUploads
      summary: 列出本次任务上传的资料
      description: 列出本人在当前项目某个上传批次中的资料及识别结果。需要智能体与MH-workflow权限；只返回本人上传，已删除或停用的资料不返回。
      security:
      - sessionAuth: []
      parameters:
      - name: X-Project-Id
        in: header
        required: true
        description: 唯一当前项目 ID
        schema: {type: integer, minimum: 1}
      - name: batchId
        in: query
        required: true
        description: 客户端生成的上传批次号，32位小写十六进制
        schema: {type: string, pattern: '^[0-9a-f]{32}$'}
      responses:
        '200':
          description: 上传列表
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentWorkflowUploadList'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [智能体]
      operationId: uploadAgentWorkflowFile
      summary: 上传任务资料并识别
      description: 上传一个文件作为通用地质推理任务的资料。经既有导入服务校验后登记为仅上传者可见的数据资源，不进入项目数据目录；返回类型、坐标系、几何、字段与示例取值，以及推荐角色。需要智能体访问、MH-workflow、智能体调用算子及当前项目数据登记权限。每个批次最多12个文件；批次已绑定任务时返回409。
      security:
      - sessionAuth: []
      parameters:
      - name: X-Project-Id
        in: header
        required: true
        description: 唯一当前项目 ID
        schema: {type: integer, minimum: 1}
      requestBody:
        required: true
        description: 一个资料文件及其批次号
        content:
          multipart/form-data:
            schema:
              type: object
              description: 矢量支持Shapefile ZIP、GeoPackage、GeoJSON；栅格支持GeoTIFF；表格支持CSV、XLSX。大小沿用平台导入限制。
              additionalProperties: false
              required: [file, batchId]
              properties:
                file:
                  type: string
                  format: binary
                  description: 资料文件
                batchId:
                  type: string
                  pattern: '^[0-9a-f]{32}$'
                  description: 客户端生成的上传批次号
      responses:
        '201':
          description: 已登记并完成识别
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentWorkflowUpload'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/agent/workflow-uploads/{uploadId}/:
    delete:
      tags: [智能体]
      operationId: deleteAgentWorkflowUpload
      summary: 删除尚未使用的任务资料
      description: 移除本人当前项目尚未发送或绑定任务的资料。上传条目删除后停用其专有资源；系统目录条目只解除引用，绝不停用、删除或更改原资源。已发送或绑定任务的资料作为任务依据保留，返回409。
      security:
      - sessionAuth: []
      parameters:
      - name: X-Project-Id
        in: header
        required: true
        description: 唯一当前项目 ID
        schema: {type: integer, minimum: 1}
      - name: uploadId
        in: path
        required: true
        description: 上传记录 UUID
        schema: {type: string, format: uuid}
      responses:
        '204':
          description: 已删除
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
