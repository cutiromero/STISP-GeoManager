          description: 成果显示名称
        description:
          type: string
          description: 成果摘要
        sourceType:
          $ref: "#/components/schemas/ResultArtifactSourceType"
        resultType:
          $ref: "#/components/schemas/ResultArtifactType"
        status:
          $ref: "#/components/schemas/ResultArtifactStatus"
