      required:
      - name
      - type
      - label
      - description
      - unit
      - role
      - nullable
      - nonNullCount
      - nullCount
      - completeness
      - uniqueCount
      - sampleValues
      properties:
        name:
          type: string
          description: 字段名
        type:
          type: string
          enum:
          - integer
          - float
          - boolean
          - string
