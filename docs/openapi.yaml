        repairInvalidGeometries:
          type: boolean
          default: false
          description: 是否使用 make_valid 尝试修复无效几何
        skipInvalidGeometries:
          type: boolean
          default: false
          description: 是否跳过修复后仍无效、空或 null 的几何
    VectorImportValidateResponse:
      type: object
      required:
      - layer
      - validationIssues
      - duplicateTarget
