          type: [string, 'null']
          description: 卡片用缩略图地址，包含所属项目的 projectTagId；仅PNG、JPG/JPEG成果提供，其余格式为null。首次请求时生成并缓存于服务器；公开访问允许浏览器缓存，登录用户或私有项目沿用不缓存策略。
        downloadUrl:
          type: string
          description: 成果下载地址 URL 包含所属项目的 projectTagId；预览只读，原文件下载仍要求下载/导出权限。
