          type: array
          minItems: 1
          description: 登录页公开展示的关键服务状态列表。
          items:
            $ref: '#/components/schemas/LoginOverviewServiceItem'
        nodeSummary:
          $ref: '#/components/schemas/LoginOverviewNodeSummary'
    LoginOverviewServiceItem:
      type: object
      required:
      - id
      - label
      - status
      - description
      properties:
        id:
          type: string
          enum:
          - resourceCatalog
          - layerService
          - permissionGateway
          description: 服务项标识，前端可据此匹配固定文案或图标。
          example: resourceCatalog
        label:
          type: string
          description: 服务项显示名称。
          example: 资源目录
        status:
          $ref: '#/components/schemas/LoginOverviewStatus'
        description:
          type: string
          description: 服务项状态说明。
          example: 已完成公开资源目录索引统计。
    LoginOverviewNodeSummary:
      type: object
      required:
      - total
      - normal
      - warning
      - risk
      - legend
      properties:
        total:
          type: integer
          minimum: 0
          description: 服务状态点阵节点总数。
          example: 24
        normal:
          type: integer
          minimum: 0
          description: 正常节点数量。
          example: 21
        warning:
          type: integer
          minimum: 0
          description: 待同步或告警节点数量。
          example: 2
        risk:
          type: integer
          minimum: 0
          description: 异常或风险节点数量。
          example: 1
        legend:
          type: array
          minItems: 1
          description: 点阵图例，前端按该数组展示状态名称和数量。
          items:
            $ref: '#/components/schemas/LoginOverviewStatusLegendItem'
    LoginOverviewStatusLegendItem:
      type: object
      required:
      - status
      - label
      - count
      properties:
        status:
          $ref: '#/components/schemas/LoginOverviewStatus'
        label:
          type: string
          description: 状态中文标签。
          example: 正常
        count:
          type: integer
          minimum: 0
          description: 该状态对应的节点数量。
          example: 21
    LoginOverviewStatus:
      type: string
      enum:
      - normal
      - warning
      - risk
      description: 登录页公开服务状态；normal 表示正常，warning 表示待同步或告警，risk 表示异常或风险。
      example: normal
    LoginOverviewFooter:
      type: object
      required:
      - statisticsNotice
      properties:
        statisticsNotice:
          type: string
          description: 登录页底部统计口径说明或后端数据来源说明。
          example: 统计口径已接入后端平台概览接口
    MapConfig:
      type: object
      required:
      - defaultCenter
      - defaultZoom
      - defaultBasemap
      - mapboxAccessToken
      - tiandituAccessToken
      properties:
        defaultCenter:
          type: array
          description: 默认地图中心点，经纬度顺序为 [longitude, latitude]
          minItems: 2
          maxItems: 2
          items:
            type: number
          example:
          - 87.6
          - 41.7
        defaultZoom:
          type: number
          description: 默认地图缩放级别
          example: 6.5
        defaultBasemap:
          type: string
          enum:
          - satellite
          - mapbox-streets
          - tianditu-vector
          - tianditu-imagery
          - osm
          description: 默认底图标识；正式选项为 satellite、mapbox-streets、tianditu-vector 或 tianditu-imagery；osm 只作为历史配置兼容返回或输入，并在管理员下次保存系统设置时迁移为
            satellite
          example: satellite
        mapboxAccessToken:
          type: string
          pattern: ^(pk\..+)?$
          description: 前端加载 Mapbox 服务所需的 pk.* 浏览器公开 Token；为空字符串表示未配置，sk.* 私密 Token 会被拒绝
        tiandituAccessToken:
          type: string
          pattern: ^[A-Za-z0-9]{32}$|^$
          description: 前端加载天地图球面墨卡托 WMTS 服务所需的 32 位浏览器公开 Key，对应请求参数 tk；为空字符串表示未配置。该字段会经公共 Bootstrap 接口下发，不得保存服务端私密凭证
    SystemLimits:
      type: object
      required:
      - uploadMaxMb
      - queryResultLimit
      - maxRasterSidePixels
      properties:
        uploadMaxMb:
          type: integer
          minimum: 1
          maximum: 1024
          description: 可配置的栅格与独立成果文件单次上传上限，单位 MB；矢量与表格导入仍受更低的独立内存安全限制，专题出图 PNG 固定使用独立 128 MB 上限且不随本项变化
          example: 64
        queryResultLimit:
          type: integer
          description: 单次查询返回结果上限
          example: 5000
        maxRasterSidePixels:
          type: integer
          description: 栅格上传和导入允许的最大单边像素长度
          example: 12000
    AdminSystemLimitsUpdate:
      type: object
      description: 后台允许局部更新的安全限制；前端限制不替代后端范围校验。
      properties:
        uploadMaxMb:
          type: integer
          minimum: 1
          maximum: 1024
          description: 可配置的栅格与独立成果文件单次上传上限，单位 MB；最高 1024 MB，Waitress 使用 1152 MiB 请求体限制预留 multipart 开销；矢量与表格导入仍受更低的独立内存安全限制，专题出图
            PNG 固定使用独立 128 MB 上限且不随本项变化
          example: 64
        queryResultLimit:
          type: integer
          minimum: 100
          maximum: 10000
          description: 单次查询返回结果上限
          example: 5000
        maxRasterSidePixels:
          type: integer
          minimum: 1
          maximum: 12000
          description: 栅格上传和导入允许的最大单边像素长度
          example: 12000
    HealthResponse:
      type: object
      required:
      - status
      - configLoaded
      - configFormat
      - appSubdirs
      - researchSubdirs
      properties:
        status:
          type: string
          description: 服务健康状态
          example: ok
        configLoaded:
          type: boolean
          description: TOML 配置是否已加载
          example: true
        configFormat:
          type: string
          enum:
          - toml
          description: 当前应用配置文件格式
          example: toml
        appSubdirs:
          type: array
          description: 业务数据根目录下固定子目录
          items:
            type: string
        researchSubdirs:
          type: array
          description: 科研数据根目录下固定子目录
          items:
            type: string
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
          description: 用户名
        password:
          type: string
          format: password
          description: 密码，至少 6 位
        remember:
          type: boolean
          default: false
          deprecated: true
          description: 兼容旧客户端的输入；当前所有角色均使用页面会话，此值不再启用持久登录。
    BrowserSessionRequest:
      type: object
      description: 平台页面会话维护请求；正常刷新续接与新标签加入均须持有服务端验证的令牌。
      required:
      - action
      properties:
        action:
          type: string
          enum: [start, resume, heartbeat, suspend, abandon]
          description: start用于刚登录的页面，resume用于刷新或在线标签交接，heartbeat续期，suspend挂起，abandon注销无法续接的会话。
        pageId:
          type: string
          minLength: 16
          maxLength: 80
          pattern: '^[A-Za-z0-9_-]+$'
          description: 页面随机标识；除abandon外必填，各标签独立。
        token:
          type: string
          minLength: 64
          maxLength: 64
          pattern: '^[a-f0-9]+$'
          description: 32字节随机令牌的十六进制文本；除abandon外必填，服务端只保存摘要。
        sequence:
          type: integer
          minimum: 1
          description: 同一页面单调递增的请求序号；除abandon外必填，旧心跳不得覆盖退出或刷新后的较新状态。
    BrowserSessionResponse:
      type: object
      description: 当前页面会话维护结果。
      required:
      - detail
      - active
      properties:
        detail:
          type: string
          description: 生命周期处理结果说明。
        active:
          type: boolean
          description: 是否仍有可用于后端鉴权的有效页面租约。
    LoginResponse:
      type: object
      required:
      - user
      properties:
        user:
          $ref: '#/components/schemas/UserInfo'
    RegisterRequest:
      type: object
      required:
      - username
      - email
      - password
      - passwordConfirm
      - accountPurpose
      properties:
        username:
          type: string
          description: 用户名（唯一）
        email:
          type: string
          format: email
          description: 必填邮箱；后端去除首尾空格、统一转为小写并保证非空邮箱唯一
        password:
          type: string
          format: password
          description: 密码
        passwordConfirm:
          type: string
          format: password
          description: 确认密码
        accountPurpose:
          type: string
          enum:
          - standard
          - research
          description: 账号用途；standard 直接注册普通用户，research 注册普通用户并提交科研用户角色申请
        displayName:
          type: string
          maxLength: 150
          description: 显示名称；申请科研用户时必填
        department:
          type: string
          maxLength: 120
          description: 单位或部门；申请科研用户时必填
        applicationReason:
          type: string
          maxLength: 500
          description: 科研用户申请说明；accountPurpose 为 research 时必填
    RegisterResponse:
      type: object
      required:
      - user
      - detail
      - roleApplication
      properties:
        user:
          $ref: '#/components/schemas/UserInfo'
        detail:
          type: string
          description: 注册结果说明
        roleApplication:
          description: 科研用户角色申请；普通用户注册时为 null
          oneOf:
          - $ref: '#/components/schemas/RoleApplication'
          - type: 'null'
    RoleApplicationStatus:
      type: string
      enum:
      - pending
      - approved
      - rejected
      description: 角色申请状态
    AccountAccess:
      type: object
      required:
      - permissions
      - agentActions
      - researchEligible
      - researchAdditionalPermissions
      - application
      properties:
        permissions:
          type: array
          description: 本人当前可用功能，不含未授予或关闭项
          items:
            $ref: '#/components/schemas/AdminPermissionItem'
        agentActions:
          type: array
          description: 当前智能体策略开放的附加操作
          items:
            type: string
        researchEligible:
          type: boolean
          description: 是否满足科研用户申请条件
        researchAdditionalPermissions:
          type: array
          description: 成为科研用户后新增的功能，单独展示
          items:
            $ref: '#/components/schemas/AdminPermissionItem'
        application:
          description: 本人最新申请，尚未申请为null
          oneOf:
          - $ref: '#/components/schemas/RoleApplication'
          - type: 'null'
    ResearchApplicationRequest:
      type: object
      required:
      - displayName
      - department
      - reason
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 150
          description: 申请人姓名
        department:
          type: string
          minLength: 1
          maxLength: 120
          description: 单位或部门
        reason:
          type: string
          minLength: 1
          maxLength: 2000
          description: 科研使用需求和申请理由
    RoleApplication:
      type: object
      required:
      - id
      - userId
      - requestedRole
      - status
      - reason
      - reviewNote
      - createdAt
      - reviewedAt
      properties:
        id:
          type: integer
          description: 角色申请 ID
        userId:
          type: integer
          description: 申请用户 ID
        requestedRole:
          type: string
          enum:
          - research
          description: 申请的受控角色；当前仅支持科研用户
        status:
          $ref: '#/components/schemas/RoleApplicationStatus'
        reason:
          type: string
          description: 用户提交的申请说明
        reviewNote:
          type: string
          description: 管理员审核说明，未审核时为空字符串
        createdAt:
          type: string
          format: date-time
          description: 申请时间
        reviewedAt:
          description: 审核时间，未审核时为 null
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
    RoleApplicationListItem:
      allOf:
      - $ref: '#/components/schemas/RoleApplication'
      - type: object
        required:
        - user
        - reviewer
        properties:
          user:
            $ref: '#/components/schemas/RoleApplicationUserSummary'
          reviewer:
            description: 审核人，未审核时为 null
            oneOf:
            - $ref: '#/components/schemas/RoleApplicationUserSummary'
            - type: 'null'
    RoleApplicationUserSummary:
      type: object
      required:
      - id
      - username
      - displayName
      - email
      - department
      properties:
        id:
          type: integer
          description: 用户 ID
        username:
          type: string
          description: 登录用户名
        displayName:
          type: string
          description: 显示名称
        email:
          type: string
          format: email
          description: 用户邮箱
        department:
          type: string
          description: 用户单位或部门
    RoleApplicationListResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          description: 当前主体可见的角色申请
          items:
            $ref: '#/components/schemas/RoleApplicationListItem'
    RoleApplicationReviewRequest:
      type: object
      required:
      - action
      properties:
        action:
          type: string
          enum:
          - approve
          - reject
          description: 审核动作
        reviewNote:
          type: string
          maxLength: 500
          description: 审核说明；拒绝时建议填写原因
    UserInfoResponse:
      type: object
      required:
      - authenticated
      - user
      properties:
        authenticated:
          type: boolean
          description: 当前请求是否已认证
          example: true
        user:
          $ref: '#/components/schemas/BaseUserInfo'
    UnauthenticatedUserInfoResponse:
      type: object
      required:
      - authenticated
      properties:
        authenticated:
          type: boolean
          enum:
          - false
          description: 当前请求未认证
    BaseUserInfo:
      type: object
      required:
      - id
      - username
      - displayName
      - email
      - avatarUrl
      - department
      - isStaff
      - isSuperuser
      - roles
      - permissions
      properties:
        id:
          type: integer
          description: 用户 ID
        username:
          type: string
          description: 登录用户名
        displayName:
          type: string
          description: 展示名称
        email:
          type: string
          description: 用户邮箱
        avatarUrl:
          type: string
          description: 用户头像 URL，为空字符串表示未设置
        department:
          type: string
          description: 用户所在部门，为空字符串表示未设置
        isStaff:
          type: boolean
          description: 是否具备 Django staff 标记
        isSuperuser:
          type: boolean
          description: 是否带有 Django superuser 标记；初始化的 admin 完整功能账号通常为 false
        roles:
          type: array
          description: 用户所属 Django Group 名称列表
          items:
            type: string
        permissions:
          $ref: '#/components/schemas/UserPermissions'
    UserPermissions:
      type: object
      required:
      - canAccessAdmin
      - canManageFeaturePermissions
      - canCreateUser
      - canViewOperationLogs
      - canViewAllOperationLogs
      - canViewOwnOperationLogs
      - canViewGroupOperationLogs
      - canViewSystemLogs
      - canManageSystemSettings
      - canManageDataBackup
      - canManageAuth
      - canViewDashboardResourceCard
      - canViewDashboardLayerCard
      - canViewDashboardRasterCard
      - canViewDashboardUserCard
      - canViewDashboardActiveUsersCard
      - canViewDashboardSystemCard
      - canViewDataOverview
      - canBrowseData
      - canQueryData
      - canUploadData
      - canViewDataResources
      - canCreateDataResources
      - canChangeDataResources
      - canDeleteDataResources
      - canLoadVectorLayer
      - canLoadRasterLayer
      - canUseCustomSymbolization
      - canUseAiInterpretation
      - canExportData
      - canViewWorkspaces
      - canCreateWorkspaces
      - canChangeWorkspaces
      - canDeleteWorkspaces
      - canViewMapCompositions
      - canCreateMapCompositions
      - canChangeMapCompositions
      - canDeleteMapCompositions
      - canExportMapCompositions
      - canPublishMapCompositions
      - canRestoreMapCompositions
      - canViewResultArtifacts
      - canImportResultArtifacts
      - canDownloadResultArtifacts
      - canPublishResultArtifacts
      - canDeleteResultArtifacts
      - canManageRasterData
      properties:
        canAccessAdmin:
          type: boolean
          description: 当前登录会话是否具备至少一项运行概览、日志、系统设置、备份或认证授权等运维权限。普通用户、科研用户和游客在仅有数据业务权限时为 false，前端隐藏后台入口；个人设置仍可独立访问。
        canManageFeaturePermissions:
          type: boolean
          description: 是否可配置功能权限
        canCreateUser:
          type: boolean
          description: 是否可在后台创建新用户
        canViewOperationLogs:
          type: boolean
          description: 是否可查看操作日志
        canViewAllOperationLogs:
          type: boolean
          description: 是否可查看所有用户日志
        canViewOwnOperationLogs:
          type: boolean
          description: 是否可查看自己的日志
        canViewGroupOperationLogs:
          type: boolean
          description: 是否可查看指定用户组日志
        canViewSystemLogs:
          type: boolean
          description: 是否可查看后台运行日志，由 `core.view_system_logs` 权限控制
        canManageSystemSettings:
          type: boolean
          description: 是否可修改系统设置
        canManageDataBackup:
          type: boolean
          description: 是否可管理数据备份；仅内置 `超级管理员` 且具备 `core.manage_data_backup` 时为 true
        canManageAuth:
          type: boolean
          description: 是否可修改认证授权
        canViewDashboardResourceCard:
          type: boolean
          description: 是否可查看概览数据资源卡片
        canViewDashboardLayerCard:
          type: boolean
          description: 是否可查看概览图层数卡片
        canViewDashboardRasterCard:
          type: boolean
          description: 是否可查看概览栅格数量卡片
        canViewDashboardUserCard:
          type: boolean
          description: 是否可查看概览用户数量卡片
        canViewDashboardActiveUsersCard:
          type: boolean
          description: 是否可查看概览活跃用户卡片
        canViewDashboardSystemCard:
          type: boolean
          description: 是否可查看概览系统信息
        canViewDataOverview:
          type: boolean
          description: 是否可查看数据概览中的“我可见”范围、兼容旧版的全局统计字段，以及超级管理员上传用户统计；当前用户自己的上传概览无需此权限
        canBrowseData:
          type: boolean
          description: 是否可浏览数据目录
        canQueryData:
          type: boolean
          description: 是否可查询数据
        canUploadData:
          type: boolean
          description: 是否可新增数据资源，对应 `catalog.add_dataresource`
        canViewDataResources:
          type: boolean
          description: 是否可查看存量数据资源，对应 `catalog.view_dataresource`
        canCreateDataResources:
          type: boolean
          description: 是否可新增数据资源，对应 `catalog.add_dataresource`
        canChangeDataResources:
          type: boolean
          description: 是否可编辑数据资源，对应 `catalog.change_dataresource`
        canDeleteDataResources:
          type: boolean
          description: 是否可删除数据资源，对应 `catalog.delete_dataresource`
        canLoadVectorLayer:
          type: boolean
          description: 是否可加载矢量图层
        canLoadRasterLayer:
          type: boolean
          description: 是否可加载栅格图层
        canUseCustomSymbolization:
          type: boolean
          description: 是否可提交自定义符号化规则
        canUseAiInterpretation:
          type: boolean
          description: 是否可使用 AI 智能解译功能，对应 `core.ai_interpretation`
        canExportData:
          type: boolean
          description: 是否可导出数据和当前视角地图 PNG，对应 `catalog.export_dataresource`
        canViewWorkspaces:
          type: boolean
          description: 是否可查看工程和专题，对应 `catalog.view_workspacescene`
        canCreateWorkspaces:
          type: boolean
          description: 是否可新增工程和专题，对应 `catalog.add_workspacescene`
        canChangeWorkspaces:
          type: boolean
          description: 是否可编辑工程和专题，对应 `catalog.change_workspacescene`
        canDeleteWorkspaces:
          type: boolean
          description: 是否可删除工程和专题，对应 `catalog.delete_workspacescene`
        canViewMapCompositions:
          type: boolean
          description: 是否可查看正式出图稿，对应 `catalog.view_mapcomposition`
        canCreateMapCompositions:
          type: boolean
          description: 是否可从工程新建出图稿，对应 `catalog.add_mapcomposition`
        canChangeMapCompositions:
          type: boolean
          description: 是否可编辑出图稿版式，对应 `catalog.change_mapcomposition`
        canDeleteMapCompositions:
          type: boolean
          description: 是否可永久删除出图稿，对应 `catalog.delete_mapcomposition`
        canExportMapCompositions:
          type: boolean
          description: 是否可生成并下载 PNG、JPG 或 PDF 专题成果，对应 `catalog.export_mapcomposition`
        canPublishMapCompositions:
          type: boolean
          description: 是否可发布或下架专题成果，对应 `catalog.publish_mapcomposition`
        canRestoreMapCompositions:
          type: boolean
          description: 是否可将专题成果版本还原为新工程，对应 `catalog.restore_mapcomposition`
        canViewResultArtifacts:
          type: boolean
          description: 是否可查看访问范围内的成果文件，对应 `catalog.view_resultartifact`
        canImportResultArtifacts:
          type: boolean
          description: 是否可导入成果文件，对应 `catalog.add_resultartifact`；实际导入还需成果查看和发布权限
        canDownloadResultArtifacts:
          type: boolean
          description: 是否可下载成果原文件，对应 `catalog.download_resultartifact`
        canPublishResultArtifacts:
          type: boolean
          description: 是否可直接发布、更新发布范围或下架成果文件，对应 `catalog.publish_resultartifact`
        canDeleteResultArtifacts:
          type: boolean
          description: 是否可删除本人或管理范围内的成果文件，对应 `catalog.delete_resultartifact`
        canManageRasterData:
          type: boolean
          description: 是否可管理栅格数据集
    AdminPermissionItem:
      type: object
      required:
      - id
      - label
      - group
      properties:
        id:
          type: string
          description: 权限完整标识，格式为 app_label.codename
          example: core.view_operation_logs
        label:
          type: string
          description: 权限中文名称
          example: 查看操作日志
        group:
          type: string
          description: 权限在管理界面中的分组名称，当前按后台权限、数据权限、人员权限归类
          example: 后台权限
    AdminProfileResponse:
      type: object
      required:
      - user
      - avatarUrl
      - department
      - grantedPermissions
      - disabledPermissions
      - effectivePermissions
      - availablePermissions
      properties:
        user:
          $ref: '#/components/schemas/UserInfo'
        avatarUrl:
          type: string
          description: 当前用户头像 URL
        department:
          type: string
          description: 当前用户部门
        grantedPermissions:
          type: array
          description: 上级授予当前用户的功能权限列表
          items:
            type: string
        disabledPermissions:
          type: array
          description: 当前用户主动关闭的已授予权限列表
          items:
            type: string
        effectivePermissions:
          type: array
          description: 授予权限扣除主动关闭权限后的实际生效权限列表
          items:
            type: string
        availablePermissions:
          type: array
          description: 管理后台可展示的功能权限元数据
          items:
            $ref: '#/components/schemas/AdminPermissionItem'
    AdminProfileUpdateRequest:
      type: object
      properties:
        username:
          type: string
          description: 新用户名
        displayName:
          type: string
          description: 新展示名称
        email:
          type: string
          format: email
          description: 新邮箱；提交时不能为空，后端统一转为小写并保证非空邮箱唯一
        avatarUrl:
          type: string
          description: 新头像 URL
        department:
          type: string
          description: 新部门
    AdminProfilePermissionsRequest:
      type: object
      required:
      - disabledPermissions
      properties:
        disabledPermissions:
          type: array
          description: 用户主动关闭的权限列表，必须全部属于 grantedPermissions
          items:
            type: string
    AdminProfilePasswordRequest:
      type: object
      required:
      - currentPassword
      - newPassword
      - passwordConfirm
      properties:
        currentPassword:
          type: string
          format: password
          description: 当前登录密码
        newPassword:
          type: string
          format: password
          description: 新密码，至少 6 位
        passwordConfirm:
          type: string
          format: password
          description: 新密码确认值，必须与 newPassword 一致
    AdminOperationLog:
      type: object
      required:
      - id
      - occurredAt
      - operator
      - module
      - action
      - result
      - targetType
      - targetId
      - targetCode
      - targetName
      - ipAddress
      - summary
      properties:
        id:
          type: integer
          description: 操作日志 ID
        occurredAt:
          type: string
          description: 本地时区格式化后的操作时间
          example: '2026-06-05 09:31:42'
        operator:
          type: string
          description: 操作用户显示名称，系统操作显示为“系统”
        module:
          type: string
          description: 操作所属模块
        action:
          type: string
          description: 操作动作
        result:
          type: string
          enum:
          - success
          - warning
          - failed
          description: 操作结果
        targetType:
          type: string
          description: 结构化操作目标类型；数据资源为 data_resource，工程/专题为 workspace_scene；无明确单一目标时为空字符串
        targetId:
          type:
          - integer
          - 'null'
          description: 操作目标的后台数据库 ID；删除后仍保留删除前 ID，无明确单一目标时为 null
        targetCode:
          type: string
          description: 操作目标编码；数据资源为 code，工程/专题为 kind，无编码时为空字符串
        targetName:
          type: string
          description: 操作目标名称；删除后仍保留删除前名称，无明确单一目标时为空字符串
        ipAddress:
          type: string
          description: 客户端 IP 地址，为空字符串表示未记录
        summary:
          type: string
          description: 操作摘要
    AdminOperationLogListResponse:
      type: object
      required:
      - items
      - total
      properties:
        items:
          type: array
          description: 当前页操作日志
          items:
            $ref: '#/components/schemas/AdminOperationLog'
        total:
          type: integer
          description: 符合筛选条件的总记录数
    AdminSystemLogFile:
      type: object
      required:
      - name
      - sizeBytes
      - modifiedAt
      properties:
        name:
          type: string
          description: 日志文件名，不包含服务器绝对路径
          example: application.log
        sizeBytes:
          type: integer
          description: 日志文件大小，单位字节
        modifiedAt:
          type: string
          format: date-time
          description: 日志文件最近修改时间
    AdminSystemLogResponse:
      type: object
      required:
      - files
      - selectedFile
      - lines
      - content
      - generatedAt
      properties:
        files:
          type: array
          description: 可选择的后台日志文件列表，按最近修改时间倒序排列
          items:
            $ref: '#/components/schemas/AdminSystemLogFile'
        selectedFile:
          type: string
          description: 当前读取的日志文件名；当没有日志文件时为空字符串
        lines:
          type: integer
          description: 本次返回的尾部日志行数上限
        content:
          type: string
          description: 当前日志文件尾部文本内容，按 UTF-8 解码，无法解码的字符会被替换
        generatedAt:
          type: string
          format: date-time
          description: 本次日志读取时间
    AdminDashboardResponse:
      type: object
      required:
      - generatedAt
      - cards
      properties:
        generatedAt:
          type: string
          format: date-time
          description: 概览统计生成时间
        cards:
          $ref: '#/components/schemas/AdminDashboardCards'
    AdminDashboardCards:
      type: object
      properties:
        resources:
          $ref: '#/components/schemas/AdminDashboardResourceCard'
        layers:
          $ref: '#/components/schemas/AdminDashboardLayerCard'
        rasters:
          $ref: '#/components/schemas/AdminDashboardRasterCard'
        dataOverview:
          $ref: '#/components/schemas/AdminDashboardDataOverviewCard'
        users:
          $ref: '#/components/schemas/AdminDashboardUserCard'
        activeUsers:
          $ref: '#/components/schemas/AdminDashboardActiveUsers'
      description: 按当前用户卡片权限返回的概览卡片数据；未授权卡片字段会被省略。dataOverview 始终包含当前用户自己的上传概览，其他范围由权限控制。
    AdminDashboardResourceCard:
      type: object
      required:
      - total
      - active
      properties:
        total:
          type: integer
          description: 数据资源总数
        active:
          type: integer
          description: 启用状态的数据资源数量
    AdminDashboardLayerCard:
      type: object
      required:
      - total
      - active
      properties:
        total:
          type: integer
          description: 图层总数
        active:
          type: integer
          description: 启用状态的图层数量
    AdminDashboardRasterCard:
      type: object
      required:
      - resources
      - datasets
      - layers
      properties:
        resources:
          type: integer
          description: 栅格数据资源数量
        datasets:
          type: integer
          description: 栅格数据集数量
        layers:
          type: integer
          description: 栅格图层数量
    AdminDashboardDataOverviewCard:
      type: object
      required:
      - ownUploads
      properties:
        totalResources:
          type: integer
          description: 系统数据资源总数，用于兼容旧版概览卡片；仅具备 `core.view_data_overview` 权限时返回，新版界面优先展示分组统计
        activeResources:
          type: integer
          description: 系统启用状态数据资源数量，用于兼容旧版概览卡片；仅具备 `core.view_data_overview` 权限时返回，新版界面优先展示分组统计
        totalSizeBytes:
          type: integer
          description: 系统数据总大小，单位字节，用于兼容旧版概览卡片；仅具备 `core.view_data_overview` 权限时返回，新版界面优先展示分组统计
        totalItemCount:
          type: integer
          description: 系统数据条目总数，用于兼容旧版概览卡片；仅具备 `core.view_data_overview` 权限时返回，新版界面优先展示分组统计
        typeBreakdown:
          type: array
          description: 系统按数据类型聚合的数据情况，用于兼容旧版概览卡片；仅具备 `core.view_data_overview` 权限时返回，新版界面优先展示分组统计
          items:
            $ref: '#/components/schemas/AdminDashboardDataTypeOverview'
        ownUploads:
          $ref: '#/components/schemas/AdminDashboardDataOverviewScope'
          description: 当前用户上传的数据资源聚合统计；登录用户无需额外功能权限即可查看
        visibleResources:
          $ref: '#/components/schemas/AdminDashboardDataOverviewScope'
          description: 当前用户可见的数据资源聚合统计；仅具备 `core.view_data_overview` 权限时返回，后端按数据可见范围和上传者本人规则裁剪
        uploaders:
          type: array
          description: 具备 `core.view_data_overview` 权限的超级管理员主体可见的上传用户统计；普通用户无该字段
          items:
            $ref: '#/components/schemas/AdminDashboardUploaderOverview'
    AdminDashboardDataOverviewScope:
      type: object
      required:
      - totalResources
      - activeResources
      - totalSizeBytes
      - totalItemCount
      - typeBreakdown
      - categoryBreakdown
      - unclassifiedCount
      - spatialSummary
      properties:
        totalResources:
          type: integer
          description: 该统计范围内的数据资源总数
        activeResources:
          type: integer
          description: 该统计范围内启用状态的数据资源数量
        totalSizeBytes:
          type: integer
          description: 该统计范围内数据总大小，单位字节
        totalItemCount:
          type: integer
          description: 该统计范围内数据条目总数
        typeBreakdown:
          type: array
          description: 该统计范围内按数据类型聚合的数据情况；始终返回平台支持的全部物理类型，暂无资源的类型计数为 0
          items:
            $ref: '#/components/schemas/AdminDashboardDataTypeOverview'
        categoryBreakdown:
          type: array
          description: 该统计范围内按当前权威业务分类体系聚合的数据情况；始终返回全部启用的大类和小类，暂无资源的分类计数为 0
          items:
            $ref: '#/components/schemas/AdminDashboardCategoryOverview'
        unclassifiedCount:
          type: integer
          description: 该统计范围内尚未挂接权威业务分类的数据资源数量
        spatialSummary:
          $ref: '#/components/schemas/AdminDashboardSpatialSummary'
          description: 该统计范围内可用于数据概览空间可视化的权限裁剪后空间摘要；仅基于当前分组内用户有权查看的数据资源计算
    AdminDashboardDataTypeOverview:
      type: object
      required:
      - dataType
      - count
      - sizeBytes
      - itemCount
      properties:
        dataType:
          type: string
          enum:
          - vector
          - raster
          - gene
          - table
          - document
          - image
          description: 数据类型
        count:
          type: integer
          description: 该类型数据资源数量
        sizeBytes:
          type: integer
          description: 该类型数据大小，单位字节
        itemCount:
          type: integer
          description: 该类型数据条目数
    AdminDashboardCategoryOverview:
      type: object
      required:
      - categoryCode
      - categoryName
      - count
      - sizeBytes
      - itemCount
      - children
      properties:
        categoryCode:
          type: string
          description: 一级业务分类编码
        categoryName:
          type: string
          description: 一级业务分类名称
        count:
          type: integer
          description: 该大类及其全部小类的数据资源数量
        sizeBytes:
          type: integer
          description: 该大类及其全部小类的数据大小，单位字节
        itemCount:
          type: integer
          description: 该大类及其全部小类的数据条目数
        children:
          type: array
          description: 当前大类下全部启用的小类统计，按分类排序返回并包含零计数项
          items:
            $ref: '#/components/schemas/AdminDashboardCategoryLeafOverview'
    AdminDashboardCategoryLeafOverview:
      type: object
      required:
      - categoryCode
      - categoryName
      - count
      - sizeBytes
      - itemCount
      properties:
        categoryCode:
          type: string
          description: 二级业务分类编码
        categoryName:
          type: string
          description: 二级业务分类名称
        count:
          type: integer
          description: 该小类的数据资源数量
        sizeBytes:
          type: integer
          description: 该小类的数据大小，单位字节
        itemCount:
          type: integer
          description: 该小类的数据条目数
    AdminDashboardSpatialSummary:
      type: object
      required:
      - spatialResourceCount
      - missingSpatialResourceCount
      - totalBounds
      - resourceExtents
      - resourceExtentsTruncated
      - coverageRanking
      - heatmapCells
      properties:
        spatialResourceCount:
          type: integer
          description: 当前统计范围内具备有效经纬度 bbox 的空间数据资源数量
        missingSpatialResourceCount:
          type: integer
          description: 当前统计范围内暂无可解析经纬度空间范围的数据资源数量
        totalBounds:
          type: array
          description: 当前统计范围内所有有效空间范围合并后的经纬度 bbox，顺序为 `[minLng, minLat, maxLng, maxLat]`；没有空间范围时为空数组
          maxItems: 4
          items:
            type: number
        resourceExtents:
          type: array
          description: 当前统计范围内用于绘制空间覆盖框的数据资源摘要，后端最多返回 80 项并按覆盖面积优先；所有条目均已按当前用户权限裁剪
          items:
            $ref: '#/components/schemas/AdminDashboardResourceExtent'
        resourceExtentsTruncated:
          type: boolean
          description: '`resourceExtents` 是否因数量超过前端概览展示上限而被截断'
        coverageRanking:
          type: array
          description: 当前统计范围内空间覆盖面积最大的前 10 个数据资源；所有条目均已按当前用户权限裁剪
          items:
            $ref: '#/components/schemas/AdminDashboardResourceExtent'
        heatmapCells:
          type: array
          description: 当前统计范围内按资源中心点聚合的热力网格；仅基于当前用户有权查看的数据资源生成，不包含未授权资源
          items:
            $ref: '#/components/schemas/AdminDashboardSpatialHeatmapCell'
    AdminDashboardResourceExtent:
      type: object
      required:
      - resourceId
      - name
      - dataType
      - bounds
      - center
      - coverageAreaKm2
      - sizeBytes
      - itemCount
      - coordinateSystem
      - uploaderName
      - updatedAt
      properties:
        resourceId:
          type: integer
          description: 数据资源 ID
        name:
          type: string
          description: 数据资源名称
        dataType:
          type: string
          enum:
          - vector
          - raster
          - gene
          - table
          - document
          - image
          description: 数据类型
        bounds:
          type: array
          minItems: 4
          maxItems: 4
          description: 数据资源经纬度 bbox，顺序为 `[minLng, minLat, maxLng, maxLat]`
          items:
            type: number
        center:
          type: array
          minItems: 2
          maxItems: 2
          description: 数据资源 bbox 中心点，顺序为 `[lng, lat]`
          items:
            type: number
        coverageAreaKm2:
          type: number
          description: 根据经纬度 bbox 估算的覆盖面积，单位平方公里，用于概览排行和相对比较
        sizeBytes:
          type: integer
          description: 数据大小，单位字节
        itemCount:
          type: integer
          description: 数据条目数
        coordinateSystem:
          type: string
          description: 数据坐标系说明；未知时为空字符串
        uploaderName:
          type: string
          description: 上传者或维护者展示名；未记录时返回“未记录”
        updatedAt:
          type: string
          format: date-time
          description: 数据资源最近更新时间
    AdminDashboardSpatialHeatmapCell:
      type: object
      required:
      - column
      - row
      - bounds
      - resourceCount
      - itemCount
      properties:
        column:
          type: integer
          description: 热力网格列序号，从 0 开始
        row:
          type: integer
          description: 热力网格行序号，从 0 开始
        bounds:
          type: array
          minItems: 4
          maxItems: 4
          description: 热力网格经纬度 bbox，顺序为 `[minLng, minLat, maxLng, maxLat]`
          items:
            type: number
        resourceCount:
          type: integer
          description: 落入该网格的数据资源数量
        itemCount:
          type: integer
          description: 落入该网格的数据资源条目数合计
    AdminDashboardUploaderOverview:
      type: object
      required:
      - user
      - resourceCount
      - sizeBytes
      - itemCount
      properties:
        user:
          $ref: '#/components/schemas/UserReference'
        resourceCount:
          type: integer
          description: 该用户上传或维护的数据资源数量
        sizeBytes:
          type: integer
          description: 该用户数据大小，单位字节
        itemCount:
          type: integer
          description: 该用户数据条目数
    AdminDashboardUserCard:
      type: object
      required:
      - total
      - active
      - disabled
      - groups
      - vectorResources
      - tableResources
      properties:
        total:
          type: integer
          description: 系统用户总数
        active:
          type: integer
          description: 启用账号数量
        disabled:
          type: integer
          description: 停用账号数量
        groups:
          type: integer
          description: 用户组数量
        vectorResources:
          type: integer
          description: 矢量数据资源数量
        tableResources:
          type: integer
          description: 表格数据资源数量
    AdminDashboardActiveUsers:
      type: object
      required:
      - period
      - rangeStart
      - rangeEnd
      - count
      - loginCount
      - series
      - ranking
      properties:
        period:
          type: string
          enum:
          - day
          - week
          - month
          description: 活跃用户统计周期
        rangeStart:
          type: string
          format: date
          description: 统计周期起始日期
        rangeEnd:
          type: string
          format: date
          description: 统计周期结束日期
        count:
          type: integer
          description: 周期内至少发起过一次已认证 API 请求的去重账号数量；保持既有会话跨日继续访问也计入当天活跃
        loginCount:
          type: integer
          description: 周期内成功建立会话的总次数，包含账号密码登录、游客登录和自助注册后的自动登录
        series:
          type: array
          description: 活跃账号柱状图序列，day 按小时去重，week/month 按日期去重
          items:
            $ref: '#/components/schemas/AdminDashboardActiveUserSeriesItem'
        ranking:
          type: array
          description: 周期内登录次数最多的用户排名
          items:
            $ref: '#/components/schemas/AdminDashboardActiveUserRank'
    AdminDashboardActiveUserSeriesItem:
      type: object
      required:
      - key
      - label
      - count
      properties:
        key:
          type: string
          description: 序列项唯一键，day 为小时值，week/month 为日期
        label:
          type: string
          description: 序列项显示标签
        count:
          type: integer
          description: 该小时或日期内发起过已认证 API 请求的去重账号数量
    AdminDashboardActiveUserRank:
      type: object
      required:
      - userId
      - displayName
      - username
      - loginCount
      properties:
        userId:
          type: integer
          description: 用户 ID
        displayName:
          type: string
          description: 用户显示名称
        username:
          type: string
          description: 用户名
        loginCount:
          type: integer
          description: 周期内成功登录次数
    AdminDashboardServerResponse:
      type: object
      required:
      - generatedAt
      - hostname
      - platform
      - cards
      properties:
        generatedAt:
          type: string
          format: date-time
          description: 服务器监控快照生成时间
        hostname:
          type: string
          description: 主机名
        platform:
          type: string
          description: 操作系统平台描述
        cards:
          $ref: '#/components/schemas/AdminDashboardServerCards'
    AdminDashboardServerCards:
      type: object
      properties:
        cpu:
          $ref: '#/components/schemas/AdminDashboardCpuInfo'
        memory:
          $ref: '#/components/schemas/AdminDashboardMemoryInfo'
        disks:
          $ref: '#/components/schemas/AdminDashboardDiskInfo'
        gpu:
          $ref: '#/components/schemas/AdminDashboardGpuInfo'
      description: 按当前用户卡片权限返回的服务器监控卡片数据；未授权卡片字段会被省略。
    AdminDashboardCpuInfo:
      type: object
      required:
      - model
      - physicalCount
      - logicalCount
      - usagePercent
      - loadAverage
      properties:
        model:
          type: string
          description: CPU 型号
        physicalCount:
          type: integer
          description: CPU 物理核心数量
        logicalCount:
          type: integer
          description: CPU 逻辑核心数量
        usagePercent:
          type: number
          format: float
          description: 基于 1 分钟负载估算的 CPU 使用率百分比
        loadAverage:
          type: array
          description: 1 分钟、5 分钟、15 分钟系统负载
          minItems: 3
          maxItems: 3
          items:
            type: number
            format: float
    AdminDashboardMemoryInfo:
      type: object
      required:
      - model
      - slotCount
      - totalBytes
      - usedBytes
      - availableBytes
      - usagePercent
      properties:
        model:
          type: string
          description: 内存型号或来源说明
        slotCount:
          type: integer
          description: 可识别的内存数量
        totalBytes:
          type: integer
          format: int64
          description: 内存总容量，单位字节
        usedBytes:
          type: integer
          format: int64
          description: 已使用内存容量，单位字节
        availableBytes:
          type: integer
          format: int64
          description: 可用内存容量，单位字节
        usagePercent:
          type: number
          format: float
          description: 内存使用率百分比
    AdminDashboardDiskInfo:
      type: object
      required:
      - count
      - devices
      - mount
      - totalBytes
      - usedBytes
      - freeBytes
      - usagePercent
      properties:
        count:
          type: integer
          description: 可识别硬盘数量
        devices:
          type: array
          description: 硬盘设备列表
          items:
            $ref: '#/components/schemas/AdminDashboardDiskDevice'
        mount:
          type: string
          description: 用于统计使用率的挂载路径
        totalBytes:
          type: integer
          format: int64
          description: 挂载路径总容量，单位字节
        usedBytes:
          type: integer
          format: int64
          description: 挂载路径已使用容量，单位字节
        freeBytes:
          type: integer
          format: int64
          description: 挂载路径可用容量，单位字节
        usagePercent:
          type: number
          format: float
          description: 挂载路径使用率百分比
    AdminDashboardDiskDevice:
      type: object
      required:
      - name
      - model
      - size
      properties:
        name:
          type: string
          description: 硬盘设备名称
        model:
          type: string
          description: 硬盘型号
        size:
          type: string
          description: 硬盘容量文本
    AdminDashboardGpuInfo:
      type: object
      required:
      - count
      - devices
      - totalMemoryBytes
      - usedMemoryBytes
      - usagePercent
      properties:
        count:
          type: integer
          minimum: 1
          description: 可识别的 GPU 数量，支持单卡和多卡服务器
        devices:
          type: array
          description: 每张 GPU 的型号、显存和利用率
          items:
            $ref: '#/components/schemas/AdminDashboardGpuDevice'
        totalMemoryBytes:
          type: integer
          format: int64
          description: 所有 GPU 显存总容量，单位字节
        usedMemoryBytes:
          type: integer
          format: int64
          description: 所有 GPU 已用显存，单位字节
        usagePercent:
          type: number
          format: float
          description: 按显存计算的总使用率百分比
    AdminDashboardGpuDevice:
      type: object
      required:
      - index
      - name
      - memoryTotalBytes
      - memoryUsedBytes
      - usagePercent
      - temperatureC
      properties:
        index:
          type: integer
          minimum: 0
          description: GPU 设备序号
        name:
          type: string
          description: GPU 型号
        memoryTotalBytes:
          type: integer
          format: int64
          description: 本卡显存总容量，单位字节
        memoryUsedBytes:
          type: integer
          format: int64
          description: 本卡已用显存，单位字节
        usagePercent:
          type: number
          format: float
          description: 本卡 GPU 利用率百分比
        temperatureC:
          type: number
          format: float
          description: 本卡温度，单位摄氏度
    UserInfo:
      allOf:
      - $ref: '#/components/schemas/BaseUserInfo'
      - type: object
        required:
        - groupIds
        - isActive
        - groupPermissions
        - directPermissions
        - disabledPermissions
        - effectivePermissions
        - operationLogGroupIds
        properties:
          canRenameUsername:
            type: boolean
            description: 当前请求者可否为该账号改名；仅超级管理员且目标不是初始化管理员或系统游客时为true。旧客户端缺省按false处理。
          groupIds:
            type: array
            description: 用户所属角色 ID 列表；后端实现使用 Django Group
            items:
              type: integer
          isActive:
            type: boolean
            description: 用户账号是否启用
          groupPermissions:
            type: array
            description: 用户通过所属角色继承的平台功能权限列表
            items:
              type: string
          directPermissions:
            type: array
            description: 单独授予该用户的平台功能权限列表，不包含用户组继承权限
            items:
              type: string
          disabledPermissions:
            type: array
            description: 单独关闭该用户已授予的平台功能权限列表，可用于关闭角色继承权限或单独授予权限
            items:
              type: string
          effectivePermissions:
            type: array
            description: 角色权限与用户直授权限合并后，扣除用户单独关闭权限的实际生效功能权限列表
            items:
              type: string
          operationLogGroupIds:
            type: array
            description: 该用户具备 `core.view_group_operation_logs` 时允许查看日志的目标用户组 ID 列表
            items:
              type: integer
    UserCreateRequest:
      type: object
      required:
      - username
      - groupIds
      properties:
        username:
          type: string
          description: 登录用户名
        displayName:
          type: string
          description: 显示名称
        email:
          description: 超级管理员创建时可省略或留空，普通管理员必填；非空邮箱统一转为小写并保证唯一。
          anyOf:
          - type: string
            format: email
          - type: string
            const: ''
        department:
          type: string
          description: 用户所在部门
        groupIds:
          type: array
          minItems: 1
          description: 初始所属用户组 ID 列表，必填且至少包含一个非超级管理员用户组
          items:
            type: integer
        isActive:
          type: boolean
          description: 是否启用账号，默认 true
        projectIds:
          type: array
          description: 仅超级管理员可提交的启用私有项目ID；公开项目由allowPublicProject单独控制。省略时不分配私有项目，重复ID去重。
          items:
            type: integer
            minimum: 1
        allowPublicProject:
          type: boolean
          default: true
          description: 仅超级管理员可提交，是否允许访问公开项目；关闭时须至少分配一个启用私有项目。普通管理员不得提交，即使为默认值。
    AdminProfileAvatarUploadRequest:
      type: object
      required:
      - avatar
      properties:
        avatar:
          type: string
          format: binary
          description: JPG 或 PNG 头像文件，最大 2MB
    UserCreateResponse:
      allOf:
      - $ref: '#/components/schemas/UserInfo'
      - type: object
        properties:
          generatedPassword:
            type: string
            description: 自动生成的初始密码，仅在创建时返回一次
    UserPasswordResetResponse:
      allOf:
      - $ref: '#/components/schemas/UserInfo'
      - type: object
        required:
        - generatedPassword
        properties:
          generatedPassword:
            type: string
            description: 重置后自动生成的新密码，仅在重置时返回一次
    UserListResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          description: 用户列表
          items:
            $ref: '#/components/schemas/UserInfo'
    UserGroupUpdateRequest:
      type: object
      required:
      - groupIds
      properties:
        groupIds:
          type: array
          minItems: 1
          description: 用户新的用户组 ID 列表，普通用户至少保留一个用户组
          items:
            type: integer
    UserPermissionUpdateRequest:
      type: object
      required:
      - directPermissions
      properties:
        directPermissions:
          type: array
          description: 单独授予该用户的平台功能权限列表，必须全部来自 availablePermissions
          items:
            type: string
        disabledPermissions:
          type: array
          description: 单独关闭该用户的平台功能权限列表，必须全部来自 availablePermissions；后端只保存该用户已授予权限中的关闭项
          items:
            type: string
        operationLogGroupIds:
          type: array
          description: 该用户具备 `core.view_group_operation_logs` 时允许查看日志的目标用户组 ID 列表；空数组表示未配置指定用户组
          items:
            type: integer
    UserUpdateRequest:
      type: object
      description: 提交username或isActive至少一项；删除沿用action=delete。改名不重建用户、不改变密码和关联对象。
      minProperties: 1
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 150
          description: 仅超级管理员可提交的新登录名；使用Django用户名校验，规范化后须唯一，系统专用账号及其保留名称不可修改或占用。
        isActive:
          type: boolean
          description: 用户账号是否启用
        action:
          type: string
          enum: [delete]
          description: 删除账号；继续遵守当前登录用户、初始化管理员和游客保护。
    Group:
      type: object
      required:
      - id
      - name
      - userCount
      - permissions
      - isProtected
      - lockedPermissions
      properties:
        id:
          type: integer
          description: 用户组 ID
        name:
          type: string
          description: 用户组名称
        userCount:
          type: integer
          description: 当前属于该用户组的用户数量
        permissions:
          type: array
          description: 用户组授予的平台功能权限列表
          items:
            type: string
        isProtected:
          type: boolean
          description: 是否为系统受保护用户组，受保护组不能删除或重命名。初始化内置组包含超级管理员、平台管理员、科研用户、普通用户和游客；除超级管理员外，其他内置组权限允许编辑
        lockedPermissions:
          type: array
          description: 受保护用户组中不可关闭的平台功能权限列表。当前仅超级管理员返回锁定权限，平台管理员、科研用户、普通用户和游客返回空列表
          items:
            type: string
    GroupListResponse:
      type: object
      required:
      - items
      - availablePermissions
      properties:
        items:
          type: array
          description: 用户组列表
          items:
            $ref: '#/components/schemas/Group'
        availablePermissions:
          type: array
          description: 可配置的平台功能权限元数据
          items:
            $ref: '#/components/schemas/AdminPermissionItem'
    GroupCreateRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          description: 新用户组名称
        permissions:
          type: array
          description: 新用户组授予的平台功能权限列表
          items:
            type: string
    GroupUpdateRequest:
      type: object
      properties:
        name:
          type: string
          description: 更新后的用户组名称
        permissions:
          type: array
          description: 更新后的平台功能权限列表
          items:
            type: string
    AdminRasterSettings:
      type: object
      required:
      - symbolizerTimeoutSeconds
      properties:
        symbolizerTimeoutSeconds:
          type: integer
          description: 栅格符号化后端任务超时时间，单位秒
    AdminRasterSettingsUpdate:
      type: object
      properties:
        symbolizerTimeoutSeconds:
          type: integer
          minimum: 10
          maximum: 600
          description: 栅格符号化后端任务超时时间，单位秒
    AdminSettingsResponse:
      type: object
      required:
      - systemName
      - allowRegistration
      - map
      - limits
      - raster
      - editable
      properties:
        systemName:
          type: string
          description: 系统显示名称；已知历史平台名称会以当前确认的全球平台名称返回
        allowRegistration:
          type: boolean
          description: 是否开放自助注册
        map:
          $ref: '#/components/schemas/MapConfig'
        limits:
          $ref: '#/components/schemas/SystemLimits'
        raster:
          $ref: '#/components/schemas/AdminRasterSettings'
        editable:
          type: boolean
          description: 当前用户是否可修改这些用户可配置设置
    AdminSettingsUpdateRequest:
      type: object
      properties:
        systemName:
          type: string
          description: 更新后的系统显示名称；提交已知历史平台名称时会规范化并持久化为当前确认的全球平台名称
        allowRegistration:
          type: boolean
          description: 是否开放自助注册
        map:
          $ref: '#/components/schemas/MapConfig'
        limits:
          $ref: '#/components/schemas/AdminSystemLimitsUpdate'
        raster:
          $ref: '#/components/schemas/AdminRasterSettingsUpdate'
    BackupPlanType:
      type: string
      enum:
      - platform
      - research
      description: 备份内容类型；platform 表示平台业务数据，research 表示科研数据。
    BackupTargetType:
      type: string
      enum:
      - local
      - object_storage
      description: 备份目标类型；local 为本地目录，object_storage 为云端对象存储。
    BackupProviderType:
      type: string
      enum:
      - s3_compatible
      description: 云端对象存储提供方类型。当前实现支持 S3 兼容协议，后续可扩展具体云厂商适配。
    BackupRunStatus:
      type: string
      enum:
      - queued
      - running
      - success
      - failed
      description: 备份任务状态。
    BackupTriggerType:
      type: string
      enum:
      - manual
      - scheduled
      description: 备份触发方式；manual 为超级管理员手动触发，scheduled 为后端计划任务触发。
    AdminBackupPlanSettings:
      type: object
      required:
      - enabled
      - dailyAt
      - target
      - retentionCount
      - includeLogs
      properties:
        enabled:
          type: boolean
          description: 是否启用该类数据的自动备份计划。
        dailyAt:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          description: 每日自动备份时间，格式为 HH:mm，按服务器时区执行。
          example: 02:00
        target:
          $ref: '#/components/schemas/BackupTargetType'
        retentionCount:
          type: integer
          minimum: 1
          maximum: 365
          description: 该计划在同一目标保留的成功备份数量。
        includeLogs:
          type: boolean
          description: 是否包含业务数据根目录 logs/ 下运行日志；仅平台数据备份生效，科研数据备份固定为 false。
    AdminBackupPlans:
      type: object
      required:
      - platform
      - research
      properties:
        platform:
          $ref: '#/components/schemas/AdminBackupPlanSettings'
        research:
          $ref: '#/components/schemas/AdminBackupPlanSettings'
    AdminBackupLocalTargetSettings:
      type: object
      required:
      - directory
      - configured
      properties:
        directory:
          type: string
          description: 本地备份目录；为空字符串时使用业务数据根目录下的 backups/local/。本地备份不推荐作为唯一容灾手段。
        configured:
          type: boolean
          description: 本地目标是否具备可用配置。
    AdminBackupObjectStorageSettings:
      type: object
      required:
      - provider
      - endpoint
      - region
      - bucket
      - prefix
      - accessKeyId
      - secretConfigured
      - secretPreview
      - configured
      properties:
        provider:
          $ref: '#/components/schemas/BackupProviderType'
        endpoint:
          type: string
          description: 对象存储访问地址，例如 https://s3.example.com 或 https://oss-cn.example.com。
        region:
          type: string
          description: 对象存储区域，用于 S3 签名。
        bucket:
          type: string
          description: 存储桶名称。
        prefix:
          type: string
          description: 备份对象名前缀，例如 geomanager/prod/。
        accessKeyId:
          type: string
          description: 备份专用访问密钥 ID。
        secretConfigured:
          type: boolean
          description: 是否已配置访问密钥 Secret。
        secretPreview:
          type: string
          description: Secret 脱敏预览；未配置时为空字符串。
        configured:
          type: boolean
          description: 对象存储目标是否具备可用于连接测试和上传的完整配置。
    AdminBackupObjectStorageUpdate:
      type: object
      properties:
        provider:
          $ref: '#/components/schemas/BackupProviderType'
        endpoint:
          type: string
          description: 对象存储访问地址。
        region:
          type: string
          description: 对象存储区域。
        bucket:
          type: string
          description: 存储桶名称。
        prefix:
          type: string
          description: 备份对象名前缀。
        accessKeyId:
          type: string
          description: 访问密钥 ID。
        secretAccessKey:
          type: string
          description: 访问密钥 Secret；仅用于新增或更换密钥，接口响应永不返回明文。
        clearSecret:
          type: boolean
          description: 是否清空已保存 Secret。
    AdminBackupSettingsResponse:
      type: object
      required:
      - plans
      - local
      - objectStorage
      - updatedAt
      properties:
        plans:
          $ref: '#/components/schemas/AdminBackupPlans'
        local:
          $ref: '#/components/schemas/AdminBackupLocalTargetSettings'
        objectStorage:
          $ref: '#/components/schemas/AdminBackupObjectStorageSettings'
        updatedAt:
          type: string
          format: date-time
          description: 配置序列化时间。
    AdminBackupSettingsUpdateRequest:
      type: object
      properties:
        plans:
          $ref: '#/components/schemas/AdminBackupPlans'
        local:
          type: object
          properties:
            directory:
              type: string
              description: 本地备份目录；为空字符串时使用默认目录。
        objectStorage:
          $ref: '#/components/schemas/AdminBackupObjectStorageUpdate'
    AdminBackupTargetTestRequest:
      type: object
      required:
      - targetType
      properties:
        targetType:
          $ref: '#/components/schemas/BackupTargetType'
        local:
          type: object
          properties:
            directory:
              type: string
              description: 可选临时本地目录；为空时使用已保存配置或默认目录。
        objectStorage:
          $ref: '#/components/schemas/AdminBackupObjectStorageUpdate'
    AdminBackupTargetTestResponse:
      type: object
      required:
      - targetType
      - status
      - message
      - testedAt
      properties:
        targetType:
          $ref: '#/components/schemas/BackupTargetType'
        status:
          type: string
          enum:
          - success
          - failed
          description: 测试结果。
        message:
          type: string
          description: 面向管理员的连接测试结果说明。
        testedAt:
          type: string
          format: date-time
          description: 测试完成时间。
    AdminBackupScopeSummary:
      type: object
      required:
      - planType
      - label
      - source
      - available
      - fileCount
      - sizeBytes
      properties:
        planType:
          $ref: '#/components/schemas/BackupPlanType'
        label:
          type: string
          description: 备份范围中文名称。
        source:
          type: string
          description: 数据来源摘要，不暴露服务器绝对路径。
        available:
          type: boolean
          description: 当前数据根目录是否可读取。
        fileCount:
          type: integer
          minimum: 0
          description: 当前范围内可备份文件数量估算。
        sizeBytes:
          type: integer
          minimum: 0
          description: 当前范围内可备份文件大小估算。
    AdminBackupRun:
      type: object
      required:
      - id
      - planType
      - targetType
      - trigger
      - status
      - progressPercent
      - messages
      - result
      - error
      - archiveName
      - sizeBytes
      - checksumSha256
      - objectKey
      - localPath
      - createdBy
      - createdAt
      - startedAt
      - finishedAt
      properties:
        id:
          type: integer
          description: 备份任务 ID。
        planType:
          $ref: '#/components/schemas/BackupPlanType'
        targetType:
          $ref: '#/components/schemas/BackupTargetType'
        trigger:
          $ref: '#/components/schemas/BackupTriggerType'
        status:
          $ref: '#/components/schemas/BackupRunStatus'
        progressPercent:
          type: integer
          minimum: 0
          maximum: 100
          description: 备份进度百分比。
        messages:
          type: array
          description: 最近任务消息。
          items:
            type: string
        result:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: 任务成功后的 manifest 摘要；未完成或失败时为 null。
        error:
          type: string
          description: 失败原因；非失败状态为空字符串。
        archiveName:
          type: string
          description: 备份归档文件名。
        sizeBytes:
          type: integer
          minimum: 0
          description: 归档文件大小。
        checksumSha256:
          type: string
          description: 归档文件 SHA256 校验值。
        objectKey:
          type: string
          description: 对象存储路径；本地目标为空字符串。
        localPath:
          type: string
          description: 本地备份路径摘要；对象存储目标为空字符串。
        createdBy:
          type:
          - string
          - 'null'
          description: 手动任务发起人显示名；计划任务为 null。
        createdAt:
