      description: 具备 `core.manage_auth` 和 `core.create_user` 权限的管理员创建用户账号。超级管理员创建时邮箱选填，可用 projectIds 和 allowPublicProject 同时配置可见项目；普通管理员邮箱必填且不得提交项目配置。未配置时默认允许公开项目。创建账号、角色和项目范围原子保存，项目无效或关闭公开却未分配启用私有项目时返回400。必须指定至少一个非超级管理员用户组。密码由后端自动生成并仅在本次响应返回。该接口不受自助注册开关影响；`游客`
        角色只允许系统专用 guest 账号持有，不能分配给新账号；只有超级管理员可以分配平台管理员角色。密码按单向哈希保存，不提供原密码查询。
