            type: object
            description: 进入指定场景前加载完整预设的入口。
            required: [scenario, projectId, projectName, title]
            additionalProperties: false
            properties:
              scenario: {$ref: '#/components/schemas/AgentResearchScenario'}
              projectId: {type: integer, minimum: 1, description: 当前已授权项目}
              projectName: {type: string, description: 当前项目名称}
              title: {type: string, description: 案例标题}
    AgentResearchDemoList:
      type: object
      description: 当前用户授权范围内的体验入口
      properties:
        items:
          type: array
          description: 可进入项目的案例；未就绪条目显示为不可启动
          items:
            type: object
            description: 项目内科研演示入口，不包含内部路径与凭据
            properties:
              scenario: {$ref: '#/components/schemas/AgentResearchScenario'}
              projectId: {type: integer, minimum: 1, description: 已授权项目标签}
              projectName: {type: string, description: 当前项目名称}
              title: {type: string, description: 案例标题}
              prompt: {type: string, description: 启动用自然语言，明确资料性质、预设与成果保存目标}
              sampleNature: {type: string, enum: [synthetic, real_map_with_demonstration_errors, demonstration_case, user_upload], description: synthetic为模拟样例；real_map_with_demonstration_errors为历史时代一致性案例；demonstration_case为按专家规则准备的小范围地质成果检查演示案例；user_upload为用户在任务中上传资料}
              available: {type: boolean, description: 资料、已发布算法与模型等必要服务是否就绪}
              preset:
                type: object
                description: 仅当前请求项目返回的活动预设；按稳定资源编码定位，不包含其他项目的输入标识。缺项表示该角色预设不可用。
                properties:
                  inputs:
                    type: object
