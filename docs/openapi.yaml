          type: integer
          minimum: 1
          default: 1
        description: 当前页码
      - name: pageSize
        in: query
        schema:
          type: integer
          minimum: 1
          default: 20
        description: 每页数量
      - name: operator
        in: query
        schema:
          type: string
        description: 在授权日志范围内按操作用户名或显示名称模糊筛选
      - name: userId
        in: query
        schema:
          type: integer
        description: 在授权日志范围内按操作用户 ID 精确筛选
      - name: module
        in: query
        schema:
          type: string
        description: 按模块名称模糊筛选
      - name: action
        in: query
        schema:
          type: string
        description: 按操作动作模糊筛选
      - name: result
        in: query
        schema:
          type: string
          enum:
          - success
          - warning
          - failed
        description: 按操作结果筛选
      - name: targetType
        in: query
        schema:
          type: string
          enum:
          - data_resource
          - workspace_scene
        description: 按结构化操作目标类型筛选
      - name: targetId
        in: query
        schema:
          type: integer
        description: 按结构化操作目标后台 ID 精确筛选
      - name: keyword
        in: query
        schema:
          type: string
        description: 跨用户、模块、动作、操作目标和摘要的关键词筛选
      - name: startTime
        in: query
        schema:
          type: string
        description: 操作时间起点，支持日期或日期时间字符串
      - name: endTime
        in: query
        schema:
          type: string
        description: 操作时间终点，支持日期或日期时间字符串
      - name: X-Project-Id
        in: header
        required: false
        description: 单个业务项目标签 ID，缺省为公开项目 1。all 汇总已取消，业务接口读写均仅接受一个具体项目，传 all 返回 400。与地图工程 projectId 不同；平台管理接口独立执行管理权限检查。
        schema:
          type: string
      - name: projectTagId
        in: query
        required: false
        description: 与 X-Project-Id 等效，用于图片、瓦片和文件链接；同时提供时两者必须相同，否则返回 400。
        schema:
          type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOperationLogListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
