        updatedAt:
          type: string
          format: date-time
          description: 更新时间
        projectTagId:
          type: integer
          description: 单个业务项目标签 ID，缺省为公开项目 1。all 汇总已取消，业务接口读写均仅接受一个具体项目，传 all 返回 400。与地图工程
            projectId 不同；平台管理接口独立执行管理权限检查。
