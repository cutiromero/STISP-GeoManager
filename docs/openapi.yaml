              name: {type: string, description: 数据资源名称}
              dataType: {type: string, enum: [vector, raster, gene, table, document, image], description: 数据资源类型}
            additionalProperties: false
        canPreview:
          type: boolean
          description: 当前用户是否可以在线预览该成果格式
        canDownload:
          type: boolean
          description: 当前用户是否可以下载成果原文件
        canPublish:
          type: boolean
          description: 当前用户是否可以发布成果或更新其发布范围
        canUnpublish:
          type: boolean
          description: 当前用户是否可以下架当前成果
        canDelete:
          type: boolean
          description: 当前用户是否可以永久删除成果记录和文件
