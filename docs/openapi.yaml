          items:
            type: integer
            minimum: 1
            description: 同项目数据资源标识
        accessGroupIds:
          deprecated: true
          type: array
          minItems: 0
          description: 历史角色元数据，不参与对象可见性判断。访问由当前项目标签、发布状态和功能权限控制；新界面不提供角色可见性配置。
