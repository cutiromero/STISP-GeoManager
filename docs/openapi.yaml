                    additionalProperties: {type: integer, minimum: 1, description: 当前项目的资源标识}
                  parameters: {type: object, description: 已发布场景算法的预设参数, additionalProperties: true}
                required: [inputs, parameters]
                additionalProperties: false
            required: [scenario, projectId, projectName, title, prompt, sampleNature, available]
            additionalProperties: false
      required: [items]
      additionalProperties: false
    AgentAttachment:
