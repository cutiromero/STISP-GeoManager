          type: string
          description: 推荐模板中文名称。
        description:
          type: string
          description: 推荐模板适用场景说明。
        businessType:
          $ref: '#/components/schemas/DataDomainType'
        rendererType:
          type: string
          enum:
          - single
          - uniqueValue
          - graduated
          description: 模板使用的矢量渲染器类型。
        primaryField:
          type:
          - string
          - 'null'
          description: 模板主要命中的字段；未命中任何字段时为 null。
        matchedFields:
          type: array
          description: 本模板命中的字段列表，包含主字段和参与备用说明的字段。
          items:
            type: string
        matchStatus:
          type: string
          enum:
          - matched
          - fallback
          - unavailable
          description: 字段命中状态；matched 表示主字段命中，fallback 表示使用备用字段，unavailable 表示模板仅可作为提示但当前不可直接应用。
        isPrimary:
          type: boolean
          description: 是否为该业务类型的默认首选推荐方案。
        priority:
          type: integer
          description: 推荐排序值，数值越小越靠前。
        symbolization:
          $ref: '#/components/schemas/VectorSymbolization'
        warnings:
          type: array
          description: 字段缺失、别名归一化、类别截断或图标降级等提示。
          items:
            type: string
    VisualizationResourceProfile:
