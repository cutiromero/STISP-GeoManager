          description: 本轮实际检索的领域；none为空
          items:
            $ref: '#/components/schemas/KnowledgeDomain'
        computeIntent:
          description: Persistent computation plan
          anyOf:
          - $ref: '#/components/schemas/AgentComputeIntent'
          - type: 'null'
