      - sampleValues
      - description
      properties:
        name:
          type: string
          description: 字段名
        type:
          type: string
          enum:
          - integer
          - float
          - boolean
          - string
          description: 后端根据当前真实数据推断的字段类型
        nullable:
          type: boolean
          description: 当前结果中是否检测到空值
        sampleValues:
          type: array
          maxItems: 3
          description: 当前结果中最多三个非空样例值
          items:
            $ref: '#/components/schemas/NonGeoScalar'
        description:
          type: string
          description: 后台字段元数据说明；没有说明时为空字符串
    NonGeoTableRow:
