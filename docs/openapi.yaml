          minimum: 0
          maximum: 500
          description: 本次实际返回记录数
        limit:
          type: integer
          minimum: 1
          maximum: 500
          description: 本次使用的分页大小
        offset:
          type: integer
          minimum: 0
          maximum: 10000000
          description: 本次使用的记录偏移量
        fields:
          type: array
          description: 当前结果字段定义
          items:
            $ref: '#/components/schemas/NonGeoTableField'
        rows:
          type: array
          description: 当前页真实记录
          items:
            $ref: '#/components/schemas/NonGeoTableRow'
    NonGeoFieldProfile:
