          $ref: '#/components/schemas/AgentGenerationParameters'
        id:
          type: integer
          description: 运行 ID
        conversationId:
          type: integer
          description: 所属会话
        model:
          type: string
          description: 实际模型别名
        thinkingMode:
          type: string
          description: 思考模式
          enum:
          - fast
          - deep
        thinkingText:
          type: string
          description: 已持久化的模型思考摘要或思考片段；仅在模型真实返回时提供
        thinkingDurationMs:
          type: integer
          description: 深度思考耗时（毫秒）
          minimum: 0
        internetEnabled:
          type: boolean
          description: 本轮是否请求并实际使用受控互联网检索
        status:
          type: string
          description: 任务状态
          enum:
          - queued
          - running
          - waiting_input
          - waiting_review
          - waiting_compute
          - succeeded
          - failed
          - cancelled
          - interrupted
        prompt:
          type: string
          description: 用户问题
        answer:
          type: string
          description: 已生成文字，失败时保留已生成内容
        detail:
          type: string
          description: 可读状态说明
        evidence:
          type: array
          description: 工具证据
          items:
            $ref: '#/components/schemas/AgentEvidence'
        attachments:
          type: array
          description: 本轮使用的用户附件
          items:
            $ref: '#/components/schemas/AgentAttachment'
        createdAt:
          type: string
          description: 创建时间
        updatedAt:
          type: string
          description: 更新时间
        contextTruncated:
          type: boolean
          description: 是否裁剪了历史上下文
