        layer:
          $ref: '#/components/schemas/VectorImportLayerPreview'
        validationIssues:
          type: array
          description: 坐标系、编码和几何质量问题
          items:
            $ref: '#/components/schemas/ValidationIssue'
        duplicateTarget:
          oneOf:
          - $ref: '#/components/schemas/ImportDuplicateTarget'
          - type: 'null'
          description: 同名数据资源；无重复时为 null
    VectorImportCommitRequest:
      allOf:
        - $ref: "#/components/schemas/VectorImportValidateRequest"
        - type: object
          required:
            - domainType
            - duplicateConfirmed
            - accessGroupIds
            - fieldMetadata
          properties:
            domainType:
              $ref: "#/components/schemas/DataDomainType"
            categoryCode:
              type: string
              description: 甲方地理/非地理两类体系中的业务主分类节点编码；V1 新客户端提交，旧客户端兼容期可省略
            duplicateConfirmed:
              type: boolean
              description: 是否已确认创建同名数据资源
            accessGroupIds:
              deprecated: true
              type: array
              description: 历史角色元数据，不参与对象可见性判断。访问由当前项目标签、发布状态和功能权限控制；新界面不提供角色可见性配置。
              items:
                type: integer
            fieldMetadata:
              type: object
              description: 字段名到中文说明的映射
              additionalProperties:
                type: string
    VectorImportCommitResponse:
      type: object
      required:
      - mode
      - resourceId
      - resourceName
      - vectorDatasetId
      - layerId
      - layerName
      - sourceLayerName
      - importedFeatures
      - skippedFeatures
      - bounds
      - geometryType
      - coordinateSystem
      - sourceEncoding
      - validationIssues
      properties:
        mode:
          type: string
          enum:
          - vector
          description: 矢量文件导入模式
        resourceId:
          type: integer
          description: 创建的数据资源 ID
        resourceName:
          type: string
          description: 创建的数据资源显示名称
        vectorDatasetId:
          type: integer
          description: 创建的 VectorDataset 技术元数据记录 ID
        layerId:
          type: integer
          description: 创建的 MapLayer ID
        layerName:
          type: string
          description: 写入统一 GeoPackage 的唯一图层名
        sourceLayerName:
          type: string
          description: 源文件中的图层名称
        importedFeatures:
          type: integer
          description: 成功写入的有效要素数量
        skippedFeatures:
          type: integer
          description: 因空、null 或无效几何被跳过的要素数量
        bounds:
          type: array
          description: EPSG:4326 边界 [minLng, minLat, maxLng, maxLat]
          items:
            type: number
        geometryType:
          type: string
          description: 标准化后的几何类型
        coordinateSystem:
          type: string
          description: 标准化存储坐标系，固定为 EPSG:4326
        sourceEncoding:
          type:
          - string
          - 'null'
          description: 源 Shapefile DBF 编码；其他格式可能为 null
        validationIssues:
          type: array
          description: 导入时确认或处理的质量问题
          items:
            $ref: '#/components/schemas/ValidationIssue'
    ImportErrorResponse:
      type: object
      required:
      - detail
      properties:
        detail:
          type: string
          description: 导入失败说明
        issues:
          type: array
          description: 导入校验问题
          items:
            $ref: '#/components/schemas/ValidationIssue'
    ValidationIssue:
      type: object
      required:
      - code
      - message
      - blocking
      properties:
        code:
          type: string
          description: 问题代码
        message:
          type: string
          description: 问题说明
        blocking:
          type: boolean
          description: 是否阻断导入
        count:
          type: integer
          description: 受影响行数
        minMeters:
          type: number
          description: 坐标不确定性最小误差，单位米
        maxMeters:
          type: number
          description: 坐标不确定性最大误差，单位米
        ratio:
          type: number
          description: 坐标不确定性误差倍率
        targetType:
          type: string
          enum:
          - data_resource_name
          description: 重复目标类型，仅 duplicate_target 问题返回
        targetName:
          type: string
          description: 重复的前端显示数据名称，仅 duplicate_target 问题返回
    ResultColorClassAdvice:
      type: object
      description: 成果中一个实际类别最终采用的颜色、来源及替换原因；只有新配色流程生成逐类记录。
      required: [value, color, source, replacementReasons, remainingIssues]
      properties:
        value:
          type: string
          description: 实际分类字段取值，字符串化后保存。
        color:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
          description: 最终符号化使用的颜色。
        source:
          type: string
          enum: [library_selected, model_suggestion, system_palette]
          description: 分别为选用色表库颜色、模型自行建议、确定性调色板补色；离线命中色表也记为library_selected。
        libraryId:
          type: [string, 'null']
          description: 选用的色表条目编号，未选用时为null。
        referenceSource:
          type: [string, 'null']
          description: 色表条目注明的来源，未选用时为null。
        referenceColor:
          type: [string, 'null']
          description: 条目保留的原始参考色，可能不同于经可读性校正的展示色。
        libraryAdjustmentReasons:
          type: array
          description: 色表展示色相对原始参考色的预先校正原因。
          items:
            type: string
            description: 格式、背景或边框对比、重复或Lab色差问题代号。
        replacementReasons:
          type: array
          description: 本次模型建议的校验问题、补色原因或model_unavailable；修正成功仍保留初次问题。
          items:
            type: string
            description: 具体替换或修正原因代号。
        remainingIssues:
          type: array
          description: 最终颜色仍未满足的约束；类别过多导致确定性调色板色差不足时显式记录，不阻塞登记。
          items:
            type: string
            description: 最终校验问题代号。
    ResultColorAdvice:
      type: object
      description: 逻辑成果配色审计；仅资源详情返回，旧资源可能只有整体来源而没有逐类记录。权限与资源详情一致。
      additionalProperties: true
      properties:
        version:
          type: integer
          description: 配色流程版本，当前为2，不是平台版本。
        classes:
          type: array
          description: 实际类别的最终配色审计，与同一资源symbolization.renderer.classes对应。
          items:
            $ref: '#/components/schemas/ResultColorClassAdvice'
        attempts:
          type: array
          description: 最多两次模型建议与校验问题，建议内requestBudget记录实际输入tokens、字节数、窗口及压缩级别。
          items:
            type: object
            description: 一次模型建议与逐类别校验结果。
            additionalProperties: true
    ResourceProfileResponse:
      type: object
      required:
      - resource
      - fields
      - featureCount
      - geometryType
      - bounds
      properties:
        defaultVisualization:
          type: object
          description: 资源默认可视化方案，来自default_visualization；仅详情返回，未配置时为空对象。矢量uniqueValue分类使用field、classes的value/label/color及defaultClass。
          properties:
