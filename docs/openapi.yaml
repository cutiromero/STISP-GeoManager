          $ref: "#/components/schemas/WorkspaceSceneOwner"
        accessGroups:
          type: array
          description: 历史角色元数据，不参与对象可见性判断。访问由当前项目标签、发布状态和功能权限控制；新界面不提供角色可见性配置。
          items:
            $ref: "#/components/schemas/AdminDataResourceAccessGroup"
          deprecated: true
        relatedResources:
          type: array
          description: 当前用户仍可读的同项目关联数据；撤权、停用或owner_only不可见资源不返回
