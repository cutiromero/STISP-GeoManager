    ResourceListItem:
      $ref: '#/components/schemas/DataResource'
    MapLayer:
      type: object
      required:
      - id
      - name
      - code
      - layerType
      - geometryType
      - category
      - dataResourceId
      - sortOrder
      - defaultVisible
      - defaultOpacity
      - symbolization
      - bounds
      - legend
      - rasterRules
      - isActive
      - updatedAt
      properties:
        id:
          type: integer
          description: 图层 ID
        name:
          type: string
          description: 图层名称
        code:
          type: string
          description: 图层编码
        layerType:
          type: string
          enum:
          - vector
          - raster
          description: 图层类型
        geometryType:
          type: string
          enum:
          - point
          - line
          - polygon
          - mixed
          description: 几何类型
        category:
          oneOf:
          - $ref: '#/components/schemas/DictionaryItem'
          - type: 'null'
          description: 图层分类，未分类时为 null
        dataResourceId:
          type:
          - integer
          - 'null'
          description: 关联数据资源 ID
        sortOrder:
          type: integer
          description: 排序值
        defaultVisible:
          type: boolean
          description: 是否默认显示
        defaultOpacity:
          type: integer
          minimum: 0
          maximum: 100
          description: 默认透明度百分比
        symbolization:
          $ref: '#/components/schemas/VectorSymbolization'
        bounds:
          type: array
          description: 图层边界
          items:
            type: number
        legend:
          type: string
          description: 图例说明
        rasterRules:
          $ref: '#/components/schemas/RasterSymbolizationRules'
        isActive:
          type: boolean
          description: 是否启用
        updatedAt:
          type: string
          format: date-time
          description: 最后更新时间
        projectTagId:
          type: integer
          description: 单个业务项目标签 ID，缺省为公开项目 1。all 汇总已取消，业务接口读写均仅接受一个具体项目，传 all 返回 400。与地图工程 projectId 不同；平台管理接口独立执行管理权限检查。
    VectorSymbolization:
      type: object
      additionalProperties: true
      description: '矢量图层符号化配置。平台继续兼容历史松散字段；新版本推荐使用 `renderer` 描述单一符号、唯一值分类和业务默认模板，前端根据该结构生成 Mapbox GL JS 表达式并在渲染前注册
        `gm-*` 平台内置图标。

        '
      properties:
        opacity:
          type: integer
          minimum: 0
          maximum: 100
          description: 图层透明度百分比
        pointMode:
          type: string
          enum:
          - circle
          - symbol
          - heatmap
          description: 点图层基础表达方式；唯一值分类点模板通常使用 symbol
        renderer:
          $ref: '#/components/schemas/VectorRenderer'
        circle:
          type: object
          additionalProperties: true
          description: 圆点图层基础样式，字段驱动渲染未覆盖的属性继续使用这里的值
        symbol:
          type: object
          additionalProperties: true
          description: 图标和标注图层基础样式；平台内置图标使用 `gm-*` 英文 ID
        heatmap:
          type: object
          additionalProperties: true
          description: 热力图样式和权重字段
        cluster:
          type: object
          additionalProperties: true
          description: Mapbox source 聚合配置
        line:
          type: object
          additionalProperties: true
          description: 线图层基础样式
        fill:
          type: object
          additionalProperties: true
          description: 面图层基础样式
    VectorRenderer:
      oneOf:
      - $ref: '#/components/schemas/SingleSymbolRenderer'
      - $ref: '#/components/schemas/UniqueValueRenderer'
      - $ref: '#/components/schemas/GraduatedRenderer'
      description: 矢量符号化渲染器；未提供时按单一符号处理
    SingleSymbolRenderer:
      type: object
      required:
      - type
      additionalProperties: true
      properties:
        type:
          type: string
          enum:
          - single
          description: 单一符号渲染
        templateId:
          type: string
          description: 来源模板 ID；空字符串表示未套用业务模板
        businessType:
          type: string
          description: 业务类型编码，如 germplasm；用于提示默认模板来源
        updatedByUser:
          type: boolean
          description: 用户是否已手动修改该符号化方案；为 true 时不应被默认模板自动覆盖
    UniqueValueRenderer:
      type: object
      required:
      - type
      - field
      - classes
      - defaultClass
      additionalProperties: true
      properties:
        type:
          type: string
          enum:
          - uniqueValue
          description: 按字段唯一值分类符号化
        field:
          type: string
          description: 分类字段名，例如种质数据中的 `性别`
        templateId:
          type: string
          description: 默认业务模板 ID，例如 `germplasm.dna-sex-tree.v1`
        businessType:
          type: string
          description: 业务类型编码，例如 `germplasm`
        updatedByUser:
          type: boolean
          description: 用户是否已手动修改该分类符号化方案
        classes:
          type: array
          description: 分类符号列表；一个类别可包含多个原始字段值，用于别名归一化和分类值合并
          items:
            $ref: '#/components/schemas/UniqueValueSymbolClass'
        defaultClass:
          $ref: '#/components/schemas/UniqueValueSymbolClass'
        normalizationNotes:
          type: array
          description: 分类值合并或疑似别名提示，供前端展示给用户确认
          items:
            type: string
    GraduatedRenderer:
      type: object
      required:
      - type
      - field
      - method
      - classCount
      - precision
      - colorRamp
      - classes
      - defaultClass
      additionalProperties: true
      description: '按连续数值字段进行分级符号化，适用于海拔、NDVI、盐分等可转为数字的字段。 前端依据当前加载要素统计分级断点并生成 Mapbox GL JS case 表达式；服务端按 JSON 对象透传保存，不新增独立接口。

        '
      properties:
        type:
          type: string
          enum:
          - graduated
          description: 数值分级渲染
        field:
          type: string
          description: 连续数值字段名，例如 `海拔`、`NDVI` 或 `盐分`
        method:
          type: string
          enum:
          - equalInterval
          - quantile
          - manual
          description: 分级方法；equalInterval 为等距分级，quantile 为分位数分级，manual 为用户自定义区间
        classCount:
          type: integer
          minimum: 1
          maximum: 24
          description: 分级数量；equalInterval/quantile 自动分级建议 3 到 9 级，manual 自定义分级允许 1 到 24 级
        precision:
          type: integer
          minimum: 0
          maximum: 6
          description: 图例区间标签保留的小数位
        colorRamp:
          type: string
          enum:
          - green
          - blue
          - orange
          - purple
          description: 平台内置连续色带编码
        templateId:
          type: string
          description: 来源推荐模板 ID；空字符串表示未套用业务模板
        businessType:
          type: string
          description: 业务类型编码，例如 population、community 或 field_survey
        updatedByUser:
          type: boolean
          description: 用户是否已手动修改该数值分级方案
        classes:
          type: array
          description: 数值区间符号列表；最后一个区间包含最大值，其他区间为左闭右开。manual 方法下由用户直接维护每个区间的 min/max、颜色、图标、大小和显隐
          items:
            $ref: '#/components/schemas/GraduatedSymbolClass'
        defaultClass:
          $ref: '#/components/schemas/GraduatedSymbolClass'
    GraduatedSymbolClass:
      type: object
      required:
      - id
      - label
      - min
      - max
      - color
      - iconImage
      - visible
      additionalProperties: true
      properties:
        id:
          type: string
          description: 区间类别稳定 ID，前端可用于编辑列表 key
        label:
          type: string
          description: 图例显示名称，通常由区间端点自动生成
        min:
          type:
          - number
          - 'null'
          description: 区间最小值；默认类使用 null 表示无数值或空值
        max:
          type:
          - number
          - 'null'
          description: 区间最大值；默认类使用 null 表示无数值或空值
        color:
          type: string
          pattern: ^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$
          description: 区间颜色；平台内置图标会按图标 ID 与颜色生成运行时图片 ID
        iconImage:
          type: string
          description: 图标 ID。平台内置图标必须使用 `gm-*` 英文 ID，并在 Mapbox 图层引用前通过 `addImage` 注册
        size:
          type: number
          minimum: 0
          description: 区间图标缩放或点半径倍率
        count:
          type: integer
          minimum: 0
          description: 当前加载数据中落入该区间的要素数量；服务端持久化时可省略或置 0
        visible:
          type: boolean
          description: 该区间是否在地图和图例中显示
    UniqueValueSymbolClass:
      type: object
      required:
      - id
      - label
      - values
      - color
      - iconImage
      - visible
      additionalProperties: true
      properties:
        id:
          type: string
          description: 类别稳定 ID，前端可用于编辑列表 key
        label:
          type: string
          description: 图例显示名称
        values:
          type: array
          description: 归入该类别的原始字段值；空数组仅用于默认类
          items:
            type: string
        color:
          type: string
          pattern: ^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$
          description: 类别颜色；平台内置图标会按图标 ID 与颜色生成运行时图片 ID
        iconImage:
          type: string
          description: 图标 ID。平台内置图标必须使用 `gm-*` 英文 ID，并在 Mapbox 图层引用前通过 `addImage` 注册
        size:
          type: number
          minimum: 0
          description: 类别图标缩放或点半径倍率
        count:
          type: integer
          minimum: 0
          description: 当前加载数据中归入该类别的要素数量；服务端持久化时可省略或置 0
        visible:
          type: boolean
          description: 该类别是否在地图和图例中显示
    RasterDataset:
      type: object
      required:
      - id
      - name
      - code
      - status
      - sourcePath
      - processedPath
      - sourceMetadataPath
      - processedMetadataPath
      - dataResourceId
      - mapLayerId
      - bandCount
      - bounds3857
      - bounds4326
      - imageCoordinates
      - defaultRules
      - sourceFileSize
      - processedFileSize
      - progressLog
      - errorMessage
      - importedAt
      - processedAt
      - metadata
      - sourceFileName
      - sourceFormat
      - sourceManifest
      - sourceChecksumSha256
      - rasterKind
      properties:
        id:
          type: integer
          description: 栅格数据集 ID
        name:
          type: string
          description: 数据集名称
        code:
          type: string
          description: 数据集编码
        status:
          type: string
          enum:
          - pending
          - processing
          - ready
          - failed
          description: 预处理状态
        sourcePath:
          type: string
          description: 原始栅格相对路径
        processedPath:
          type: string
          description: 预处理 COG 相对路径
        sourceMetadataPath:
          type: string
          description: 原始文件元数据相对路径
        processedMetadataPath:
          type: string
          description: 预处理文件元数据相对路径
        dataResourceId:
          type:
          - integer
          - 'null'
          description: 关联数据资源 ID
        mapLayerId:
          type:
          - integer
          - 'null'
          description: 关联地图图层 ID
        bandCount:
          type: integer
          description: 波段数量
        bounds3857:
          type: array
          description: EPSG:3857 边界
          items:
            type: number
        bounds4326:
          type: array
          description: WGS84 边界
          items:
            type: number
        imageCoordinates:
          type: array
          description: WGS84 图像角点坐标
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: number
        defaultRules:
          $ref: '#/components/schemas/RasterSymbolizationRules'
        sourceFileSize:
          type: integer
          description: 原始文件大小，单位字节
        processedFileSize:
          type: integer
          description: 预处理文件大小，单位字节
        progressLog:
          type: string
          description: 导入或预处理日志
        errorMessage:
          type: string
          description: 失败原因
        importedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 导入完成时间
        processedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 预处理完成时间
        metadata:
          $ref: '#/components/schemas/RasterMetadata'
        sourceFileName:
          type: string
          description: 用户上传或目录扫描时的主栅格原始文件名
        sourceFormat:
          type: string
          description: GDAL 识别到的源格式或驱动简称
        sourceManifest:
          type: array
          description: 原始栅格数据包内的文件清单
          items:
            $ref: '#/components/schemas/RasterSourceAsset'
        sourceChecksumSha256:
          type: string
          description: 主栅格文件 SHA256；未计算时为空字符串
        rasterKind:
          type: string
          enum:
          - imagery
          - continuous
          - categorical
          description: 栅格数据语义，用于选择默认重采样和符号化策略
    RasterMetadata:
      type: object
      required:
      - size
      - driver
      - coordinateSystem
      - bands
      properties:
        size:
          type: array
          description: 栅格像素尺寸 [width, height]
          items:
            type: integer
        driver:
          type: string
          description: GDAL 驱动简称
        coordinateSystem:
          oneOf:
          - type: string
          - type: integer
          description: 坐标系统 EPSG 或描述文本
        bands:
          type: array
          description: 波段元数据
          items:
            $ref: '#/components/schemas/RasterBandInfo'
    RasterBandInfo:
      type: object
      required:
      - band
      - type
      - description
      - colorInterpretation
      - min
      - max
      - isInteger
      properties:
        band:
          type: integer
          description: 1-based 波段编号
        type:
          type: string
          description: GDAL 波段类型
        description:
          type: string
          description: 波段描述
        colorInterpretation:
          type: string
          description: 颜色解释
        min:
          type: number
          description: 波段最小值
        max:
          type: number
          description: 波段最大值
        isInteger:
          type: boolean
          description: 是否为整型波段
    RasterSymbolizationRules:
      type: object
      additionalProperties: true
      description: 栅格符号化规则对象，具体结构由后端符号化规则引擎校验
    AsyncJobResponse:
      type: object
      required:
      - id
      - kind
      - status
      - stage
      - progressPercent
      - messages
      - result
      - error
      - startedAt
      - finishedAt
      properties:
        id:
          type: string
          description: 异步任务 ID
        kind:
          type: string
          enum:
          - import
          - scan
          - render
          - export
          description: 任务类型
        status:
          type: string
          enum:
          - queued
          - running
          - ready
          - failed
          description: 任务状态
        stage:
          type: string
          description: 当前处理阶段，例如 queued、validating、preprocessing、publishing、ready 或 failed
        progressPercent:
          type: integer
          minimum: 0
          maximum: 100
          description: 任务进度百分比
        messages:
          type: array
          description: 任务进度消息
          items:
            type: string
        result:
          oneOf:
          - $ref: '#/components/schemas/RasterRenderResult'
          - $ref: '#/components/schemas/RasterDataset'
          - $ref: '#/components/schemas/RasterDatasetScanResult'
          - $ref: '#/components/schemas/ExportJobResult'
          - $ref: '#/components/schemas/RasterJobInputReferences'
          - type: 'null'
          description: 完成任务的结果；渲染和导出任务在排队或处理中保存精简输入引用，失败时可以保留引用，其他任务未完成时可为 null
        error:
          type: string
          description: 失败原因
        startedAt:
          type: number
          format: double
          description: 任务创建时间戳
        finishedAt:
          type:
          - number
          - 'null'
          format: double
          description: 任务结束时间戳
    RasterJobInputReferences:
      type: object
      required:
      - inputRefs
      properties:
        inputRefs:
          type: array
          description: 用于保护正在使用的数据；只保存标识，不保存几何或栅格内容
          items:
            type: object
            properties:
              resourceId:
                type: integer
                minimum: 1
              layerId:
                type: integer
                minimum: 1
              datasetId:
                type: integer
                minimum: 1
    RasterDatasetScanResult:
      type: object
      required:
      - items
      - count
      properties:
        items:
          type: array
          description: 扫描或导入得到的栅格数据集
          items:
            $ref: '#/components/schemas/RasterDataset'
        count:
          type: integer
          description: 数据集数量
    ExportJobResult:
      type: object
      required:
      - filename
      - downloadUrl
      properties:
        filename:
          type: string
          description: 导出文件名
        downloadUrl:
          type: string
          description: 导出文件下载路径
    DirectoryTreeResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          description: 数据目录列表
          items:
            $ref: '#/components/schemas/Directory'
    Directory:
      type: object
      required:
      - id
      - name
      - code
      - parentId
      - description
      - sortOrder
      - resources
      properties:
        id:
          type: integer
          description: 目录 ID
        name:
          type: string
          description: 目录名称
        code:
          type: string
          description: 目录编码
        parentId:
          type:
          - integer
          - 'null'
          description: 父目录 ID
        description:
          type: string
          description: 目录描述
        sortOrder:
          type: integer
          description: 排序值
        resources:
          type: array
          description: 目录下的数据资源
          items:
            $ref: '#/components/schemas/DataResource'
    ResourceListResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          description: 数据资源列表
          items:
            $ref: '#/components/schemas/DataResource'
    ScanResponse:
      type: object
      required:
      - items
      - count
      properties:
        items:
          type: array
          description: 本次扫描发现或同步的资源
          items:
            $ref: '#/components/schemas/DataResource'
        count:
          type: integer
          description: 资源数量
    ImportPreviewResponse:
      type: object
      required:
      - columns
      - rows
      - rowCount
      - suggestedTableName
      - suggestedName
      - activeSheetName
      - sheets
      - duplicateTarget
      - detected
      - limitations
      properties:
        columns:
          type: array
          description: 表格列名
          items:
            type: string
        rows:
          type: array
          description: 前若干行预览数据，键为列名，值为文本
          items:
            type: object
            additionalProperties:
              type: string
        rowCount:
          type: integer
          description: 总行数
        suggestedTableName:
          type: string
          description: 建议后台存储标识；每次预检生成不同值，提交后可能因后端冲突保护再次改写
        suggestedName:
          type: string
          description: 建议数据名称
        activeSheetName:
          type:
          - string
          - 'null'
          description: 当前读取的 Excel 工作表名称；CSV 为 null
        sheets:
          type: array
          description: Excel 工作表拆分清单；CSV 为空数组
          items:
            $ref: '#/components/schemas/ImportWorkbookSheet'
        duplicateTarget:
          oneOf:
          - $ref: '#/components/schemas/ImportDuplicateTarget'
          - type: 'null'
          description: 按建议数据名称检测到的同名数据资源；无重复时为 null
        detected:
          $ref: '#/components/schemas/ImportDetectedInfo'
        limitations:
          type: array
          description: 导入限制提示
          items:
            type: string
    ImportWorkbookSheet:
      type: object
      required:
      - name
      - rowCount
      - columnCount
      - isGeographic
      - longitudeColumn
      - latitudeColumn
      properties:
        name:
          type: string
          description: 工作表名称
        rowCount:
          type: integer
          description: 工作表总行数
        columnCount:
          type: integer
          description: 工作表字段数
        isGeographic:
          type: boolean
          description: 是否自动识别到可空间化经纬度列
        longitudeColumn:
          type:
          - string
          - 'null'
          description: 自动识别的经度列
        latitudeColumn:
          type:
          - string
          - 'null'
          description: 自动识别的纬度列
    ImportDetectedInfo:
      type: object
      required:
      - isGeographic
      - longitudeColumn
      - latitudeColumn
      - coordinateStats
      - validationIssues
      properties:
        isGeographic:
          type: boolean
          description: 是否自动识别为地理表
        longitudeColumn:
          type:
          - string
          - 'null'
          description: 自动识别的经度列
        latitudeColumn:
          type:
          - string
          - 'null'
          description: 自动识别的纬度列
        coordinateStats:
          oneOf:
          - $ref: '#/components/schemas/CoordinateStats'
          - type: 'null'
          description: 坐标统计，预览阶段为 null
        validationIssues:
          type: array
          description: 坐标校验问题，预览阶段为空数组
          items:
            $ref: '#/components/schemas/ValidationIssue'
    ImportValidateResponse:
      type: object
      required:
      - coordinateStats
      - validationIssues
      - duplicateTarget
      properties:
        coordinateStats:
          oneOf:
          - $ref: '#/components/schemas/CoordinateStats'
          - type: 'null'
          description: 坐标统计；非地理导入时为 null
        validationIssues:
          type: array
          description: 坐标校验问题
          items:
            $ref: '#/components/schemas/ValidationIssue'
        duplicateTarget:
          oneOf:
          - $ref: '#/components/schemas/ImportDuplicateTarget'
          - type: 'null'
          description: 按当前前端显示数据名称检测到的同名数据资源；无重复时为 null
    ImportDuplicateTarget:
      type: object
      required:
      - targetType
      - targetName
      - message
      properties:
        targetType:
          type: string
          enum:
          - data_resource_name
          description: 重复目标类型；data_resource_name 表示前端显示的数据名称已存在
        targetName:
          type: string
          description: 重复的前端显示数据名称
        message:
          type: string
          description: 用户可读提示
    CoordinateStats:
      type: object
      required:
      - totalRows
      - validRows
      - missingRows
      - quantizationErrorMeters
      properties:
        totalRows:
          type: integer
          description: 总行数
        validRows:
          type: integer
          description: 坐标有效行数
        missingRows:
          type: integer
          description: 缺少或无效坐标行数
        quantizationErrorMeters:
          type: object
          required:
          - min
          - max
          description: 坐标文本小数位引入的位置误差范围，单位米
          properties:
            min:
              type:
              - number
              - 'null'
              description: 最小估算误差
            max:
              type:
              - number
              - 'null'
              description: 最大估算误差
    ImportCommitResponse:
      oneOf:
      - $ref: '#/components/schemas/GeographicImportCommitResponse'
      - $ref: '#/components/schemas/TableImportCommitResponse'
    GeographicImportCommitResponse:
      type: object
      required:
      - mode
      - resourceId
      - resourceName
      - layerName
      - tableName
      - importedRows
      - skippedRows
      - bounds
      - coordinateStats
      - validationIssues
      properties:
        mode:
          type: string
          enum:
          - geographic
          description: 地理表导入模式
        resourceId:
          type: integer
          description: 创建的数据资源 ID
        resourceName:
          type: string
          description: 创建的数据资源名称
        layerName:
          type: string
          description: 写入 GeoPackage 的唯一图层名
        tableName:
          type: string
          description: 写入 GeoPackage 的唯一图层名，与 layerName 相同
        importedRows:
          type: integer
          description: 成功导入行数
        skippedRows:
          type: integer
          description: 跳过行数
        bounds:
          type: array
          description: 导入数据边界 [minLng, minLat, maxLng, maxLat]，无有效坐标时为空数组
          items:
            type: number
        coordinateStats:
          $ref: '#/components/schemas/CoordinateStats'
        validationIssues:
          type: array
          description: 导入时发现的坐标校验问题
          items:
            $ref: '#/components/schemas/ValidationIssue'
    TableImportCommitResponse:
      type: object
      required:
      - mode
      - resourceId
      - resourceName
      - layerId
      - tableName
      - importedRows
      - skippedRows
      - coordinateStats
      - validationIssues
      properties:
        mode:
          type: string
          enum:
          - table
          description: 非地理表导入模式
        resourceId:
          type: integer
          description: 创建的数据资源 ID
        resourceName:
          type: string
          description: 创建的数据资源名称
        layerId:
          type:
          - integer
          - 'null'
          description: 非地理表不创建地图图层，固定为 null
        tableName:
          type: string
          description: SQLite 唯一表名
        importedRows:
          type: integer
          description: 成功导入行数
        skippedRows:
          type: integer
          description: 跳过行数
        coordinateStats:
          oneOf:
          - $ref: '#/components/schemas/CoordinateStats'
          - type: 'null'
          description: 非地理导入固定为 null
        validationIssues:
          type: array
          description: 非地理导入固定为空数组
          items:
            $ref: '#/components/schemas/ValidationIssue'
    VectorImportFieldPreview:
      type: object
      required:
      - name
      - type
      - nullable
      - sampleValues
      properties:
        name:
          type: string
          description: 源属性字段名
        type:
          type: string
          description: GeoPandas/Pandas 字段类型
        nullable:
          type: boolean
          description: 字段是否包含空值
        sampleValues:
          type: array
          description: 前若干个非空样例值
          items:
            oneOf:
            - type: string
            - type: number
            - type: boolean
            - type: 'null'
    VectorGeometryQuality:
      type: object
      required:
      - validCount
      - invalidCount
      - emptyCount
      - nullCount
      - mixedGeometry
      properties:
        validCount:
          type: integer
          description: 有效几何数量
        invalidCount:
          type: integer
          description: 无效几何数量
        emptyCount:
          type: integer
          description: 空几何数量
        nullCount:
          type: integer
          description: null 几何数量
        mixedGeometry:
          type: boolean
          description: 是否存在多种基础几何类型
    VectorImportLayerPreview:
      type: object
      required:
      - sourceLayerName
      - suggestedName
      - suggestedTableName
      - geometryType
      - featureCount
      - vertexCount
      - bounds
      - coordinateSystem
      - epsg
      - encoding
      - fields
      - previewRows
      - quality
      properties:
        sourceLayerName:
          type: string
          description: 源文件中的图层名称；GeoJSON 为文件名去扩展名
        suggestedName:
          type: string
          description: 建议的数据资源显示名称
        suggestedTableName:
          type: string
          description: 建议写入统一 GeoPackage 的图层名
        geometryType:
          type: string
          description: Point、LineString、Polygon、MultiPoint、MultiLineString、MultiPolygon 或 Mixed
        featureCount:
          type: integer
          description: 要素总数
        vertexCount:
          type: integer
          description: 几何坐标顶点总数
        bounds:
          type: array
          description: 源坐标系边界 [minX, minY, maxX, maxY]
          items:
            type: number
        coordinateSystem:
          type:
          - string
          - 'null'
          description: 解析到的坐标系文本；缺失时为 null
        epsg:
          type:
          - integer
          - 'null'
          description: 解析到的 EPSG 编码；无法识别时为 null
        encoding:
          type:
          - string
          - 'null'
          description: Shapefile DBF 使用的编码；其他格式可能为 null
        fields:
          type: array
          description: 属性字段预览
          items:
            $ref: '#/components/schemas/VectorImportFieldPreview'
        previewRows:
          type: array
          description: 前若干行属性预览，不包含几何坐标
          items:
            type: object
            additionalProperties: true
        quality:
          $ref: '#/components/schemas/VectorGeometryQuality'
    VectorImportPreviewResponse:
      type: object
      required:
      - sourceFileName
      - sourceFormat
      - layers
      - limitations
      properties:
        sourceFileName:
          type: string
          description: 原始上传文件名
        sourceFormat:
          type: string
          enum:
          - SHAPEFILE
          - GEOJSON
          - GPKG
          description: 识别到的矢量源格式
        layers:
          type: array
          minItems: 1
          description: 文件中可选择导入的矢量图层
          items:
            $ref: '#/components/schemas/VectorImportLayerPreview'
        limitations:
          type: array
          description: 当前矢量导入限制和处理提示
          items:
            type: string
    VectorImportValidateRequest:
      type: object
      required:
      - name
      - sourceLayerName
      - tableName
      properties:
        name:
          type: string
          description: 数据资源显示名称
        sourceLayerName:
          type: string
          description: 预检结果中的源图层名称
        tableName:
          type: string
          description: 建议写入统一 GeoPackage 的图层名
        encoding:
          type:
          - string
          - 'null'
          description: Shapefile DBF 编码覆盖值
        sourceCrs:
          type:
          - string
          - 'null'
