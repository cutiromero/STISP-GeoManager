      description: 轻量专题制图版式 JSON。basemapId 保存受控底图选择（mapbox-satellite、mapbox-streets、tianditu-vector、tianditu-imagery、osm），缺省沿用来源工程。可包含纸张尺寸、DPI、地图范围、地图框、标题、图例、指北针、比例尺、区位副图、经纬网或 Web Mercator 投影格网、数据来源和制图说明；不得包含原始
        GeoJSON 要素集合、属性表、Blob URL 或图片 Data URL。
    MapCompositionStatus:
      type: string
