          type: array
          description: manual必须选择至少一个实际已发布版本，auto为空；逐个核验算法权限
          uniqueItems: true
          items:
            type: integer
            description: 算法版本
            minimum: 1
        dataSelectionMode:
          type: string
          description: 自动发现或限定resourceIds；manual必须选择至少一项
