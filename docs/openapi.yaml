  /api/agent/research-demos/:
    get:
      operationId: listAgentResearchDemos
      tags: [Agent]
      summary: 获取可体验的科研案例
      description: 默认保留跨本人授权项目的完整案例入口。view=summary仅返回当前项目轻量入口，执行存在性查询，不调用模型健康检查或扫描算法。scenario只读取当前项目指定场景的完整预设，返回原完整列表结构。所有模式均核对项目和智能体权限。
      security: [{sessionAuth: []}]
      parameters:
      - name: view
        in: query
        description: summary读取当前项目轻量入口；省略时读取完整入口。
        schema: {type: string, enum: [summary]}
      - name: scenario
        in: query
        description: 只读取当前项目指定场景的完整预设；与summary视图分开使用。
        schema: {$ref: '#/components/schemas/AgentResearchScenario'}
      responses:
        '200':
          description: 本人可见的案例入口与就绪状态
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/AgentResearchDemoList'}
                - {$ref: '#/components/schemas/AgentResearchDemoSummaryList'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: 请先登录
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403':
          description: 无智能体权限
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /api/agent/runs/{runId}/research-intent/:
    post:
      operationId: updateAgentResearchIntent
      tags: [Agent]
      summary: 回答科研任务澄清或确认审核
      description: 仅原用户在原项目操作，重新核对资料、算法与权限。answer通常创建后续模型解析运行并返回202；通用地质推理的明确角色或阶段回答由服务端严格解析，返回200及已保存的后续对话运行，不调用模型猜测批准。confirm明确确认当前计划；cancel停止关联任务。相同revision与相同答案重试返回202并复用运行，不重复提交计算；新增回答遵守每日运行额度。
      security: [{sessionAuth: []}]
      parameters:
      - name: runId
        in: path
        required: true
        description: 原科研意图所属运行
        schema: {type: integer, minimum: 1, description: 原运行标识}
      - name: X-Project-Id
        in: header
        required: true
        description: 当前单个项目
        schema: {type: integer, minimum: 1, description: 已授权项目}
      requestBody:
        required: true
        description: 对当前修订的明确回答、审核或取消
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentResearchIntentUpdate'}
      responses:
        '200':
          description: 已确认审核或取消时返回原运行；通用地质明确回答返回已保存的后续对话运行
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentRun'}
        '202':
          description: 已排队后续模型解析，返回后续运行
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentRun'}
        '400':
          description: 答案或操作格式错误
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: 请先登录
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403':
          description: 权限撤回
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: 原运行不存在或不可访问
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: 修订、输入或审核计划已变化，请刷新后回答
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '429':
          description: 每日运行额度或全站模型队列额度已满，不创建新回答或执行批准
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: 模型或计算服务暂不可用
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /api/agent/bootstrap/:
    get:
      tags:
      - 智能体
      operationId: getAgentBootstrap
      summary: 获取智能体可见能力
      description: 获取智能体可见能力。仅正式登录用户；每次按当前项目、所有者、功能及超管策略重新授权。数据工具不授予额外项目权限。
      security:
      - sessionAuth: []
      responses:
        '200':
          description: 操作成功
          content:
