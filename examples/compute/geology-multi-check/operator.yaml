{
  "schemaVersion": 1,
  "identifier": "geology-multi-check",
  "name": "三要素知识检查",
  "version": "1.1.0",
  "description": "三要素知识检查。依据显式绑定的试用知识和当前输入真实测量，不读取独立评价材料；修改须逐项批准，保留、待裁定、降权和剔除分别记录。",
  "author": "STISP",
  "runtime": "python-geospatial-v1",
  "agent": {
    "enabled": true
  },
  "qualityReport": {
    "file": "quality.json"
  },
  "inputs": [
    {
      "key": "lithology",
      "label": "岩性图",
      "kind": "vector",
      "geometryTypes": [
        "Polygon",
        "MultiPolygon"
      ]
    },
    {
      "key": "faults",
      "label": "构造图",
      "kind": "vector",
      "geometryTypes": [
        "LineString",
        "MultiLineString"
      ]
    },
    {
      "key": "coverage",
      "label": "研究区制图范围",
      "kind": "vector",
      "geometryTypes": [
        "Polygon",
        "MultiPolygon"
      ]
    },
    {
      "key": "rules",
      "label": "显式启用的试用规则及版本",
      "kind": "table"
    },
    {
      "key": "hematite",
      "label": "赤铁矿遥感矿物识别结果",
      "kind": "raster",
      "minBands": 1
    },
    {
      "key": "chlorite",
      "label": "绿泥石遥感矿物识别结果",
      "kind": "raster",
      "minBands": 1
    },
    {
      "key": "hydromica",
      "label": "水云母遥感矿物识别结果",
      "kind": "raster",
      "minBands": 1
    },
    {
      "key": "calcite",
      "label": "方解石遥感矿物识别结果",
      "kind": "raster",
      "minBands": 1
    },
    {
      "key": "dolomite",
      "label": "白云石遥感矿物识别结果",
      "kind": "raster",
      "minBands": 1
    },
    {
      "key": "hematite_weight",
      "label": "赤铁矿遥感矿物识别结果权重",
      "kind": "raster",
      "minBands": 1,
      "required": false
    },
    {
      "key": "chlorite_weight",
      "label": "绿泥石遥感矿物识别结果权重",
      "kind": "raster",
      "minBands": 1,
      "required": false
    },
    {
      "key": "hydromica_weight",
      "label": "水云母遥感矿物识别结果权重",
      "kind": "raster",
      "minBands": 1,
      "required": false
    },
    {
      "key": "calcite_weight",
      "label": "方解石遥感矿物识别结果权重",
      "kind": "raster",
      "minBands": 1,
      "required": false
    },
    {
      "key": "dolomite_weight",
      "label": "白云石遥感矿物识别结果权重",
      "kind": "raster",
      "minBands": 1,
      "required": false
    }
  ],
  "parameters": [
    {
      "key": "working_epsg",
      "label": "米制工作投影EPSG",
      "type": "integer",
      "default": 32646,
      "min": 1,
      "max": 999999
    },
    {
      "key": "segment",
      "label": "本次检查范围",
      "type": "enum",
      "default": "all",
      "choices": [
        "all",
        "lithology",
        "structure",
        "alteration"
      ]
    },
    {
      "key": "grid_resolution_m",
      "label": "综合分析网格（米）",
      "type": "number",
      "default": 100,
      "min": 10,
      "max": 1000
    },
    {
      "key": "min_zone_area_m2",
      "label": "远景区最小面积（平方米）",
      "type": "number",
      "default": 200000,
      "min": 0,
      "max": 100000000
    }
  ],
  "outputs": [
    {
      "key": "issues",
      "label": "发现的问题与建议",
      "kind": "table",
      "file": "issues.csv"
    },
    {
      "key": "statistics",
      "label": "按实际规则检查统计",
      "kind": "table",
      "file": "statistics.csv"
    },
    {
      "key": "lithology_issues",
      "label": "岩性疑点",
      "kind": "vector",
      "file": "lithology_issues.gpkg",
      "required": false
    },
    {
      "key": "fault_issues",
      "label": "构造疑点",
      "kind": "vector",
      "file": "fault_issues.gpkg",
      "required": false
    },
    {
      "key": "alteration_summary",
      "label": "蚀变逐像元归类汇总",
      "kind": "table",
      "file": "alteration_summary.csv"
    },
    {
      "key": "alteration_quality",
      "label": "蚀变像元质量统计",
      "kind": "table",
      "file": "alteration_quality.csv"
    },
    {
      "key": "group_index",
      "label": "稳定组与栅格整数索引",
      "kind": "table",
      "file": "group_index.csv"
    },
    {
      "key": "hematite_hits",
      "label": "赤铁矿遥感矿物识别结果 hits",
      "kind": "raster",
      "file": "hematite_hits.tif"
    },
    {
      "key": "hematite_groups",
      "label": "赤铁矿遥感矿物识别结果 groups",
      "kind": "raster",
      "file": "hematite_groups.tif"
    },
    {
      "key": "hematite_before",
      "label": "赤铁矿遥感矿物识别结果 before",
      "kind": "raster",
      "file": "hematite_before.tif"
    },
    {
      "key": "chlorite_hits",
      "label": "绿泥石遥感矿物识别结果 hits",
      "kind": "raster",
      "file": "chlorite_hits.tif"
    },
    {
      "key": "chlorite_groups",
      "label": "绿泥石遥感矿物识别结果 groups",
      "kind": "raster",
      "file": "chlorite_groups.tif"
    },
    {
      "key": "chlorite_before",
      "label": "绿泥石遥感矿物识别结果 before",
      "kind": "raster",
      "file": "chlorite_before.tif"
    },
    {
      "key": "hydromica_hits",
      "label": "水云母遥感矿物识别结果 hits",
      "kind": "raster",
      "file": "hydromica_hits.tif"
    },
    {
      "key": "hydromica_groups",
      "label": "水云母遥感矿物识别结果 groups",
      "kind": "raster",
      "file": "hydromica_groups.tif"
    },
    {
      "key": "hydromica_before",
      "label": "水云母遥感矿物识别结果 before",
      "kind": "raster",
      "file": "hydromica_before.tif"
    },
    {
      "key": "calcite_hits",
      "label": "方解石遥感矿物识别结果 hits",
      "kind": "raster",
      "file": "calcite_hits.tif"
    },
    {
      "key": "calcite_groups",
      "label": "方解石遥感矿物识别结果 groups",
      "kind": "raster",
      "file": "calcite_groups.tif"
    },
    {
      "key": "calcite_before",
      "label": "方解石遥感矿物识别结果 before",
      "kind": "raster",
      "file": "calcite_before.tif"
    },
    {
      "key": "dolomite_hits",
      "label": "白云石遥感矿物识别结果 hits",
      "kind": "raster",
      "file": "dolomite_hits.tif"
    },
    {
      "key": "dolomite_groups",
      "label": "白云石遥感矿物识别结果 groups",
      "kind": "raster",
      "file": "dolomite_groups.tif"
    },
    {
      "key": "dolomite_before",
      "label": "白云石遥感矿物识别结果 before",
      "kind": "raster",
      "file": "dolomite_before.tif"
    }
  ],
  "timeoutSeconds": 900,
  "deterministic": true
}
