        {
          "role": "feature_id",
          "description": "稳定图斑标识",
          "types": [
            "string",
            "integer"
          ],
          "required": true,
          "legacyName": "feature_id"
        },
        {
          "role": "stratum_name",
          "description": "名称",
          "types": [
            "string"
          ],
          "required": true,
          "legacyName": "name"
