    "summary": "三要素知识检查。依据显式绑定的试用知识和当前输入真实测量，不读取独立评价材料；修改须逐项批准，保留、待裁定、降权和剔除分别记录。",
    "useWhen": "已绑定研究区、实际观测和显式规则版本；需要三要素知识检查。",
    "avoidWhen": "不把遥感识别或规则建议视为地质真值；未绑定规则或缺少人工批准时不得自动修正。"
  },
  "errors": [
