<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>找矿远景区候选结果</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f7;color:#213547;font:15px/1.55 system-ui,-apple-system,"PingFang SC",sans-serif}main{max-width:1440px;margin:auto;padding:24px}h1{font-size:24px;margin:0 0 8px}p{color:#5c6c78;margin:4px 0 16px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}button{font:inherit;border:1px solid #c5d0d7;border-radius:7px;background:white;color:#314858;padding:8px 16px;cursor:pointer}button[aria-pressed=true]{background:#244d61;color:white;border-color:#244d61}.stats{display:flex;gap:36px;flex-wrap:wrap;margin:10px 0 18px}.stats strong{display:block;font-size:25px}.stats span{font-size:13px;color:#627582}.map{background:white;overflow:auto;border:1px solid #d9e1e7;border-radius:10px}img{display:block;max-width:100%;height:auto;margin:auto}.image-tools{display:flex;gap:8px;align-items:center;margin:12px 0}.image-tools button{padding:5px 12px}.note{font-size:13px;color:#667c87}table{width:100%;border-collapse:collapse;background:white;margin-top:18px;font-size:14px}th,td{padding:10px;border-bottom:1px solid #e4eaee;text-align:left}th{background:#e9eff3;font-weight:600}tbody tr{cursor:pointer}tbody tr:hover{background:#edf5f7}.detail{background:white;border-left:3px solid #3c7288;padding:16px;margin-top:16px}.detail h2{font-size:18px;margin:0 0 8px}.detail p{margin-bottom:8px}.scroll{overflow:auto}footer{font-size:12px;color:#748590;margin-top:24px}@media(max-width:680px){main{padding:14px}h1{font-size:21px}.stats{gap:24px}.stats strong{font-size:23px}th,td{white-space:nowrap}}
</style></head><body><main>
<h1>五龙沟—海德乌拉 · 找矿远景区候选结果</h1>
<p>仅对最新修复后成果试算；正式站仍使用现行算子，候选方案尚未发布。</p>
<div class="toolbar" aria-label="选择圈区尺度"><button type="button" data-profile="comparison" aria-pressed="false">同尺度对照</button><button type="button" data-profile="focused" aria-pressed="true">收敛 · 建议优先评估</button><button type="button" data-profile="balanced" aria-pressed="false">均衡</button><button type="button" data-profile="regional" aria-pressed="false">扩展</button></div>
<div class="stats"><div><strong id="count"></strong><span>候选区域</span></div><div><strong id="area"></strong><span>总面积（km²）</span></div><div><strong id="range"></strong><span>单区面积范围（km²）</span></div><div><strong id="fraction"></strong><span>占研究区面积</span></div></div>
<div class="map"><img id="map" alt="候选远景区与修复后构造、岩性背景叠加地图"></div>
<div class="image-tools"><button type="button" id="zoom-in">放大</button><button type="button" id="zoom-out">缩小</button><button type="button" id="zoom-reset">适应窗口</button><span class="note">红—黄—蓝连续显示综合支持度，高、中、低；不是有矿概率。</span></div>
<div class="scroll"><table><thead><tr><th>区域</th><th>面积 km²</th><th>核心 km²</th><th>综合支持</th><th>构造支持</th><th>蚀变支持</th><th>有利岩性覆盖</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="detail" id="detail" aria-live="polite"><h2>逐区依据</h2><p>选择上表区域查看核心、外围、矿物组合、岩性与构造依据。</p></div>
<footer>数据来自最新完成任务 83dc0e7d，使用其修复后岩性、构造、矿物及权重。距离与面积采用EPSG:32646，分析网格50米。原始数据、原任务、正式算子及知识版本保持不变。</footer>
</main><script type="application/json" id="data">__DATA_JSON__</script><script>
(()=>{const data=JSON.parse(document.getElementById('data').textContent);let selected='focused',zoom=1;const image=document.getElementById('map');const rows=document.getElementById('rows');const detail=document.getElementById('detail');
const number=(value,digits=2)=>Number(value).toLocaleString('zh-CN',{maximumFractionDigits:digits,minimumFractionDigits:digits});
function showDetail(row){detail.replaceChildren();const title=document.createElement('h2');title.textContent=row.zone_id+' · '+number(row.area_km2)+' km²';detail.append(title);const descriptions=[row.explanation,'核心占比 '+number(Number(row.core_fraction)*100,1)+'%；外围采用与核心连通的中等支持区域，未直接将缓冲圈作为结果。','上下文内平均加权矿物类型数 '+number(row.mean_weighted_types)+'；区域内直接出现的矿物：'+JSON.parse(row.direct_minerals_json).join('、')];const rock=JSON.parse(row.lithology_json);descriptions.push('主要岩性：'+Object.entries(rock).slice(0,4).map(([code,value])=>value.name+' '+number(value.area_km2)+' km²').join('；'));const faults=JSON.parse(row.nearby_faults_json||'[]');descriptions.push('相关构造：'+faults.slice(0,8).map(item=>item.line_id+'（距区 '+number(item.distance_m,0)+' m，权重 '+item.weight+'）').join('；'));for(const text of descriptions){const p=document.createElement('p');p.textContent=text;detail.append(p);}}
function render(){for(const button of document.querySelectorAll('[data-profile]'))button.setAttribute('aria-pressed',String(button.dataset.profile===selected));const item=selected==='comparison'?data.focused:data[selected];document.getElementById('count').textContent=item.count+' 处';document.getElementById('area').textContent=number(item.area_km2);document.getElementById('range').textContent=number(item.min_km2)+'—'+number(item.max_km2);document.getElementById('fraction').textContent=number(item.study_fraction*100)+'%';image.src=selected==='comparison'?data.comparison:data[selected].image;image.style.maxWidth='100%';image.style.width='auto';zoom=1;rows.replaceChildren();detail.style.display=selected==='comparison'?'none':'block';if(selected==='comparison')return;for(const row of item.zones){const tr=document.createElement('tr');const values=[row.zone_id,number(row.area_km2),number(row.core_area_km2),number(row.mean_support),number(row.mean_structure),number(row.mean_alteration),number(Number(row.favourable_fraction)*100,1)+'%'];for(const value of values){const td=document.createElement('td');td.textContent=value;tr.append(td);}tr.tabIndex=0;tr.setAttribute('aria-label','查看'+row.zone_id+'依据');tr.onclick=()=>showDetail(row);tr.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();showDetail(row);}};rows.append(tr);}if(item.zones[0])showDetail(item.zones[0]);}
for(const button of document.querySelectorAll('[data-profile]'))button.onclick=()=>{selected=button.dataset.profile;render();};function scale(factor){zoom=Math.max(1,Math.min(4,zoom*factor));image.style.maxWidth=zoom===1?'100%':'none';image.style.width=zoom===1?'auto':Math.round(zoom*100)+'%';}document.getElementById('zoom-in').onclick=()=>scale(1.35);document.getElementById('zoom-out').onclick=()=>scale(1/1.35);document.getElementById('zoom-reset').onclick=()=>{zoom=1;scale(1);};render();})();
</script></body></html>
