{
  "schemaVersion": 1,
  "identifier": "geology-multi-prospect",
  "name": "优先核查远景区分析",
  "version": "2.3.0",
  "description": "仅使用修正后岩性、构造、蚀变及有效权重，以连续支持场圈定平滑远景区；同一连通支持带合并，区域无重叠，输出红黄蓝渐变热力图及逐区依据。",
  "author": "STISP",
  "runtime": "python-geospatial-v1",
  "agent": {
    "enabled": true
  },
  "qualityReport": {
    "file": "quality.json"
  },
  "inputs": [
    {
      "key": "lithology",
      "label": "岩性图",
      "kind": "vector",
      "geometryTypes": [
        "Polygon",
        "MultiPolygon"
      ]
    },
    {
      "key": "faults",
      "label": "构造图",
      "kind": "vector",
      "geometryTypes": [
        "LineString",
        "MultiLineString"
      ]
    },
    {
      "key": "coverage",
      "label": "研究区制图范围",
      "kind": "vector",
      "geometryTypes": [
        "Polygon",
        "MultiPolygon"
      ]
    },
    {
      "key": "rules",
      "label": "显式绑定的地质规则及版本",
      "kind": "table"
    },
    {
      "key": "hematite",
      "label": "赤铁矿遥感矿物识别结果",
      "kind": "raster",
      "minBands": 1,
      "required": false
    },
    {
      "key": "chlorite",
      "label": "绿泥石遥感矿物识别结果",
      "kind": "raster",
      "minBands": 1,
      "required": false
    },
    {
      "key": "hydromica",
      "label": "水云母遥感矿物识别结果",
      "kind": "raster",
      "minBands": 1,
      "required": false
    },
    {
      "key": "calcite",
      "label": "方解石遥感矿物识别结果",
      "kind": "raster",
      "minBands": 1,
      "required": false
    },
    {
      "key": "dolomite",
      "label": "白云石遥感矿物识别结果",
      "kind": "raster",
      "minBands": 1,
      "required": false
    },
    {
      "key": "intersections",
      "label": "当前构造交汇点",
      "kind": "vector",
      "geometryTypes": [
        "Point",
        "MultiPoint"
      ],
      "required": false
    },
    {
      "key": "hematite_weight",
      "label": "赤铁矿遥感矿物识别结果权重",
      "kind": "raster",
      "minBands": 1,
      "required": false
    },
    {
      "key": "chlorite_weight",
      "label": "绿泥石遥感矿物识别结果权重",
      "kind": "raster",
      "minBands": 1,
      "required": false
    },
    {
      "key": "hydromica_weight",
      "label": "水云母遥感矿物识别结果权重",
      "kind": "raster",
      "minBands": 1,
      "required": false
    },
    {
      "key": "calcite_weight",
      "label": "方解石遥感矿物识别结果权重",
      "kind": "raster",
      "minBands": 1,
      "required": false
    },
    {
      "key": "dolomite_weight",
      "label": "白云石遥感矿物识别结果权重",
      "kind": "raster",
      "minBands": 1,
      "required": false
    },
    {
      "key": "alteration_stack",
      "label": "类别掩膜栅格集（类别不限预置示例）",
      "kind": "raster",
      "minBands": 1,
      "required": false
    },
    {
      "key": "alteration_stack_weight",
      "label": "同类别、同网格的证据权重栅格集",
      "kind": "raster",
      "minBands": 1,
      "required": false
    }
  ],
  "parameters": [
    {
      "key": "profile",
      "label": "远景区范围尺度",
      "type": "enum",
      "default": "focused",
      "choices": [
        "focused",
        "balanced",
        "regional"
      ]
    },
    {
      "key": "working_epsg",
      "label": "米制投影EPSG",
      "type": "integer",
      "default": 32646,
      "min": 1,
      "max": 999999
    },
    {
      "key": "segment",
      "label": "资料范围",
      "type": "enum",
      "default": "all",
      "choices": [
        "all",
        "lithology",
        "structure",
        "alteration"
      ]
    },
    {
      "key": "prospect_grid_resolution_m",
      "label": "远景区分析网格（米）",
      "type": "number",
      "default": 50,
      "min": 25,
      "max": 200
    },
    {
      "key": "min_zone_area_km2",
      "label": "最小目标面积（平方公里）",
      "type": "number",
      "default": 1.0,
      "min": 0.01,
      "max": 30
    },
    {
      "key": "min_core_area_km2",
      "label": "最小核心面积（平方公里）",
      "type": "number",
      "default": 0.05,
      "min": 0.001,
      "max": 5
    },
    {
      "key": "core_score_min",
      "label": "核心支持门槛",
      "type": "number",
      "default": 0.62,
      "min": 0,
      "max": 1
    },
    {
      "key": "alteration_density_scale",
      "label": "蚀变覆盖尺度",
      "type": "number",
      "default": 0.08,
      "min": 0.001,
      "max": 1
    },
    {
      "key": "peripheral_min_weighted_types",
      "label": "外围最低加权矿物类型数",
      "type": "number",
      "default": 1.5,
      "min": 1,
      "max": 5
    },
    {
      "key": "peripheral_min_density",
      "label": "外围最低平滑加权覆盖比例",
      "type": "number",
      "default": 0.002,
      "min": 0,
      "max": 1
    },
    {
      "key": "support_smooth_m",
      "label": "连续支持场平滑尺度（米）",
      "type": "number",
      "default": 100,
      "min": 25,
      "max": 250
    }
  ],
  "outputs": [
    {
      "key": "after_zones",
      "label": "修正后优先核查远景区",
      "kind": "vector",
      "file": "after_zones.gpkg",
      "required": false
    },
    {
      "key": "prospect_support",
      "label": "远景相对置信度热力图",
      "kind": "raster",
      "file": "prospect_support.tif"
    },
    {
      "key": "strong_core",
      "label": "强证据核心",
      "kind": "raster",
      "file": "strong_core.tif"
    },
    {
      "key": "evidence",
      "label": "每区实测依据链",
      "kind": "table",
      "file": "evidence.csv"
    },
    {
      "key": "statistics",
      "label": "修正后远景区统计",
      "kind": "table",
      "file": "statistics.csv"
    }
  ],
  "timeoutSeconds": 900,
  "deterministic": true
}
