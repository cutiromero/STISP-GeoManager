{
  "schemaVersion": 2,
  "identifier": "glacier-temporal-compare",
  "name": "冰川同样区双期变化统计",
  "version": "1.1.0",
  "author": "STISP",
  "description": "按共同有效区统计冰川编码变化；首期只生成基线，不填零变化。",
  "runtime": "python-geospatial-v1",
  "deterministic": true,
  "timeoutSeconds": 240,
  "agent": {
    "enabled": true
  },
  "qualityReport": {
    "file": "quality.json"
  },
  "capabilities": {
    "operations": [
      "check",
      "statistics"
    ],
    "dataTypes": [
      "raster",
      "table"
    ],
    "summary": "输出背景/洁净冰川/表碛冰川的原生投影面积、双期变化和转移矩阵。",
    "useWhen": "已审核的同样区、同格网、同模型和可比观测条件；可无前期建立单期基线。",
    "avoidWhen": "两个独立样区或未具名的历史时相不能相减；0标为NoData的旧分类不是直接基线。"
  },
  "inputs": [
    {
      "key": "current",
      "label": "新一期冰川分类",
      "kind": "raster",
      "required": true,
      "description": "同口径冰川分类：原生3米UTM，UInt8单波段，0背景、1洁净冰川、2表碛冰川、255 NoData。",
      "fields": [],
      "crs": {
        "mode": "projected"
      },
      "raster": {
        "bandCount": 1,
        "dtypes": [
          "uint8"
        ],
        "pixelSizeMeters": 3,
        "northUp": true
      }
    },
    {
      "key": "baseline",
      "label": "可比历史分类",
      "kind": "raster",
      "required": false,
      "description": "同口径冰川分类：原生3米UTM，UInt8单波段，0背景、1洁净冰川、2表碛冰川、255 NoData。",
      "fields": [],
      "crs": {
        "mode": "same_as",
        "input": "current"
      },
      "raster": {
        "bandCount": 1,
        "dtypes": [
          "uint8"
        ],
        "pixelSizeMeters": 3,
        "northUp": true
      }
    },
    {
      "key": "observations",
      "label": "观测日期与可比性核验表",
      "kind": "table",
      "required": false,
      "description": "双期必选。单行CSV，人工核对日期和来源，确认同样区、同法且可比后comparable填yes。",
      "fields": [
        {
          "role": "current_date",
          "description": "新一期观测日期",
          "types": [
            "string"
          ],
          "required": true
        },
        {
          "role": "baseline_date",
          "description": "前一期观测日期",
          "types": [
            "string"
          ],
          "required": true
        },
        {
          "role": "current_source",
          "description": "新期影像及日期来源",
          "types": [
            "string"
          ],
          "required": true
        },
        {
          "role": "baseline_source",
          "description": "历史分类及日期来源",
          "types": [
            "string"
          ],
          "required": true
        },
        {
          "role": "comparable",
          "description": "可比人工确认",
          "types": [
            "string"
          ],
          "required": true
        }
      ],
      "crs": {
        "mode": "any"
      }
    }
  ],
  "parameters": [],
  "outputs": [
    {
      "key": "areas",
      "label": "冰川面积与净变化",
      "kind": "table",
      "file": "glacier_areas.csv",
      "description": "各类单期面积与在双期共同有效区内的面积、变化。首期只有单期项。",
      "fields": [
        {
          "role": "class_code",
          "name": "class_code",
          "description": "0/1/2或ice合计",
          "types": [
            "string"
          ],
          "required": true
        },
        {
          "role": "label",
          "name": "label",
          "description": "类别名",
          "types": [
            "string"
          ],
          "required": true
        },
        {
          "role": "current_valid_pixels",
          "name": "current_valid_pixels",
          "description": "本期该类有效像元数",
          "types": [
            "integer"
          ],
          "required": true
        },
        {
          "role": "current_area_km2",
          "name": "current_area_km2",
          "description": "单期原生UTM投影面积",
          "types": [
            "number"
          ],
          "required": true,
          "unit": "km²"
        },
        {
          "role": "common_current_pixels",
          "name": "common_current_pixels",
          "description": "共同有效区内当前像元数",
          "types": [
            "integer"
          ],
          "required": true
        },
        {
          "role": "common_baseline_pixels",
          "name": "common_baseline_pixels",
          "description": "共同有效区内前期像元数",
          "types": [
            "integer"
          ],
          "required": true
        },
        {
          "role": "common_net_pixels",
          "name": "common_net_pixels",
          "description": "共同有效区净变化像元数",
          "types": [
            "integer"
          ],
          "required": true
        },
        {
          "role": "common_net_km2",
          "name": "common_net_km2",
          "description": "共同有效区投影净变化",
          "types": [
            "number"
          ],
          "required": true,
          "unit": "km²"
        }
      ],
      "required": true,
      "final": true
    },
    {
      "key": "transitions",
      "label": "类别转移矩阵",
      "kind": "table",
      "file": "glacier_transitions.csv",
      "description": "只统计两期共同有效区内0/1/2的全部有向转换；首期表仅有表头。",
      "fields": [
        {
          "role": "baseline_date",
          "name": "baseline_date",
          "description": "基线观测日",
          "types": [
            "string"
          ],
          "required": true
        },
        {
          "role": "current_date",
          "name": "current_date",
          "description": "本期观测日",
          "types": [
            "string"
          ],
          "required": true
        },
        {
          "role": "from_code",
          "name": "from_code",
          "description": "前期类别码",
          "types": [
            "integer"
          ],
          "required": true
        },
        {
          "role": "to_code",
          "name": "to_code",
          "description": "本期类别码",
          "types": [
            "integer"
          ],
          "required": true
        },
        {
          "role": "pixels",
          "name": "pixels",
          "description": "该转移像元数",
          "types": [
            "integer"
          ],
          "required": true
        },
        {
          "role": "area_km2",
          "name": "area_km2",
          "description": "该转移的原生UTM投影面积",
          "types": [
            "number"
          ],
          "required": true,
          "unit": "km²"
        }
      ],
      "required": true,
      "final": true
    },
    {
      "key": "coverage",
      "label": "观测时相与有效范围",
      "kind": "table",
      "file": "observation_coverage.csv",
      "description": "写明是否建立基线，以及本期、前期和共同有效范围的分母。",
      "fields": [
        {
          "role": "status",
          "name": "status",
          "description": "baseline_only或compared",
          "types": [
            "string"
          ],
          "required": true
        },
        {
          "role": "current_date",
          "name": "current_date",
          "description": "本期观测日",
          "types": [
            "string"
          ],
          "required": true
        },
        {
          "role": "baseline_date",
          "name": "baseline_date",
          "description": "前期观测日",
          "types": [
            "string"
          ],
          "required": true
        },
        {
          "role": "native_crs",
          "name": "native_crs",
          "description": "原生UTM CRS",
          "types": [
            "string"
          ],
          "required": true
        },
        {
          "role": "scene_pixels",
          "name": "scene_pixels",
          "description": "格网总像元数",
          "types": [
            "integer"
          ],
          "required": true
        },
        {
          "role": "current_valid_pixels",
          "name": "current_valid_pixels",
          "description": "本期有效像元包含背景",
          "types": [
            "integer"
          ],
          "required": true
        },
        {
          "role": "baseline_valid_pixels",
          "name": "baseline_valid_pixels",
          "description": "前期有效像元包含背景",
          "types": [
            "integer"
          ],
          "required": true
        },
        {
          "role": "common_valid_pixels",
          "name": "common_valid_pixels",
          "description": "双期共同有效像元包含背景",
          "types": [
            "integer"
          ],
          "required": true
        },
        {
          "role": "common_valid_pct",
          "name": "common_valid_pct",
          "description": "共同有效像元占全格网",
          "types": [
            "number"
          ],
          "required": true,
          "unit": "%"
        }
      ],
      "required": true,
      "final": true
    }
  ],
  "errors": [
    {
      "code": "GLACIER_MASK_CONTRACT",
      "meaning": "分类网格或NoData声明不符",
      "precondition": "提供3米UTM、单波段UInt8、NoData=255的分类图。",
      "remedy": "replace_data"
    },
    {
      "code": "GLACIER_CLASS_CODE",
      "meaning": "有效区有未登记的分类码",
      "precondition": "提供0/1/2固定编码成果。",
      "remedy": "replace_data"
    },
    {
      "code": "GLACIER_GRID_MISMATCH",
      "meaning": "两期原生格网不一致",
      "precondition": "换同网格成果，或先准备受控对齐的派生资料。",
      "remedy": "replace_data"
    },
    {
      "code": "GLACIER_NO_OVERLAP",
      "meaning": "两期没有共同有效像元",
      "precondition": "选择共同覆盖的可比资料。",
      "remedy": "replace_data"
    },
    {
      "code": "GLACIER_NO_COVERAGE",
      "meaning": "本期没有有效像元",
      "precondition": "更换具有有效观测覆盖的资料。",
      "remedy": "replace_data"
    },
    {
      "code": "GLACIER_DATE_ORDER",
      "meaning": "数据观测日期缺失或顺序不符",
      "precondition": "确认实际观测日期；基线必须早于新期。",
      "remedy": "human_review"
    },
    {
      "code": "GLACIER_COMPARABILITY",
      "meaning": "可比条件未确认",
      "precondition": "核对数据与处理口径，不能确认则转为建基线。",
      "remedy": "human_review"
    },
    {
      "code": "GLACIER_EVIDENCE",
      "meaning": "观测依据表的字段、行数或编码不合约",
      "precondition": "上传含规定五列和一条观测记录的UTF-8 CSV。",
      "remedy": "replace_data"
    }
  ],
  "resources": {
    "duration": "seconds",
    "memory": "small",
    "scaling": "分块逐像元线性统计，固定3×3矩阵，不读取全图到内存。"
  },
  "selfTests": [
    {
      "name": "首期为空差值",
      "fixture": "selftest/first.json",
      "expect": {
        "files": {
          "observation_coverage.csv": {
            "rows": 1,
            "contains": "baseline_only,,,EPSG:32643,8,6,,,"
          },
          "glacier_areas.csv": {
            "rows": 4,
            "contains": "ice,冰川合计,4,3.6e-05,,,,"
          },
          "glacier_transitions.csv": {
            "rows": 0
          }
        }
      }
    },
    {
      "name": "共同有效区域与背景转移",
      "fixture": "selftest/paired.json",
      "expect": {
        "files": {
          "observation_coverage.csv": {
            "rows": 1,
            "contains": "compared,2025-09-01,2024-09-01,EPSG:32643,8,6,5,4,50.0"
          },
          "glacier_areas.csv": {
            "rows": 4,
            "contains": "ice,冰川合计,4,3.6e-05,3,1,2,1.8e-05"
          },
          "glacier_transitions.csv": {
            "rows": 9,
            "contains": "2024-09-01,2025-09-01,0,1,2,1.8e-05"
          }
        }
      }
    },
    {
      "name": "拒绝旧版0为缺测",
      "fixture": "selftest/legacy.json",
      "expect": {
        "errorCode": "GLACIER_MASK_CONTRACT"
      }
    },
    {
      "name": "拒绝格网偏移",
      "fixture": "selftest/shifted.json",
      "expect": {
        "errorCode": "GLACIER_GRID_MISMATCH"
      }
    },
    {
      "name": "拒绝无共同覆盖",
      "fixture": "selftest/no-overlap.json",
      "expect": {
        "errorCode": "GLACIER_NO_OVERLAP"
      }
    },
    {
      "name": "拒绝未确认可比",
      "fixture": "selftest/unconfirmed.json",
      "expect": {
        "errorCode": "GLACIER_COMPARABILITY"
      }
    },
    {
      "name": "拒绝非递增日期",
      "fixture": "selftest/date-order.json",
      "expect": {
        "errorCode": "GLACIER_DATE_ORDER"
      }
    },
    {
      "name": "拒绝没有时相依据的双期",
      "fixture": "selftest/missing-evidence.json",
      "expect": {
        "errorCode": "GLACIER_COMPARABILITY"
      }
    }
  ]
}
