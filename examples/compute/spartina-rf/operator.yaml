{
  "schemaVersion": 2,
  "identifier": "spartina-rf-infer",
  "name": "互花米草识别与制图",
  "version": "1.2.0",
  "description": "使用三期卫星影像联合识别互花米草，默认处理共同覆盖全域，按原始网格分块解译并统计。",
  "author": "STISP",
  "runtime": "python-geospatial-ml-v1",
  "deterministic": true,
  "timeoutSeconds": 7200,
  "agent": {
    "enabled": true
  },
  "qualityReport": {
    "file": "quality.json"
  },
  "inputs": [
    {
      "key": "march",
      "label": "3月影像",
      "kind": "raster",
      "required": true,
      "minBands": 16,
      "description": "WGS84北向上Float32，16个固定波段。",
      "fields": [],
      "crs": {
        "mode": "any"
      },
      "raster": {
        "bandCount": 16,
        "dtypes": [
          "float32"
        ],
        "northUp": true,
        "window": [
          "west",
          "south",
          "east",
          "north"
        ],
        "defaultExtent": true,
        "streaming": true,
        "months": [
          3
        ],
        "sameYear": true
      }
    },
    {
      "key": "august",
      "label": "8月影像",
      "kind": "raster",
      "required": true,
      "minBands": 16,
      "description": "WGS84北向上Float32，16个固定波段。",
      "fields": [],
      "crs": {
        "mode": "any"
      },
      "raster": {
        "bandCount": 16,
        "dtypes": [
          "float32"
        ],
        "northUp": true,
        "window": [
          "west",
          "south",
          "east",
          "north"
        ],
        "defaultExtent": true,
        "streaming": true,
        "months": [
          8
        ],
        "sameYear": true
      }
    },
    {
      "key": "december",
      "label": "12月影像",
      "kind": "raster",
      "required": true,
      "minBands": 16,
      "description": "WGS84北向上Float32，16个固定波段。",
      "fields": [],
      "crs": {
        "mode": "any"
      },
      "raster": {
        "bandCount": 16,
        "dtypes": [
          "float32"
        ],
        "northUp": true,
        "window": [
          "west",
          "south",
          "east",
          "north"
        ],
        "defaultExtent": true,
        "streaming": true,
        "months": [
          12
        ],
        "sameYear": true
      }
    }
  ],
  "parameters": [
    {
      "key": "west",
      "label": "西界",
      "type": "number",
      "min": -180,
      "max": 180,
      "agent": {
        "adjustable": false,
        "advice": "沿用用户选定研究区边界。"
      },
      "help": "可选的WGS84经纬度边界。四界全部省略时使用三期影像共同覆盖全域；模型按256×256原生网格块处理。"
    },
    {
      "key": "south",
      "label": "南界",
      "type": "number",
      "min": -90,
      "max": 90,
      "agent": {
        "adjustable": false,
        "advice": "沿用用户选定研究区边界。"
      },
      "help": "可选的WGS84经纬度边界。四界全部省略时使用三期影像共同覆盖全域；模型按256×256原生网格块处理。"
    },
    {
      "key": "east",
      "label": "东界",
      "type": "number",
      "min": -180,
      "max": 180,
      "agent": {
        "adjustable": false,
        "advice": "沿用用户选定研究区边界。"
      },
      "help": "可选的WGS84经纬度边界。四界全部省略时使用三期影像共同覆盖全域；模型按256×256原生网格块处理。"
    },
    {
      "key": "north",
      "label": "北界",
      "type": "number",
      "min": -90,
      "max": 90,
      "agent": {
        "adjustable": false,
        "advice": "沿用用户选定研究区边界。"
      },
      "help": "可选的WGS84经纬度边界。四界全部省略时使用三期影像共同覆盖全域；模型按256×256原生网格块处理。"
    }
  ],
  "outputs": [
    {
      "key": "classification",
      "label": "互花米草分类图",
      "kind": "raster",
      "file": "classification.tif",
      "required": true,
      "description": "0非目标区、1互花米草、255无效区；原始网格与分类图例。",
      "fields": [],
      "final": true
    },
    {
      "key": "probability",
      "label": "互花米草目标概率",
      "kind": "raster",
      "file": "probability.tif",
      "required": true,
      "description": "目标类别概率0至1；无效区为NoData。",
      "fields": [],
      "final": true
    },
    {
      "key": "statistics",
      "label": "互花米草面积统计",
      "kind": "table",
      "file": "statistics.csv",
      "required": true,
      "description": "研究区共同有效范围内的面积、覆盖与8连通斑块数。",
      "fields": [],
      "final": true
    },
    {
      "key": "manifest",
      "label": "处理依据",
      "kind": "document",
      "file": "result.json",
      "required": true,
      "description": "输入、模型与统计口径。",
      "fields": [],
      "final": false
    },
    {
      "key": "original",
      "label": "输入影像真彩色预览",
      "kind": "raster",
      "file": "original.tif",
      "required": false,
      "description": "选区任务的输入真彩色预览；全域任务直接浏览已登记原始影像。",
      "fields": [],
      "final": false
    }
  ],
  "capabilities": {
    "operations": [
      "infer",
      "map",
      "statistics"
    ],
    "dataTypes": [
      "raster"
    ],
    "summary": "三季节48特征RF互花米草识别。",
    "useWhen": "具有三个季节的同网格16波段影像。",
    "avoidWhen": "影像或波段顺序不符。"
  },
  "errors": [
    {
      "code": "SPARTINA_INPUT_INVALID",
      "meaning": "输入波段、网格或研究区不符合要求",
      "remedy": "replace_data",
      "precondition": "三期同网格16波段原始影像"
    }
  ],
  "resources": {
    "duration": "minutes",
    "memory": "large",
    "scaling": "按研究区像元数增长；三期窗口流式读取，单RF任务执行。"
  },
  "selfTests": [
    {
      "name": "拒绝非16波段影像",
      "fixture": "selftest/invalid.json",
      "expect": {
        "errorCode": "SPARTINA_INPUT_INVALID"
      }
    }
  ]
}
