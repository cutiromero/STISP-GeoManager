          ],
          "required": false,
          "name": "after_count"
        },
        {
          "role": "delta_count",
          "description": "交汇关系统计的delta_count字段；具体判据沿用冻结规则",
          "types": [
            "string",
            "integer",
            "number",
            "boolean"
          ],
          "required": false,
          "name": "delta_count"
        }
      ],
      "final": false
    }
  ],
  "timeoutSeconds": 900,
  "deterministic": true,
  "capabilities": {
    "operations": [
      "infer"
    ],
    "dataTypes": [
      "table",
      "vector"
    ],
    "summary": "构造关系重建。依据显式绑定的试用知识和当前输入真实测量，不读取独立评价材料；修改须逐项批准，保留、待裁定、降权和剔除分别记录。",
    "useWhen": "已绑定研究区、实际观测和显式规则版本；需要构造关系重建。",
    "avoidWhen": "不把遥感识别或规则建议视为地质真值；未绑定规则或缺少人工批准时不得自动修正。"
  },
  "errors": [
    {
      "code": "INPUT_INVALID",
      "meaning": "实际输入、规则或参数未通过算子已有检查",
      "remedy": "replace_data",
      "precondition": "输入须满足清单语义及算子规则约束；人工批准必须绑定当前快照"
    }
  ],
  "resources": {
    "duration": "minutes",
    "memory": "medium",
    "scaling": "时间随实际像元/要素与规则数量增加；栅格分块读取，复杂几何叠加可能增加峰值内存。small约小于512MiB，medium约512MiB至2GiB，large高于2GiB；均非资源保证。"
  },
  "selfTests": [
    {
      "name": "真实小样例运行",
      "fixture": "selftest/smoke.json",
      "expect": {
        "files": {
          "statistics.csv": {
            "rows": 2,
            "columns": [
              "kind",
              "count",
              "before_count",
              "after_count",
              "delta_count"
            ]
          }
        }
      }
    }
  ]
