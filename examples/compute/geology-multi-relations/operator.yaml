          ],
          "required": false,
          "name": "kind"
        },
        {
          "role": "count",
          "description": "交汇关系统计的count字段；具体判据沿用冻结规则",
          "types": [
            "string",
            "integer",
            "number",
            "boolean"
          ],
          "required": false,
          "name": "count"
        },
        {
          "role": "before_count",
          "description": "交汇关系统计的before_count字段；具体判据沿用冻结规则",
          "types": [
            "string",
            "integer",
            "number",
            "boolean"
          ],
          "required": false,
