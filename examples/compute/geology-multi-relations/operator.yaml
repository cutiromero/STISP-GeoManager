      "label": "几何与推测交汇点",
      "kind": "vector",
      "file": "intersections.gpkg",
      "required": false,
      "description": "几何与推测交汇点；语义与输入规则版本保持一致，不能作为独立地质真值。",
      "fields": [
        {
          "role": "point_id",
          "description": "几何与推测交汇点的point_id字段；具体判据沿用冻结规则",
          "types": [
            "string",
            "integer",
            "number",
            "boolean"
          ],
          "required": false,
          "name": "point_id"
        },
        {
          "role": "f1",
          "description": "几何与推测交汇点的f1字段；具体判据沿用冻结规则",
          "types": [
            "string",
            "integer",
            "number",
            "boolean"
          ],
          "required": false,
          "name": "f1"
        },
        {
          "role": "f2",
          "description": "几何与推测交汇点的f2字段；具体判据沿用冻结规则",
          "types": [
            "string",
            "integer",
            "number",
            "boolean"
          ],
          "required": false,
          "name": "f2"
        },
        {
          "role": "type",
          "description": "几何与推测交汇点的type字段；具体判据沿用冻结规则",
          "types": [
            "string",
            "integer",
            "number",
            "boolean"
          ],
          "required": false,
          "name": "type"
        },
        {
          "role": "inferred",
          "description": "几何与推测交汇点的inferred字段；具体判据沿用冻结规则",
          "types": [
            "string",
            "integer",
            "number",
            "boolean"
          ],
          "required": false,
          "name": "inferred"
        },
        {
          "role": "gap_m",
          "description": "几何与推测交汇点的gap_m字段；具体判据沿用冻结规则",
          "types": [
            "string",
            "integer",
            "number",
            "boolean"
          ],
          "required": false,
          "name": "gap_m"
        },
        {
          "role": "angle_deg",
          "description": "几何与推测交汇点的angle_deg字段；具体判据沿用冻结规则",
          "types": [
            "string",
            "integer",
            "number",
            "boolean"
          ],
          "required": false,
          "name": "angle_deg"
        },
        {
          "role": "rule_id",
          "description": "规则标识",
          "types": [
            "string",
            "integer",
            "number",
            "boolean"
          ],
          "required": false,
          "name": "rule_id"
        },
        {
          "role": "rule_version",
          "description": "冻结规则版本",
          "types": [
            "string",
            "integer",
            "number",
            "boolean"
          ],
          "required": false,
          "name": "rule_version"
        },
        {
          "role": "weight",
