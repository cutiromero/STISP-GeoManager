{
  "schemaVersion": 2,
  "identifier": "geology-multi-relations",
  "name": "构造关系重建",
  "version": "1.3.0",
  "description": "构造关系重建。依据显式绑定的试用知识和当前输入真实测量，不读取独立评价材料；修改须逐项批准，保留、待裁定、降权和剔除分别记录。",
  "author": "STISP",
  "runtime": "python-geospatial-v1",
  "agent": {
    "enabled": true
  },
  "qualityReport": {
    "file": "quality.json"
  },
  "inputs": [
    {
      "key": "faults",
      "label": "构造图",
      "kind": "vector",
      "geometryTypes": [
        "LineString",
        "MultiLineString"
      ],
      "description": "构造图；原始来源只读，输出为新派生数据。",
      "fields": [
        {
          "role": "fault_id",
          "description": "稳定构造线标识",
          "types": [
            "string",
            "integer"
          ],
          "required": false,
          "legacyName": "line_id"
        }
      ],
      "crs": {
        "mode": "any"
      }
    },
    {
      "key": "coverage",
      "label": "研究区制图范围",
      "kind": "vector",
      "geometryTypes": [
        "Polygon",
        "MultiPolygon"
      ],
      "description": "研究区制图范围；原始来源只读，输出为新派生数据。",
      "fields": [],
      "crs": {
        "mode": "any"
      }
    },
    {
      "key": "rules",
      "label": "显式启用的试用规则及版本",
      "kind": "table",
      "description": "显式启用的试用规则及版本；原始来源只读，输出为新派生数据。",
      "fields": [
        {
          "role": "rule_id",
          "description": "规则标识",
          "types": [
            "string",
            "integer",
            "number"
          ],
          "required": true,
          "legacyName": "rule_id"
        },
        {
          "role": "rule_version",
          "description": "冻结规则版本",
          "types": [
            "string",
            "integer",
            "number"
          ],
          "required": true,
          "legacyName": "rule_version"
        },
        {
          "role": "knowledge_id",
          "description": "知识条目标识",
          "types": [
            "string",
            "integer",
            "number"
          ],
          "required": true,
          "legacyName": "knowledge_id"
        },
        {
          "role": "knowledge_revision",
          "description": "知识修订号",
          "types": [
            "string",
            "integer",
            "number"
          ],
          "required": true,
          "legacyName": "knowledge_revision"
        },
        {
          "role": "params_json",
          "description": "规则参数JSON",
          "types": [
            "string",
            "integer",
            "number"
          ],
          "required": true,
          "legacyName": "params_json"
        },
        {
          "role": "rule_json",
          "description": "规则正文JSON",
          "types": [
            "string",
            "integer",
            "number"
          ],
          "required": true,
          "legacyName": "rule_json"
        },
        {
          "role": "units_json",
          "description": "地质单元字典JSON",
          "types": [
            "string",
            "integer",
            "number"
          ],
          "required": false,
          "legacyName": "units_json"
        },
        {
          "role": "aliases_json",
          "description": "地质单元同义词JSON",
          "types": [
            "string",
            "integer",
            "number"
          ],
          "required": false,
          "legacyName": "aliases_json"
        }
      ],
      "crs": {
        "mode": "any"
      }
    },
    {
      "key": "before_faults",
      "label": "处理前构造图（比较用）",
      "kind": "vector",
      "geometryTypes": [
        "LineString",
        "MultiLineString"
      ],
      "required": false,
      "description": "处理前构造图（比较用）；原始来源只读，输出为新派生数据。",
      "fields": [
        {
          "role": "fault_id",
          "description": "稳定构造线标识",
          "types": [
            "string",
            "integer"
          ],
          "required": false,
          "legacyName": "line_id"
        }
      ],
      "crs": {
        "mode": "any"
      }
    }
  ],
  "parameters": [
    {
      "key": "working_epsg",
      "label": "米制工作投影EPSG",
      "type": "integer",
      "default": 32646,
      "min": 1,
      "max": 999999,
      "help": "米制工作投影EPSG；按实际来源和任务目标设置，取值须满足声明范围。",
      "agent": {
        "adjustable": false,
        "advice": "仅在来源证据和任务约束允许时按范围调整；不得为减少报错而放宽科学判据或人工批准。"
      }
    },
    {
      "key": "segment",
      "label": "本次检查范围",
      "type": "enum",
      "default": "all",
      "choices": [
        "all",
        "lithology",
        "structure",
        "alteration"
      ],
      "help": "本次检查范围；按实际来源和任务目标设置，取值须满足声明范围。",
      "agent": {
        "adjustable": true,
        "advice": "仅在来源证据和任务约束允许时按范围调整；不得为减少报错而放宽科学判据或人工批准。"
      }
    },
    {
      "key": "grid_resolution_m",
      "label": "综合分析网格（米）",
      "type": "number",
      "default": 100,
      "min": 10,
      "max": 1000,
      "help": "综合分析网格（米）；按实际来源和任务目标设置，取值须满足声明范围。",
      "agent": {
        "adjustable": true,
        "advice": "仅在来源证据和任务约束允许时按范围调整；不得为减少报错而放宽科学判据或人工批准。"
      }
    },
    {
      "key": "min_zone_area_m2",
      "label": "远景区最小面积（平方米）",
      "type": "number",
      "default": 200000,
      "min": 0,
      "max": 100000000,
      "help": "远景区最小面积（平方米）；按实际来源和任务目标设置，取值须满足声明范围。",
      "agent": {
        "adjustable": true,
        "advice": "仅在来源证据和任务约束允许时按范围调整；不得为减少报错而放宽科学判据或人工批准。"
      }
    }
  ],
  "outputs": [
    {
      "key": "before_intersections",
      "label": "处理前几何与推测交汇点",
      "kind": "vector",
      "file": "before_intersections.gpkg",
      "required": false,
      "description": "处理前几何与推测交汇点；语义与输入规则版本保持一致，不能作为独立地质真值。",
      "fields": [],
      "final": true
    },
    {
