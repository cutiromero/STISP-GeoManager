{
  "schemaVersion": 1,
  "identifier": "geology-multi-relations",
  "name": "构造关系重建",
  "version": "1.2.0",
  "description": "构造关系重建。依据显式绑定的试用知识和当前输入真实测量，不读取独立评价材料；修改须逐项批准，保留、待裁定、降权和剔除分别记录。",
  "author": "STISP",
  "runtime": "python-geospatial-v1",
  "agent": {
    "enabled": true
  },
  "qualityReport": {
    "file": "quality.json"
  },
  "inputs": [
    {
      "key": "faults",
      "label": "构造图",
      "kind": "vector",
      "geometryTypes": [
        "LineString",
        "MultiLineString"
      ]
    },
    {
      "key": "coverage",
      "label": "研究区制图范围",
      "kind": "vector",
      "geometryTypes": [
        "Polygon",
        "MultiPolygon"
      ]
    },
    {
      "key": "rules",
      "label": "显式启用的试用规则及版本",
      "kind": "table"
    },
    {
      "key": "before_faults",
      "label": "处理前构造图（比较用）",
      "kind": "vector",
      "geometryTypes": [
        "LineString",
        "MultiLineString"
      ],
      "required": false
    }
  ],
  "parameters": [
    {
      "key": "working_epsg",
      "label": "米制工作投影EPSG",
      "type": "integer",
      "default": 32646,
      "min": 1,
      "max": 999999
    },
    {
      "key": "segment",
      "label": "本次检查范围",
      "type": "enum",
      "default": "all",
      "choices": [
        "all",
        "lithology",
        "structure",
        "alteration"
      ]
    },
    {
      "key": "grid_resolution_m",
      "label": "综合分析网格（米）",
      "type": "number",
      "default": 100,
      "min": 10,
      "max": 1000
    },
    {
      "key": "min_zone_area_m2",
      "label": "远景区最小面积（平方米）",
      "type": "number",
      "default": 200000,
      "min": 0,
      "max": 100000000
    }
  ],
  "outputs": [
    {
      "key": "before_intersections",
      "label": "处理前几何与推测交汇点",
      "kind": "vector",
      "file": "before_intersections.gpkg",
      "required": false
    },
    {
      "key": "intersections",
      "label": "几何与推测交汇点",
      "kind": "vector",
      "file": "intersections.gpkg",
      "required": false
    },
    {
      "key": "statistics",
      "label": "交汇关系统计",
      "kind": "table",
      "file": "statistics.csv"
    }
  ],
  "timeoutSeconds": 900,
  "deterministic": true
}
