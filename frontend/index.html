<!doctype html>
<html lang="zh-CN">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f6b55" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api.mapbox.com https://tiles.openfreemap.org https://*.tile.openstreetmap.org https://*.tianditu.gov.cn https://images.unsplash.com; font-src 'self' data:; connect-src 'self' https://api.mapbox.com https://tiles.openfreemap.org https://*.tile.openstreetmap.org https://*.tianditu.gov.cn; worker-src 'self' blob:; frame-src 'self' blob:; media-src 'none'; manifest-src 'self'"

    <link rel="icon" type="image/svg+xml" href="/src/assets/stisp-logo.svg" />

    <title>时空智能服务平台</title>

  <body>
    <div id="root">
      <div
        id="startup-notice"
        style="
          max-width: 640px;
          margin: 12vh auto;
          padding: 24px;
          color: #244664;
          font-family: sans-serif;
          line-height: 1.8;
        "
      >
        <strong>时空智能服务平台正在加载</strong>
        <p>
          若长时间停留在这里，请检查网络，并使用较新版本的 Chrome 或 Edge
          浏览器。
        </p>
        <noscript
          >浏览器已禁用 JavaScript，请允许本站运行 JavaScript 后刷新。</noscript
        >
      </div>
    </div>
    <script defer src="%BASE_URL%browser-check.js"></script>
    <script type="module" src="/src/main.tsx"></script>
