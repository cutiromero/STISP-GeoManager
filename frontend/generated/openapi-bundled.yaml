  /api/catalog/resources/:
    get:
      tags:
        - 数据目录
      summary: 获取数据资源列表
      description: 支持按甲方业务分类、资源形态、空间属性和兼容业务标签筛选。categoryCode 是权威业务主分类，父节点默认包含全部后代；dataType/spatialClass 只描述存储和展示能力，domainType 为兼容标签。需要 `core.browse_data`。
      operationId: getResources
      security:
        - sessionAuth: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: 按名称模糊搜索
        - name: dataType
          in: query
          schema:
            type: string
            enum:
              - vector
              - raster
              - gene
              - table
              - document
              - image
          description: 数据类型筛选
        - name: spatialClass
          in: query
          schema:
            $ref: '#/components/schemas/ResourceSpatialClass'
          description: 按资源是否可直接参与地图空间展示筛选；spatial 仅返回 vector/raster，non_spatial 返回 table/gene/document/image；无效编码返回 400 ErrorResponse
        - name: domainType
          in: query
          schema:
            $ref: '#/components/schemas/DataDomainType'
          description: 按平台确认的业务数据类型筛选，例如种质数据、个体数据、遥感影像数据、分子数据、基因组数据或其他类型；无效编码返回 400 ErrorResponse
        - name: category
          in: query
          schema:
            type: string
          deprecated: true
          description: 兼容分类代码参数；推荐使用 categoryCode
        - name: categoryCode
          in: query
          schema:
            type: string
          description: 权威业务分类代码；一级节点自动包含全部后代，叶节点精确筛选
        - name: classificationStatus
          in: query
          schema:
            type: string
            enum:
              - classified
              - pending
          description: 按已分类或待归类状态筛选
        - name: source
          in: query
          schema:
            type: string
          description: 数据来源模糊匹配
        - name: provider
          in: query
          schema:
            type: string
          description: 提供者模糊匹配
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
          description: 数据日期起始
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
          description: 数据日期截止
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceListResponse'
        '400':
          description: 请求错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: 无效的空间数据分类
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
