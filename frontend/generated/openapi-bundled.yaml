          description: 字段画像
          items:
            $ref: '#/components/schemas/NonGeoFieldProfile'
        categoricalDistributions:
          type: array
          description: 分类字段 Top 12 分布
          items:
            $ref: '#/components/schemas/NonGeoCategoricalDistribution'
        numericDistributions:
          type: array
          description: 数值字段描述统计与直方图
          items:
            $ref: '#/components/schemas/NonGeoNumericDistribution'
        correlation:
          oneOf:
            - $ref: '#/components/schemas/NonGeoCorrelation'
            - type: 'null'
          description: 至少存在两个数值字段时返回相关系数矩阵，否则为 null
        tablePreview:
          $ref: '#/components/schemas/NonGeoTableQueryResponse'
        insights:
          type: array
          description: 根据真实数据生成的分析口径与摘要提示
          items:
            type: string
    ResourceVisualizationSummaryResponse:
      type: object
      required:
        - resource
        - domainType
        - generatedAt
        - source
        - profile
        - categoryStats
        - numericStats
        - spatialSummary
        - qualityIssues
        - recommendedCharts
        - recommendedSymbolizations
        - monitorPreview
      properties:
        resource:
          $ref: '#/components/schemas/DataResource'
        domainType:
          $ref: '#/components/schemas/DataDomainType'
        generatedAt:
          type: string
          format: date-time
          description: 聚合摘要生成时间。
        source:
          type: string
          enum:
            - backend_aggregate
            - raster_metadata
            - profile_only
          description: 摘要生成来源；矢量为后端聚合，栅格为元数据推导，无法读取明细时为 profile_only。
        profile:
          $ref: '#/components/schemas/VisualizationResourceProfile'
        categoryStats:
          type: array
          description: 可用于构成图、TopN 排名和分类筛选的字段统计。
          items:
            $ref: '#/components/schemas/VisualizationCategoryStat'
        numericStats:
          type: array
          description: 可用于直方图、箱线图、雷达图和连续分级的数值字段统计。
          items:
            $ref: '#/components/schemas/VisualizationNumericStat'
        spatialSummary:
          $ref: '#/components/schemas/VisualizationSpatialSummary'
        qualityIssues:
          type: array
          description: 数据质量监测问题清单。
          items:
            $ref: '#/components/schemas/VisualizationQualityIssue'
        recommendedCharts:
          type: array
          description: 后端根据业务类型和字段结构推荐的图表卡片。
          items:
            $ref: '#/components/schemas/VisualizationChartRecommendation'
        recommendedSymbolizations:
          type: array
          description: 后端根据业务类型、字段命中结果和字段统计推荐的矢量符号化模板。前端可直接预览并应用其中的 `symbolization`，保存仍沿用现有自定义符号化权限。
          items:
            $ref: '#/components/schemas/RecommendedSymbolizationTemplate'
        monitorPreview:
          $ref: '#/components/schemas/VisualizationMonitorPreview'
    RecommendedSymbolizationTemplate:
      type: object
      required:
        - templateId
        - name
        - description
        - businessType
        - rendererType
        - primaryField
        - matchedFields
        - matchStatus
        - isPrimary
        - priority
        - symbolization
        - warnings
      properties:
        templateId:
          type: string
          description: 推荐模板稳定 ID，格式建议为 `{businessType}.{fieldOrTheme}.{renderer}.v{version}`。
        name:
          type: string
          description: 推荐模板中文名称。
        description:
          type: string
          description: 推荐模板适用场景说明。
        businessType:
          $ref: '#/components/schemas/DataDomainType'
        rendererType:
          type: string
          enum:
            - single
            - uniqueValue
            - graduated
          description: 模板使用的矢量渲染器类型。
        primaryField:
          type:
            - string
            - 'null'
          description: 模板主要命中的字段；未命中任何字段时为 null。
        matchedFields:
          type: array
          description: 本模板命中的字段列表，包含主字段和参与备用说明的字段。
          items:
            type: string
        matchStatus:
          type: string
          enum:
            - matched
            - fallback
            - unavailable
          description: 字段命中状态；matched 表示主字段命中，fallback 表示使用备用字段，unavailable 表示模板仅可作为提示但当前不可直接应用。
        isPrimary:
          type: boolean
          description: 是否为该业务类型的默认首选推荐方案。
        priority:
          type: integer
          description: 推荐排序值，数值越小越靠前。
        symbolization:
          $ref: '#/components/schemas/VectorSymbolization'
        warnings:
          type: array
          description: 字段缺失、别名归一化、类别截断或图标降级等提示。
          items:
            type: string
