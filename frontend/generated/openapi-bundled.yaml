          description: 资源类型，如胡杨古树特异资源、胡杨群体种质资源、核心种质资源。
        sex:
          type: string
          description: 性别或雌雄信息。
        isCore:
          type: boolean
          description: 是否属于核心种质资源。
        storageStatus:
          type: string
          description: 保存状态。
        sourceResourceId:
          type:
            - integer
            - 'null'
          description: 来源 DataResource ID。
        createdAt:
          type: string
          format: date-time
          description: 创建时间。
        updatedAt:
          type: string
          format: date-time
          description: 更新时间。
    GermplasmAccessionListResponse:
      type: object
      required:
        - items
        - total
        - current
        - pageSize
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GermplasmAccession'
        total:
