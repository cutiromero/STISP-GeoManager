        id:
          type: integer
          description: 工程 ID
        kind:
          type: string
          enum:
            - project
          description: 场景类型，固定为工程
        name:
          type: string
          description: 工程或专题名称
        description:
          type: string
          description: 工程或专题说明
        snapshot:
          $ref: '#/components/schemas/WorkspaceSceneSnapshot'
        owner:
          $ref: '#/components/schemas/WorkspaceSceneOwner'
        accessGroups:
          type: array
