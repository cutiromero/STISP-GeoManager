        - chartType
        - title
        - description
        - fields
      properties:
        chartType:
          type: string
          enum:
            - gauge
            - rank_bar
            - stacked_bar
            - donut
            - histogram
            - boxplot
            - scatter
            - radar
            - heatmap
            - treemap
            - sunburst
            - parallel
            - raster_preview
            - quality_list
          description: 推荐图表类型。
        title:
          type: string
          description: 图表标题。
        description:
          type: string
          description: 适用说明。
        fields:
          type: array
          description: 推荐使用字段。
          items:
            type: string
    VisualizationMonitorPreview:
      type: object
      required:
        - title
        - status
        - items
      properties:
        title:
          type: string
          description: 监测占位标题。
        status:
          type: string
          enum:
            - planned
            - partial
            - ready
          description: 监测能力状态。
        items:
          type: array
          items:
            $ref: '#/components/schemas/VisualizationMonitorItem'
    VisualizationMonitorItem:
      type: object
      required:
        - label
        - status
        - description
      properties:
        label:
          type: string
          description: 监测能力名称。
        status:
          type: string
          enum:
            - planned
            - partial
            - ready
          description: 能力状态。
        description:
          type: string
          description: 能力说明。
    QueryRequest:
      type: object
      required:
        - attributeFilters
        - spatialFilter
        - limit
      properties:
        attributeFilters:
          type: array
          description: 属性过滤条件
          items:
            $ref: '#/components/schemas/AttributeFilter'
        spatialFilter:
          oneOf:
            - $ref: '#/components/schemas/SpatialFilter'
            - type: 'null'
          description: 空间过滤条件；不启用空间过滤时为 null
        limit:
          type: integer
          default: 30000
          description: 返回结果上限
    AttributeFilter:
      type: object
      required:
        - field
        - operator
        - value
      properties:
        field:
          type: string
          description: 字段名
        operator:
          type: string
          enum:
            - contains
            - eq
            - ne
            - gt
            - gte
            - lt
            - lte
            - between
          description: 过滤操作符
        value:
          type: string
          description: 过滤值
        valueTo:
          type: string
          description: between 操作符时使用的结束值
    SpatialFilter:
      type: object
      required:
        - mode
        - geometry
      properties:
        mode:
          type: string
          enum:
            - rectangle
            - circle
            - ellipse
            - polygon
          description: 空间过滤绘制模式
        geometry:
          $ref: '#/components/schemas/GeoJSONGeometry'
    QueryResponse:
      type: object
      required:
        - resourceId
        - resourceName
        - totalCount
        - returnedCount
        - limit
        - limitExceeded
        - bounds
        - elapsedMs
        - fields
        - geojson
        - warnings
      properties:
        resourceId:
          type: integer
          description: 查询资源 ID
        resourceName:
          type: string
          description: 查询资源名称
        totalCount:
          type: integer
          description: 过滤后的总数
        returnedCount:
          type: integer
          description: 本次返回数量
        limit:
          type: integer
          description: 返回上限
        limitExceeded:
          type: boolean
          description: 命中数量是否超过返回上限；为 true 时 geojson 仅包含前 limit 条有效结果。
        bounds:
          type: array
          minItems: 0
          maxItems: 4
          description: 本次返回有效结果的 WGS84 边界 [minLng, minLat, maxLng, maxLat]；无有效返回结果时为空数组。
          items:
            type: number
        elapsedMs:
          type: integer
          minimum: 0
          description: 后端执行本次资源查询耗时，单位毫秒。
        fields:
          type: array
          description: 查询结果字段
          items:
            $ref: '#/components/schemas/FieldInfo'
        geojson:
          $ref: '#/components/schemas/GeoJSONFeatureCollection'
        warnings:
          type: array
          description: 地理坐标校验警告
          items:
            $ref: '#/components/schemas/ValidationWarning'
    ExportRequest:
      type: object
      required:
        - reproject
        - clip
        - items
      properties:
        epsg:
          type:
            - integer
            - 'null'
          default: 4326
          description: 目标 EPSG，reproject 为 true 时使用
        reproject:
          type: boolean
          default: true
          description: 是否重投影导出
        clip:
          type: boolean
          default: false
          description: 是否按空间范围裁切
        clipGeometry:
          oneOf:
            - $ref: '#/components/schemas/GeoJSONGeometry'
            - type: 'null'
          description: 裁切 GeoJSON 几何
        format:
          type: string
          enum:
            - geojson
            - shapefile
          default: geojson
          description: 矢量图层导出格式；选择 shapefile 时后端将 Shapefile 组件文件写入目录后压缩为 ZIP
        items:
          type: array
          description: 待导出图层
          items:
            $ref: '#/components/schemas/ExportItem'
    ExportItem:
      type: object
      required:
        - layerType
        - name
      properties:
        layerType:
          type: string
          enum:
            - vector
            - raster
          description: 图层类型
        name:
          type: string
          description: 导出图层名称
        resourceId:
          type:
            - integer
            - 'null'
          description: 数据资源 ID
        geojson:
          oneOf:
            - $ref: '#/components/schemas/GeoJSONFeatureCollection'
            - type: 'null'
          description: 矢量图层查询结果
        datasetId:
          type:
            - integer
            - 'null'
          description: 栅格数据集 ID
        sourceCrs:
          oneOf:
            - type: string
            - type: integer
            - type: 'null'
          description: 源坐标系统
    LayerListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          description: 可加载图层列表
          items:
            $ref: '#/components/schemas/MapLayer'
    SearchResponse:
      type: object
      required:
        - resources
      properties:
        resources:
          type: array
          description: 匹配的数据资源
          items:
            $ref: '#/components/schemas/DataResource'
    RasterDatasetListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          description: 栅格数据集列表
          items:
            $ref: '#/components/schemas/RasterDataset'
    RasterImportRequest:
      type: object
      required:
        - sourcePath
      properties:
        sourcePath:
          type: string
          description: 源文件相对路径（相对于科研数据根目录）
        name:
          type: string
          description: 前端显示的数据集名称；为空时默认取源文件名，不包含后端后台唯一存储文件名
        async:
          type: boolean
          default: true
          description: 是否异步执行
    RasterImportUploadRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
          description: 兼容旧调用的单个栅格文件。新前端应使用 files。
        files:
          type: array
          minItems: 1
          description: 栅格主文件及配套文件，支持 GeoTIFF/COG、IMG、VRT 数据包和 ENVI DAT/BSQ/BIL/BIP + HDR。
          items:
            type: string
            format: binary
        name:
          type: string
          description: 前端显示的数据集名称；为空时默认取上传文件名，不展示后端保存到 uploaded/ 目录的唯一存储文件名
        payload:
          type: string
          description: JSON 字符串，结构遵循 RasterImportCommitRequest；省略时使用兼容默认值。
    RasterSourceAsset:
      type: object
      required:
        - name
        - size
        - role
      properties:
        name:
          type: string
          description: 数据包内文件名
        size:
          type: integer
          minimum: 0
          description: 文件大小，单位字节
        role:
          type: string
          enum:
            - primary
            - header
            - auxiliary
            - referenced
          description: 文件在栅格数据包中的作用
    RasterImportPreviewResponse:
      type: object
      required:
        - primaryFileName
        - sourceFormat
        - files
        - metadata
        - bounds4326
        - defaultRules
        - suggestedName
        - rasterKind
        - resampling
        - warnings
      properties:
        primaryFileName:
          type: string
          description: 识别到的主栅格文件名
        sourceFormat:
          type: string
          description: GDAL 驱动简称，例如 GTiff、ENVI、HFA 或 VRT
        files:
          type: array
          description: 数据包文件及角色
          items:
            $ref: '#/components/schemas/RasterSourceAsset'
        metadata:
          $ref: '#/components/schemas/RasterMetadata'
        bounds4326:
          type: array
          description: WGS84 空间范围 [west, south, east, north]
          items:
            type: number
        defaultRules:
          $ref: '#/components/schemas/RasterSymbolizationRules'
        suggestedName:
          type: string
          description: 建议的资源显示名称
        rasterKind:
          type: string
          enum:
            - imagery
            - continuous
            - categorical
          description: 根据波段数量和数据类型推断的栅格语义
        resampling:
          type: string
          enum:
            - nearest
            - bilinear
            - cubic
          description: 建议的预处理重采样方式
        warnings:
          type: array
          description: 非阻断预检提示，例如缺少波段语义或无法识别 EPSG
          items:
            type: string
    RasterImportCommitRequest:
      type: object
      required:
        - primaryFileName
        - name
        - rasterKind
        - resampling
        - defaultRules
        - accessGroupIds
      properties:
        primaryFileName:
          type: string
          description: 预检确认的主栅格文件名
        name:
          type: string
          description: 数据资源、栅格数据集和地图图层的显示名称
        rasterKind:
          type: string
          enum:
            - imagery
            - continuous
            - categorical
          description: 栅格数据语义
        resampling:
          type: string
          enum:
            - nearest
            - bilinear
            - cubic
          description: 生成 EPSG:3857 展示 COG 时使用的重采样方式
        defaultRules:
          $ref: '#/components/schemas/RasterSymbolizationRules'
        accessGroupIds:
          type: array
          description: 除上传者本人和超级管理员外可访问该数据的用户组 ID
          items:
            type: integer
        categoryCode:
          type: string
          description: 甲方四大类体系中的业务主分类叶节点编码；V1 新客户端提交，旧客户端兼容期可省略
    RasterRenderRequest:
      type: object
      required:
        - layerId
      properties:
        layerId:
          type: integer
          description: 栅格图层 ID
        rulesMode:
          type: string
          enum:
            - default
            - custom
          default: default
          description: 符号化规则模式
        rules:
          oneOf:
            - $ref: '#/components/schemas/RasterSymbolizationRules'
            - type: 'null'
          description: 自定义符号化规则
    RasterRenderAsyncRequest:
      type: object
      properties:
        layerId:
          type:
            - integer
            - 'null'
          description: 栅格图层 ID
        datasetId:
          type:
            - integer
            - 'null'
          description: 栅格数据集 ID
        rulesMode:
          type: string
          enum:
            - default
            - custom
          default: default
          description: 符号化规则模式
        rules:
          oneOf:
            - $ref: '#/components/schemas/RasterSymbolizationRules'
            - type: 'null'
          description: 自定义符号化规则
    RasterRenderResult:
      type: object
      required:
        - delivery
        - datasetId
        - layerId
        - styleHash
        - tileUrl
        - minZoom
        - maxZoom
        - tileSampling
        - status
        - bounds3857
        - bounds4326
        - imageCoordinates
        - rules
      properties:
        delivery:
          type: string
          enum:
            - xyz
          description: 栅格交付方式
        datasetId:
          type: integer
          description: 栅格数据集 ID
        layerId:
          type:
            - integer
            - 'null'
          description: 关联图层 ID
        styleHash:
          type: string
          description: 符号化样式哈希
        tileUrl:
          type: string
          description: XYZ 瓦片 URL 模板
        minZoom:
          type: integer
          minimum: 0
          maximum: 22
          description: XYZ 瓦片源可用的最小级别；当前统一为 0
        maxZoom:
          type: integer
          minimum: 0
          maximum: 22
          description: 数据原生分辨率对应的最大瓦片级别；客户端超过该级别时只放大该级瓦片，不继续请求更高层级
        tileSampling:
          type: string
          enum:
            - nearest
            - linear
          description: 客户端纹理采样方式；分类栅格固定为 nearest，连续栅格与影像为 linear
        status:
          type: string
          enum:
            - ready
          description: 渲染结果状态
        bounds3857:
          type: array
          description: EPSG:3857 边界
          items:
            type: number
        bounds4326:
          type: array
          description: WGS84 边界
          items:
            type: number
        imageCoordinates:
          type: array
          description: WGS84 图像角点坐标
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: number
        rules:
          $ref: '#/components/schemas/RasterSymbolizationRules'
    UniqueValuesRequest:
      type: object
      required:
        - datasetId
      properties:
        datasetId:
          type: integer
          description: 栅格数据集 ID
        band:
          type: integer
          default: 1
          description: 1-based 波段编号
    UniqueValuesResponse:
      type: object
      required:
        - band
        - items
      properties:
        band:
          type: integer
          description: 1-based 波段编号
        items:
          type: array
          description: 唯一值分类项
          items:
            type: object
            required:
              - value
              - color
              - label
            properties:
              value:
                type: number
                description: 栅格像元值
              color:
                type: string
                description: 分类颜色
              label:
                type: string
                description: 分类标签
    GeoJSONGeometry:
      type: object
      required:
        - type
        - coordinates
      properties:
        type:
          type: string
          enum:
            - Point
            - LineString
            - Polygon
            - MultiPoint
            - MultiLineString
            - MultiPolygon
          description: GeoJSON 几何类型
        coordinates:
          description: GeoJSON 坐标数组
    ValidationWarning:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: 警告代码，如 missing_geometry、invalid_longitude、coordinate_uncertainty
        count:
          type: integer
          description: 受影响的记录数
        message:
          type: string
          description: 警告描述
        minMeters:
          type: number
          description: 坐标不确定性最小误差，单位米
        maxMeters:
          type: number
          description: 坐标不确定性最大误差，单位米
        ratio:
          type: number
          description: 坐标不确定性误差倍率
    GeoJSONFeatureCollection:
      type: object
      required:
        - type
        - features
      properties:
        type:
          type: string
          enum:
            - FeatureCollection
          description: GeoJSON FeatureCollection 类型
        features:
          type: array
          description: GeoJSON 要素列表
          items:
            $ref: '#/components/schemas/GeoJSONFeature'
    GeoJSONFeature:
      type: object
      required:
        - type
        - geometry
        - properties
      properties:
        id:
          oneOf:
            - type: string
            - type: integer
          description: GeoJSON 要素 ID
        type:
          type: string
          enum:
            - Feature
          description: GeoJSON Feature 类型
        geometry:
          $ref: '#/components/schemas/GeoJSONGeometry'
        properties:
          type: object
          additionalProperties: true
          description: GeoJSON 属性对象
