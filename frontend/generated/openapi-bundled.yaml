        accessGroupIds:
          type: array
          minItems: 1
          description: publish 时必填的发布可访问角色 ID
          items:
            type: integer
    ResultArtifactDeleteResponse:
      type: object
      required:
        - deleted
        - id
        - detail
      properties:
        deleted:
          type: boolean
          const: true
          description: 是否已删除
        id:
          type: integer
          description: 已删除成果文件 ID
        detail:
          type: string
          description: 删除结果说明
    ResultArtifact:
      type: object
      required:
        - id
        - name
        - description
        - sourceType
        - resultType
        - status
        - category
        - categoryPath
        - provider
        - fileName
        - fileFormat
        - sizeBytes
        - previewUrl
        - downloadUrl
        - owner
        - accessGroups
        - canPreview
        - canDownload
        - canPublish
        - canUnpublish
        - canDelete
        - publishedAt
        - publishedBy
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          description: 成果文件 ID
        name:
          type: string
          description: 成果显示名称
