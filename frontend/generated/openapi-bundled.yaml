          maxItems: 6
          description: 参与相关性计算的前六个数值字段
          items:
            type: string
        values:
          type: array
          description: 与 fields 顺序一致的相关系数矩阵
          items:
            type: array
            items:
              type: number
              minimum: -1
              maximum: 1
    NonGeoAnalyticsResponse:
      type: object
      required:
        - resource
        - summary
        - fields
        - categoricalDistributions
        - numericDistributions
        - correlation
        - tablePreview
        - insights
