  /api/catalog/results/:
    get:
      tags:
        - 成果展示
      summary: 获取成果文件列表
      description: 返回当前用户创建的成果文件、管理员可管理的成果文件，以及发布范围包含当前用户角色的已发布成果。普通用户不会看到他人的草稿。需要 `catalog.view_resultartifact`。
      operationId: listResultArtifacts
      security:
        - sessionAuth: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: 按成果名称、说明、提供单位或原文件名模糊检索
        - name: sourceType
          in: query
          schema:
            $ref: '#/components/schemas/ResultArtifactSourceType'
          description: 按平台分析成果或直接导入成果筛选
        - name: resultType
          in: query
          schema:
            $ref: '#/components/schemas/ResultArtifactType'
          description: 按成果形态筛选
        - name: categoryCode
          in: query
          schema:
            type: string
          description: 按四大权威业务分类筛选；一级节点自动包含全部后代
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultArtifactListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - 成果展示
      summary: 登记并上传成果文件
      description: |
        上传 PNG、JPG/JPEG、PDF、CSV 或 XLSX 成果文件并直接发布。需要同时具备 `catalog.view_resultartifact`、`catalog.add_resultartifact` 和 `catalog.publish_resultartifact`，且至少选择一个可访问角色；导入环节不再创建草稿。
        后端不信任客户端 Content-Type，而是校验真实内容并写入可信 MIME：PNG/JPG/JPEG 由 Pillow 解码且扩展名必须匹配实际格式；PDF 必须同时包含 `%PDF-` 文件头和尾部 `%%EOF`；CSV 必须非空、无 NUL 且编码为 UTF-8/UTF-8-SIG 或 GB18030；XLSX 必须是结构完整且受条目数量、解压规模限制的工作簿 ZIP。
      operationId: createResultArtifact
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - payload
              properties:
                file:
                  type: string
                  format: binary
                  description: PNG、JPG/JPEG、PDF、CSV 或 XLSX 成果文件；文件扩展名必须与后端识别的真实内容格式一致
                payload:
                  type: string
                  description: JSON 字符串，结构为 ResultArtifactCreatePayload
                  example: '{"name":"塔里木河胡杨分布分析报告","description":"基于平台统计分析形成的成果报告","sourceType":"analysis","resultType":"report","categoryCode":"thematic_population","provider":"塔里木大学","accessGroupIds":[3]}'
      responses:
        '201':
          description: 成果登记成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultArtifact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/catalog/results/{resultId}/:
    get:
      tags:
        - 成果管理
