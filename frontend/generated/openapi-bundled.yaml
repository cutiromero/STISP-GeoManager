        SQLite 后台表直接分页读取；CSV、TSV、XLS、XLSX、FASTA、FASTQ、VCF、GFF/GFF3、GenBank 文件可在线分析。
        直接文件大小上限为系统上传限制与 64 MB 中的较小值。
