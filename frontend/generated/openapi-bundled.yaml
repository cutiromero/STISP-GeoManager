        name:
          type: string
          description: 工作表名称
        rowCount:
          type: integer
          description: 工作表总行数
        columnCount:
          type: integer
          description: 工作表字段数
        isGeographic:
          type: boolean
          description: 是否自动识别到可空间化经纬度列
        longitudeColumn:
          type:
            - string
            - 'null'
          description: 自动识别的经度列
        latitudeColumn:
          type:
            - string
            - 'null'
          description: 自动识别的纬度列
    ImportDetectedInfo:
      type: object
      required:
        - isGeographic
        - longitudeColumn
        - latitudeColumn
        - coordinateStats
        - validationIssues
