openapi: 3.1.0
info:
  title: 干旱区胡杨林生态智慧监测平台 API
  description: |
    干旱区胡杨林生态智慧监测平台后端接口文档。

    ## 认证方式
    本平台使用 Django Session 认证机制：
    1. `GET /api/auth/csrf/` 获取 CSRF Token
    2. `POST /api/auth/login/` 登录建立 Session
    3. 后续请求携带 `sessionid` Cookie 和 `X-CSRFToken` 请求头

    ## 权限体系
    - **功能权限**：30 余项细粒度功能权限，通过用户组分配，按后台权限、日志权限、概览权限、数据权限、人员权限分组管理
    - **数据访问权限**：基于 `access_groups` 的数据隔离

    ## 错误处理
    所有错误响应包含 `detail` 字段描述错误原因。
    API 接口不会返回登录页 HTML：未认证请求返回 JSON `401`，CSRF 校验失败返回 JSON `403`。
  version: 0.1.0
  contact:
    name: API Support
    email: support@huyang.example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: /
    description: 平台同源入口（浏览器与默认 SDK）
  - url: http://localhost:8000
    description: 后端本地直连开发环境
  - url: https://api.huyang.example.com
    description: 生产环境
tags:
  - name: 公共接口
    description: 无需认证的公共接口
  - name: 认证接口
    description: 用户认证相关接口
  - name: 数据目录
    description: 数据资源管理接口
  - name: 图层
    description: 地图图层接口
  - name: 搜索
    description: 全局搜索接口
  - name: 栅格数据
    description: 栅格数据管理接口
  - name: 异步任务
    description: 异步任务状态查询接口
  - name: 管理后台
    description: Ant Design Pro 管理后台用户、用户组、权限偏好和用户可配置设置接口
paths:
  /api/bootstrap/:
    get:
      tags:
        - 公共接口
      summary: 获取系统启动配置
      description: 获取前端应用初始化所需的全局配置信息
      operationId: getBootstrap
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/login/overview/:
    get:
      tags:
        - 公共接口
      summary: 获取登录页平台概览
      description: |
        返回登录页首屏需要公开展示的平台品牌、数据统计、能力标签、服务状态和版本信息。
        该接口用于替换前端登录页中的静态展示数据，便于前后端分离开发时统一统计口径。
        接口无需登录，但不得返回敏感路径、内部配置、具体用户、权限组、服务器资源明细或未公开数据清单。
      operationId: getLoginOverview
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginOverviewResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/health/:
    get:
      tags:
        - 公共接口
      summary: 健康检查
      operationId: getHealth
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/map/thumbnail-tiles/{z}/{x}/{y}.png:
    get:
      tags:
        - 公共接口
      summary: 获取地图缩略图同源瓦片
      description: |
        返回右侧当前视角平面缩略图使用的底图瓦片。浏览器只请求平台同源地址，
        由服务器按当前 application.map 配置代理 Mapbox 或 OSM 瓦片并缓存到应用数据目录。
        成功瓦片会缓存到应用数据目录，缓存命中时按图片文件头保留真实 MIME 类型。
        当外部瓦片源暂时不可达且本地无缓存时，服务器返回本地生成的 Web Mercator 2D 世界地图瓦片，
        保证客户端不会因为第三方瓦片域名访问失败而显示黑屏或前端内置兜底图。
      operationId: getMapThumbnailTile
      security: []
      parameters:
        - name: z
          in: path
          required: true
          description: Web Mercator 瓦片层级，范围 0-12。
          schema:
            type: integer
            minimum: 0
            maximum: 12
        - name: x
          in: path
          required: true
          description: Web Mercator 瓦片 X 坐标，必须在指定层级有效范围内。
          schema:
            type: integer
            minimum: 0
        - name: 'y'
          in: path
          required: true
          description: Web Mercator 瓦片 Y 坐标，必须在指定层级有效范围内。
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: 成功返回图片瓦片。
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/avif:
              schema:
                type: string
                format: binary
            image/svg+xml:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/auth/csrf/:
    get:
      tags:
        - 认证接口
      summary: 获取 CSRF Cookie
      description: 设置 csrftoken Cookie，后续所有非 GET 请求需读取此 Cookie 值
      operationId: getCsrfCookie
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/auth/login/:
    post:
      tags:
        - 认证接口
      summary: 用户登录
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/auth/guest-login/:
    post:
      tags:
        - 认证接口
      summary: 游客登录
      description: |
        使用系统维护的专用 `guest` 账号建立游客会话。游客账号不可使用密码登录，只归属 `游客` 用户组；默认仅具备公开数据浏览、查询、图层加载和共享成果查看权限，管理员可在认证授权中调整游客角色权限。同一对象选择 `游客` 访问角色即表示公开共享，其他已登录角色也保留对该公开对象的访问权。
      operationId: guestLogin
      security: []
      responses:
        '200':
          description: 游客登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/auth/register/:
    post:
      tags:
        - 认证接口
      summary: 用户注册
      description: |
        注册新用户。系统首次初始化会自动创建用户名为 `admin` 的完整功能账号和超级管理员用户组，自助注册用户始终先加入普通用户角色。
        邮箱为必填项，后端统一转为小写并保证非空邮箱唯一；当前阶段不发送验证邮件，邮箱将为后续账号验证和密码找回保留。
        `accountPurpose=research` 只提交科研用户角色申请，不会在注册时直接授予科研用户权限；申请审核前账号仍按普通用户权限使用。
        注册功能受系统配置 `allowRegistration` 控制。
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/auth/logout/:
    post:
      tags:
        - 认证接口
      summary: 用户登出
      operationId: logout
      security:
        - sessionAuth: []
      responses:
        '200':
          description: 登出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/auth/me/:
    get:
      tags:
        - 认证接口
      summary: 获取当前用户信息
      operationId: getCurrentUser
      security: []
      responses:
        '200':
          description: 已认证用户信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'
        '401':
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedUserInfoResponse'
  /api/admin/profile/:
    get:
      tags:
        - 管理后台
      summary: 获取当前用户后台资料
      description: 返回当前登录用户的个人资料、已授予权限、主动关闭权限和有效权限。
      operationId: getAdminProfile
      security:
        - sessionAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/profile/update/:
    post:
      tags:
        - 管理后台
      summary: 更新当前用户后台资料
      description: 更新当前用户的用户名、展示名称、邮箱、头像和部门。
      operationId: updateAdminProfile
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminProfileUpdateRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/admin/profile/permissions/:
    post:
      tags:
        - 管理后台
      summary: 更新当前用户主动关闭的权限
      description: 用户只能关闭或重新开启已经由上级授予的功能权限，不能写入未授予权限。
      operationId: updateAdminProfilePermissions
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminProfilePermissionsRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/admin/profile/password/:
    post:
      tags:
        - 管理后台
      summary: 修改当前用户密码
      description: 校验当前密码、新密码至少 6 位和确认密码后更新密码，并记录操作日志。
      operationId: updateAdminProfilePassword
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminProfilePasswordRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/admin/profile/avatar/:
    post:
      tags:
        - 管理后台
      summary: 上传当前用户头像
      description: 上传当前用户头像文件。仅支持 JPG 和 PNG，后端会压缩为不超过 300x300 的 JPEG 并清空外部头像 URL。需要登录态并写入操作日志。
      operationId: uploadAdminProfileAvatar
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminProfileAvatarUploadRequest'
      responses:
        '200':
          description: 上传成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/users/{userId}/avatar/:
    get:
      tags:
        - 认证授权
      summary: 获取用户头像图片
      description: 返回指定用户已上传的头像图片。需要登录态；用户不存在或未设置数据库头像时返回标准 JSON 错误。
      operationId: getUserAvatar
      security:
        - sessionAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
          description: 用户 ID
      responses:
        '200':
          description: 头像图片
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/admin/operation-logs/:
    get:
      tags:
        - 管理后台
      summary: 查询操作日志
      description: 基于真实操作日志表返回可分页、可筛选的后台操作日志。登录用户始终可查看自己的操作日志；更大范围由 `core.view_all_operation_logs`、`core.view_group_operation_logs` 和当前用户配置的 `operationLogGroupIds` 共同裁剪。非超级管理员主体无法看到超级管理员用户产生的日志。可通过 `userId` 精确筛选授权范围内的指定用户日志。
      operationId: listAdminOperationLogs
      security:
        - sessionAuth: []
      parameters:
        - name: current
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: 当前页码
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            default: 20
          description: 每页数量
        - name: operator
          in: query
          schema:
            type: string
          description: 在授权日志范围内按操作用户名或显示名称模糊筛选
        - name: userId
          in: query
          schema:
            type: integer
          description: 在授权日志范围内按操作用户 ID 精确筛选
        - name: module
          in: query
          schema:
            type: string
          description: 按模块名称模糊筛选
        - name: action
          in: query
          schema:
            type: string
          description: 按操作动作模糊筛选
        - name: result
          in: query
          schema:
            type: string
            enum:
              - success
              - warning
              - failed
          description: 按操作结果筛选
        - name: targetType
          in: query
          schema:
            type: string
            enum:
              - data_resource
              - workspace_scene
          description: 按结构化操作目标类型筛选
        - name: targetId
          in: query
          schema:
            type: integer
          description: 按结构化操作目标后台 ID 精确筛选
        - name: keyword
          in: query
          schema:
            type: string
          description: 跨用户、模块、动作、操作目标和摘要的关键词筛选
        - name: startTime
          in: query
          schema:
            type: string
          description: 操作时间起点，支持日期或日期时间字符串
        - name: endTime
          in: query
          schema:
            type: string
          description: 操作时间终点，支持日期或日期时间字符串
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOperationLogListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/system-logs/:
    get:
      tags:
        - 管理后台
      summary: 查询系统日志
      description: 返回业务数据根目录 `logs/` 下的后台运行日志文件列表，并读取指定日志文件的尾部内容。需要 `core.view_system_logs` 权限；接口只接受文件名选择，不暴露服务器绝对路径，也不允许访问日志目录之外的文件。
      operationId: listAdminSystemLogs
      security:
        - sessionAuth: []
      parameters:
        - name: file
          in: query
          schema:
            type: string
          description: 要读取的日志文件名；为空时默认读取最近修改的日志文件
        - name: lines
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 2000
            default: 500
          description: 返回的尾部日志行数，后端最大限制为 2000 行
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSystemLogResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/admin/dashboard/:
    get:
      tags:
        - 管理后台
      summary: 获取后台概览统计
      description: 返回后台概览首屏统计数据与指定周期活跃用户。登录用户均可进入后台概览；各展示卡片按 `core.view_dashboard_*_card` 权限独立返回，未授权卡片不会出现在响应中。活跃用户定义为周期内存在成功登录操作日志的去重用户。
      operationId: getAdminDashboard
      security:
        - sessionAuth: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum:
              - day
              - week
              - month
            default: day
          description: 活跃用户统计周期，day 为今日按小时统计，week 为本周按日统计，month 为本月按日统计。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboardResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/dashboard/server/:
    get:
      tags:
        - 管理后台
      summary: 获取后台概览服务器监控
      description: 返回服务器 CPU、内存、硬盘型号、数量和使用情况等监控快照。需要 `core.view_dashboard_system_card`；没有系统信息权限时前端不展示服务器信息区域，前端每 5 秒刷新一次。
      operationId: getAdminDashboardServer
      security:
        - sessionAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboardServerResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/users/:
    get:
      tags:
        - 用户管理
      summary: 获取用户列表
      description: 返回可配置用户及其用户组归属。非超级管理员主体不会返回超级管理员用户。需要 `core.manage_auth`。
      operationId: listUsers
      security:
        - sessionAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - 用户管理
      summary: 创建用户
      description: 具备 `core.manage_auth` 和 `core.create_user` 权限的管理员创建用户账号，邮箱必填，创建时必须指定至少一个非超级管理员用户组。密码由后端自动生成并返回。该接口不受自助注册开关影响；`游客` 角色只允许系统专用 guest 账号持有，不能分配给新账号；只有超级管理员可以分配平台管理员角色。
      operationId: createUser
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
