  /api/catalog/vector-import/preview/:
    post:
      tags:
        - 数据目录
      summary: 矢量文件导入预检
      description: |
        解析上传的 Shapefile ZIP、GeoJSON 或 GeoPackage，返回可导入图层、属性字段、坐标系、
        空间范围、几何类型、要素数量、顶点数量、中文编码识别结果和几何质量摘要，不写入科研数据。
        Shapefile 必须以 ZIP 上传并至少包含同名 `.shp`、`.shx`、`.dbf`；`.prj` 缺失时提交导入前必须人工指定坐标系。
        上传文件大小上限取 `application.limits.upload_max_mb` 与 120 MB 的较小值，因为 GeoPandas 会把完整图层读入内存。
        需要 `catalog.add_dataresource`。
      operationId: previewVectorImport
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: .zip、.geojson、.json 或 .gpkg 文件
                encoding:
                  type: string
                  description: 可选的 Shapefile DBF 编码覆盖值，例如 GB18030、GBK 或 UTF-8
      responses:
        '200':
          description: 预检成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VectorImportPreviewResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/catalog/vector-import/validate/:
    post:
      tags:
        - 数据目录
      summary: 矢量文件导入校验
      description: |
        根据选定源图层、编码、人工坐标系和几何修复策略执行完整矢量导入校验，不写入数据。
        返回结构化质量问题和同名资源检测结果。上传文件大小上限取 `application.limits.upload_max_mb` 与 120 MB 的较小值。需要 `catalog.add_dataresource`。
      operationId: validateVectorImport
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - payload
              properties:
                file:
                  type: string
                  format: binary
                  description: 与预检一致的矢量文件
                payload:
                  type: string
                  description: JSON 字符串，结构遵循 VectorImportValidateRequest
      responses:
        '200':
          description: 校验完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VectorImportValidateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/catalog/vector-import/commit/:
    post:
      tags:
        - 数据目录
      summary: 提交矢量文件导入
      description: |
        将选定矢量图层标准化为 EPSG:4326 后写入统一 GeoPackage，保留原始上传文件归档，
        并创建 DataResource、VectorDataset 和 MapLayer。`payload.domainType` 必须使用 DataDomainType，
        矢量文件默认使用新增的 `vector` 业务类型；上传文件大小上限取 `application.limits.upload_max_mb` 与 120 MB 的较小值；需要 `catalog.add_dataresource`。
      operationId: commitVectorImport
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - payload
              properties:
                file:
                  type: string
                  format: binary
                  description: 与预检一致的矢量文件
                payload:
                  type: string
                  description: JSON 字符串，结构遵循 VectorImportCommitRequest
      responses:
        '201':
          description: 矢量导入成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VectorImportCommitResponse'
        '400':
          description: 文件、坐标系、几何质量或导入配置不符合要求
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/catalog/resources/{id}/query/:
    post:
      tags:
        - 数据目录
      summary: 查询矢量数据
      description: 对矢量数据资源执行属性 + 空间联合查询，返回 GeoJSON FeatureCollection 以及空间查询工作台展示所需的命中数量、返回范围、截断状态和查询耗时。需要当前用户同时具备 `core.query_data` 和 `core.load_vector_layer`，并且有权访问该数据资源。单个 Web 进程同一时间只执行一个重型矢量查询；等待超时返回 503 和 Retry-After，客户端应退避后重试。
      operationId: queryResource
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
