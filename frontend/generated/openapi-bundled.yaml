          $ref: '#/components/responses/NotFound'
    post:
      tags:
        - 成果管理
      summary: 发布、下架或删除成果文件
      description: 所属用户或平台管理主体可管理成果。publish/unpublish 需要 `catalog.publish_resultartifact`；delete 需要 `catalog.delete_resultartifact`。删除会永久移除成果记录及对应文件。
      operationId: updateResultArtifact
      security:
        - sessionAuth: []
      parameters:
        - name: resultId
          in: path
          required: true
          schema:
            type: integer
          description: 成果文件 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResultArtifactUpdateRequest'
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ResultArtifact'
                  - $ref: '#/components/schemas/ResultArtifactDeleteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/catalog/results/{resultId}/file/:
    get:
      tags:
        - 成果展示
      summary: 预览或下载成果文件
      description: |
        对具备 `catalog.view_resultartifact` 且处于成果访问范围内的用户返回文件。variant=preview 仅支持 PNG、JPG/JPEG 和 PDF，使用 inline 响应并增加 CSP 沙箱与禁止来源泄露响应头；variant=artifact 还需要 `catalog.download_resultartifact` 并触发下载。
        所有成功响应均包含 `X-Content-Type-Options: nosniff`，并使用后端验证后的可信 MIME。
      operationId: downloadResultArtifact
      security:
        - sessionAuth: []
      parameters:
        - name: resultId
          in: path
          required: true
          schema:
            type: integer
          description: 成果文件 ID
        - name: variant
          in: query
          schema:
            type: string
            enum:
              - artifact
              - preview
            default: artifact
          description: artifact 下载原文件，preview 在浏览器内预览
      responses:
        '200':
          description: 文件内容
          headers:
            Content-Disposition:
              schema:
                type: string
              description: 文件名和下载方式
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
              description: 固定为 nosniff，禁止浏览器 MIME 嗅探
            Content-Security-Policy:
              schema:
                type: string
                const: sandbox; default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'
              description: 仅 variant=preview 返回的沙箱策略
            Referrer-Policy:
              schema:
                type: string
                const: no-referrer
              description: 仅 variant=preview 返回，禁止预览请求泄露来源地址
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
