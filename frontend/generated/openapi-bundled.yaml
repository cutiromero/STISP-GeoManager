        count:
          type: integer
          minimum: 0
          description: 分箱记录数
        ratio:
          type: number
          minimum: 0
          maximum: 1
          description: 分箱记录占有效数值样本的比例
    NonGeoNumericDistribution:
      type: object
      required:
        - field
        - label
        - min
        - max
        - mean
        - median
        - q1
        - q3
        - bins
      properties:
        field:
          type: string
          description: 数值字段名
        label:
          type: string
          description: 字段显示标签
        min:
          type: number
          description: 最小值
        max:
          type: number
          description: 最大值
        mean:
          type: number
          description: 平均值
        median:
          type: number
          description: 中位数
        q1:
          type: number
          description: 第一四分位数
        q3:
          type: number
          description: 第三四分位数
        bins:
          type: array
