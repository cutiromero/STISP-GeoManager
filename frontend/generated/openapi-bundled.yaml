          items:
            $ref: '#/components/schemas/AdminDataResourceAccessGroup'
    WorkspaceSceneCreateRequest:
      type: object
      required:
        - kind
        - name
        - snapshot
      properties:
        kind:
          type: string
          enum:
            - project
