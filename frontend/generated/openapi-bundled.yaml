        - resource
        - fields
        - featureCount
        - geometryType
        - bounds
      properties:
        resource:
          $ref: '#/components/schemas/DataResource'
        fields:
          type: array
          description: 属性字段信息
          items:
            $ref: '#/components/schemas/FieldInfo'
        featureCount:
          type:
            - integer
            - 'null'
          description: 矢量要素数量；栅格和非空间资源为 null
        geometryType:
          type: string
          description: 几何类型
        bounds:
          type: array
          description: WGS84 边界 [minLng, minLat, maxLng, maxLat]，无法计算时为空数组
          items:
            type: number
        raster:
          oneOf:
            - $ref: '#/components/schemas/RasterDataset'
            - type: 'null'
          description: 栅格资源详情；非栅格资源可能省略或为 null
    FieldInfo:
      type: object
