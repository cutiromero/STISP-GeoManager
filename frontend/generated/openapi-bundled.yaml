          description: 参与分类统计的非空样本数
        items:
          type: array
          maxItems: 12
          description: 按数量降序返回的前十二个分类值
          items:
            $ref: '#/components/schemas/NonGeoCategoricalDistributionItem'
    NonGeoHistogramBin:
      type: object
      required:
        - label
