          minimum: 0
          description: 总条数。
        current:
          type: integer
          minimum: 1
          description: 当前页码。
        pageSize:
          type: integer
          minimum: 1
          description: 每页条数。
    DictionaryItem:
      type: object
      required:
        - id
        - type
        - code
        - name
        - parentId
        - selectable
      properties:
        id:
          type: integer
          description: 字典项 ID
        type:
          type: string
          description: 字典类型
        code:
          type: string
          description: 字典编码
        name:
          type: string
          description: 字典显示名称
        parentId:
          type:
            - integer
            - 'null'
          description: 上级字典项 ID；一级分类为 null
        selectable:
          type: boolean
          description: 是否允许直接作为资源主分类
    DataCategoryPathItem:
      type: object
      required:
        - id
        - code
        - name
      properties:
        id:
          type: integer
          description: 分类字典项 ID
        code:
          type: string
          description: 稳定分类编码
        name:
          type: string
          description: 分类显示名称
    ClassificationStatus:
      type: string
      enum:
        - classified
        - pending
      description: 资源是否已挂接权威业务主分类。
    ResourceView:
      type: string
      enum:
        - map
        - table
        - gallery
        - metadata
      description: 当前资源由后端确认可进入的展示视图。
    ResultArtifactSourceType:
      type: string
      enum:
        - analysis
        - direct_import
      description: analysis 表示由平台数据分析流程形成或登记的成果，direct_import 表示外部制作后直接导入的成果
    ResultArtifactType:
      type: string
      enum:
        - map
        - chart
        - report
        - table
        - image
        - other
      description: 成果展示形态
    ResultArtifactStatus:
      type: string
      enum:
        - draft
        - published
      description: 草稿仅创建者和管理员可见，已发布成果按访问角色共享；游客角色表示公开成果，游客及其他已登录角色均可见
    ResultArtifactCreatePayload:
      type: object
      required:
        - name
        - sourceType
        - resultType
        - categoryCode
        - accessGroupIds
      properties:
        name:
          type: string
          description: 成果显示名称
        description:
          type: string
          description: 成果摘要和适用范围
        sourceType:
          $ref: '#/components/schemas/ResultArtifactSourceType'
        resultType:
          $ref: '#/components/schemas/ResultArtifactType'
        categoryCode:
          type: string
          description: 四大权威业务分类叶节点编码
        provider:
          type: string
          description: 成果提供单位或团队
        accessGroupIds:
