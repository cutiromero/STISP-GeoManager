          items:
            type: integer
    MapCompositionLayout:
      type: object
      additionalProperties: true
      description: 轻量专题制图版式 JSON。可包含纸张尺寸、DPI、地图范围、地图框、标题、图例、指北针、比例尺、区位副图、经纬网或 Web Mercator 投影格网、数据来源和制图说明；不得包含原始 GeoJSON 要素集合、属性表、Blob URL 或图片 Data URL。
    MapCompositionStatus:
      type: string
      enum:
        - draft
        - completed
        - published
      description: draft 为版式草稿，completed 为已生成成果，published 为已发布专题
    MapCompositionVersion:
      type: object
      required:
        - id
        - compositionId
        - versionNumber
        - format
        - dpi
        - widthPx
        - heightPx
        - snapshotSchemaVersion
        - snapshotChecksum
        - previewUrl
        - downloadUrl
        - createdAt
      properties:
        id:
          type: integer
          description: 成果版本记录 ID
        compositionId:
          type: integer
          description: 所属出图稿 ID
        versionNumber:
          type: integer
          minimum: 1
          description: 出图稿内递增的版本号
        format:
          type: string
          enum:
            - png
            - jpg
            - pdf
          description: 正式成果格式
        dpi:
          type: integer
          minimum: 72
          maximum: 600
          description: 输出 DPI
        widthPx:
          type: integer
          description: 输出宽度像素
        heightPx:
          type: integer
          description: 输出高度像素
        note:
          type: string
          description: 版本说明
        snapshotSchemaVersion:
          type: integer
          minimum: 1
          description: 工程快照结构版本
        snapshotChecksum:
          type: string
          description: 版式和工程快照的 SHA-256 校验值
        previewUrl:
          type: string
          description: PNG 预览地址
        downloadUrl:
          type: string
          description: 正式成果下载地址
        createdAt:
          type: string
          format: date-time
          description: 版本生成时间
    MapComposition:
      type: object
      required:
        - id
        - projectId
        - projectName
        - name
        - description
        - status
        - layout
        - owner
        - audienceGroups
        - versions
        - isOwner
        - canPreview
        - canDownload
        - canEditLayout
        - canPublish
        - canUnpublish
        - canRestoreProject
        - canLoadSourceProject
        - canDelete
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          description: 出图稿 ID
        projectId:
          type: integer
          description: 来源工程 ID
        projectName:
          type: string
          description: 来源工程名称
        name:
          type: string
          description: 专题图名称
        description:
          type: string
          description: 专题图说明
        status:
          $ref: '#/components/schemas/MapCompositionStatus'
        layout:
          $ref: '#/components/schemas/MapCompositionLayout'
        owner:
          $ref: '#/components/schemas/WorkspaceSceneOwner'
        audienceGroups:
          type: array
          description: 专题正式发布后可以访问的角色；未发布时不产生普通用户可见性
          items:
            $ref: '#/components/schemas/AdminDataResourceAccessGroup'
        currentVersion:
          oneOf:
            - $ref: '#/components/schemas/MapCompositionVersion'
            - type: 'null'
          description: 最近生成的成果版本；尚未生成时为 null
        publishedVersion:
          oneOf:
            - $ref: '#/components/schemas/MapCompositionVersion'
            - type: 'null'
          description: 当前正式发布版本；未发布时为 null
        versions:
          type: array
          description: 按版本号倒序返回的成果版本
          items:
            $ref: '#/components/schemas/MapCompositionVersion'
        isOwner:
          type: boolean
        canPreview:
          type: boolean
        canDownload:
          type: boolean
        canEditLayout:
          type: boolean
        canPublish:
          type: boolean
        canUnpublish:
          type: boolean
        canRestoreProject:
          type: boolean
        canLoadSourceProject:
          type: boolean
        canDelete:
          type: boolean
        publishedAt:
          type:
            - string
            - 'null'
          format: date-time
        publishedBy:
          oneOf:
            - $ref: '#/components/schemas/WorkspaceSceneOwner'
            - type: 'null'
        createdAt:
          type: string
          format: date-time
          description: 创建时间
        updatedAt:
          type: string
          format: date-time
          description: 更新时间
    MapCompositionListResponse:
      type: object
      required:
        - items
        - availableAudienceGroups
      properties:
        items:
          type: array
          description: 当前用户拥有的出图稿列表
          items:
            $ref: '#/components/schemas/MapComposition'
        availableAudienceGroups:
          type: array
          description: 当前用户发布专题时可选择的角色
          items:
            $ref: '#/components/schemas/AdminDataResourceAccessGroup'
    MapCompositionCreateRequest:
      type: object
      required:
        - projectId
        - name
        - layout
      properties:
        projectId:
          type: integer
          description: 当前用户拥有的来源工程 ID，必须是 project 类型
        name:
          type: string
          maxLength: 160
          description: 专题图名称
        description:
          type: string
          maxLength: 2000
          description: 专题图说明
        layout:
          $ref: '#/components/schemas/MapCompositionLayout'
    MapCompositionUpdateRequest:
      type: object
      properties:
        action:
          type: string
          enum:
            - update
            - delete
          default: update
          description: update 更新版式；delete 永久删除专题、全部版本记录和成果文件
        name:
          type: string
          maxLength: 160
          description: 更新后的专题图名称
        description:
          type: string
          maxLength: 2000
          description: 更新后的专题图说明
        layout:
          $ref: '#/components/schemas/MapCompositionLayout'
    MapCompositionDeleteResponse:
      type: object
      required:
        - deleted
        - id
        - detail
      properties:
        deleted:
          type: boolean
          const: true
          description: 是否已完成永久删除
        id:
          type: integer
          description: 已删除的出图稿 ID
        detail:
          type: string
          description: 删除结果说明
    MapCompositionVersionCreatePayload:
      type: object
      required:
        - format
        - dpi
        - widthPx
        - heightPx
        - workspaceSnapshot
      properties:
        format:
          type: string
          enum:
            - png
            - jpg
            - pdf
          description: 正式成果格式
        dpi:
          type: integer
          minimum: 72
          maximum: 600
          description: 输出 DPI
        widthPx:
          type: integer
          minimum: 1
          maximum: 8192
          description: PNG 母图宽度
        heightPx:
          type: integer
          minimum: 1
          maximum: 8192
          description: PNG 母图高度
        note:
          type: string
          maxLength: 500
          description: 版本说明
        workspaceSnapshot:
          $ref: '#/components/schemas/WorkspaceSceneSnapshot'
    MapCompositionPublishRequest:
      type: object
      required:
        - versionNumber
        - audienceGroupIds
      properties:
        versionNumber:
          type: integer
          minimum: 1
          description: 要设为正式发布版本的成果版本号
        audienceGroupIds:
          type: array
          minItems: 1
          uniqueItems: true
          description: 专题发布后的可见角色 ID
          items:
            type: integer
    MapCompositionRestoreProjectRequest:
      type: object
      required:
        - versionNumber
        - name
      properties:
        versionNumber:
          type: integer
          minimum: 1
          description: 要还原的成果版本号；发布范围用户只能提交正式发布版本
        name:
          type: string
          maxLength: 160
          description: 新工程名称
        description:
          type: string
          maxLength: 2000
        accessGroupIds:
          type: array
          uniqueItems: true
          items:
            type: integer
        unavailableResourcePolicy:
          type: string
          enum:
            - skip
            - fail
          default: skip
    MapCompositionRestoreWarning:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        resourceId:
          type:
            - integer
            - 'null'
    MapCompositionRestoreProjectResponse:
      type: object
      required:
        - project
        - warnings
      properties:
        project:
          $ref: '#/components/schemas/WorkspaceScene'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/MapCompositionRestoreWarning'
    ResourceListItem:
      $ref: '#/components/schemas/DataResource'
    MapLayer:
      type: object
      required:
        - id
        - name
        - code
        - layerType
        - geometryType
        - category
        - dataResourceId
        - sortOrder
        - defaultVisible
        - defaultOpacity
        - symbolization
        - bounds
        - legend
        - rasterRules
        - isActive
        - updatedAt
      properties:
        id:
          type: integer
          description: 图层 ID
        name:
          type: string
          description: 图层名称
        code:
          type: string
          description: 图层编码
        layerType:
          type: string
          enum:
            - vector
            - raster
          description: 图层类型
        geometryType:
          type: string
          enum:
            - point
            - line
            - polygon
            - mixed
          description: 几何类型
        category:
          oneOf:
            - $ref: '#/components/schemas/DictionaryItem'
            - type: 'null'
          description: 图层分类，未分类时为 null
        dataResourceId:
          type:
            - integer
            - 'null'
          description: 关联数据资源 ID
        sortOrder:
          type: integer
          description: 排序值
        defaultVisible:
          type: boolean
          description: 是否默认显示
        defaultOpacity:
          type: integer
          minimum: 0
          maximum: 100
          description: 默认透明度百分比
        symbolization:
          $ref: '#/components/schemas/VectorSymbolization'
        bounds:
          type: array
          description: 图层边界
          items:
            type: number
        legend:
          type: string
          description: 图例说明
        rasterRules:
          $ref: '#/components/schemas/RasterSymbolizationRules'
        isActive:
          type: boolean
          description: 是否启用
        updatedAt:
          type: string
          format: date-time
          description: 最后更新时间
    VectorSymbolization:
      type: object
      additionalProperties: true
      description: |
        矢量图层符号化配置。平台继续兼容历史松散字段；新版本推荐使用 `renderer` 描述单一符号、唯一值分类和业务默认模板，前端根据该结构生成 Mapbox GL JS 表达式并在渲染前注册 `gm-*` 平台内置图标。
      properties:
        opacity:
          type: integer
          minimum: 0
          maximum: 100
          description: 图层透明度百分比
        pointMode:
          type: string
          enum:
            - circle
            - symbol
            - heatmap
          description: 点图层基础表达方式；唯一值分类点模板通常使用 symbol
        renderer:
          $ref: '#/components/schemas/VectorRenderer'
        circle:
          type: object
          additionalProperties: true
          description: 圆点图层基础样式，字段驱动渲染未覆盖的属性继续使用这里的值
        symbol:
          type: object
          additionalProperties: true
          description: 图标和标注图层基础样式；平台内置图标使用 `gm-*` 英文 ID
        heatmap:
          type: object
          additionalProperties: true
          description: 热力图样式和权重字段
        cluster:
          type: object
          additionalProperties: true
          description: Mapbox source 聚合配置
        line:
          type: object
          additionalProperties: true
          description: 线图层基础样式
        fill:
          type: object
          additionalProperties: true
          description: 面图层基础样式
    VectorRenderer:
      oneOf:
        - $ref: '#/components/schemas/SingleSymbolRenderer'
        - $ref: '#/components/schemas/UniqueValueRenderer'
        - $ref: '#/components/schemas/GraduatedRenderer'
      description: 矢量符号化渲染器；未提供时按单一符号处理
    SingleSymbolRenderer:
      type: object
      required:
        - type
      additionalProperties: true
      properties:
        type:
          type: string
          enum:
            - single
          description: 单一符号渲染
        templateId:
          type: string
          description: 来源模板 ID；空字符串表示未套用业务模板
        businessType:
          type: string
          description: 业务类型编码，如 germplasm；用于提示默认模板来源
        updatedByUser:
          type: boolean
          description: 用户是否已手动修改该符号化方案；为 true 时不应被默认模板自动覆盖
    UniqueValueRenderer:
      type: object
      required:
        - type
        - field
        - classes
        - defaultClass
      additionalProperties: true
      properties:
        type:
          type: string
          enum:
            - uniqueValue
          description: 按字段唯一值分类符号化
        field:
          type: string
          description: 分类字段名，例如种质数据中的 `性别`
        templateId:
          type: string
          description: 默认业务模板 ID，例如 `germplasm.dna-sex-tree.v1`
        businessType:
          type: string
          description: 业务类型编码，例如 `germplasm`
        updatedByUser:
          type: boolean
          description: 用户是否已手动修改该分类符号化方案
        classes:
          type: array
          description: 分类符号列表；一个类别可包含多个原始字段值，用于别名归一化和分类值合并
          items:
            $ref: '#/components/schemas/UniqueValueSymbolClass'
        defaultClass:
          $ref: '#/components/schemas/UniqueValueSymbolClass'
        normalizationNotes:
          type: array
          description: 分类值合并或疑似别名提示，供前端展示给用户确认
          items:
            type: string
    GraduatedRenderer:
      type: object
      required:
        - type
        - field
        - method
        - classCount
        - precision
        - colorRamp
        - classes
        - defaultClass
      additionalProperties: true
      description: |
        按连续数值字段进行分级符号化，适用于海拔、NDVI、盐分等可转为数字的字段。 前端依据当前加载要素统计分级断点并生成 Mapbox GL JS case 表达式；服务端按 JSON 对象透传保存，不新增独立接口。
      properties:
        type:
          type: string
          enum:
            - graduated
          description: 数值分级渲染
        field:
          type: string
          description: 连续数值字段名，例如 `海拔`、`NDVI` 或 `盐分`
        method:
          type: string
          enum:
            - equalInterval
            - quantile
            - manual
          description: 分级方法；equalInterval 为等距分级，quantile 为分位数分级，manual 为用户自定义区间
        classCount:
          type: integer
          minimum: 1
          maximum: 24
          description: 分级数量；equalInterval/quantile 自动分级建议 3 到 9 级，manual 自定义分级允许 1 到 24 级
        precision:
          type: integer
          minimum: 0
          maximum: 6
          description: 图例区间标签保留的小数位
        colorRamp:
          type: string
          enum:
            - green
            - blue
            - orange
            - purple
          description: 平台内置连续色带编码
        templateId:
          type: string
          description: 来源推荐模板 ID；空字符串表示未套用业务模板
        businessType:
          type: string
          description: 业务类型编码，例如 population、community 或 field_survey
        updatedByUser:
          type: boolean
          description: 用户是否已手动修改该数值分级方案
        classes:
          type: array
          description: 数值区间符号列表；最后一个区间包含最大值，其他区间为左闭右开。manual 方法下由用户直接维护每个区间的 min/max、颜色、图标、大小和显隐
          items:
            $ref: '#/components/schemas/GraduatedSymbolClass'
        defaultClass:
          $ref: '#/components/schemas/GraduatedSymbolClass'
    GraduatedSymbolClass:
      type: object
      required:
        - id
        - label
        - min
        - max
        - color
        - iconImage
        - visible
      additionalProperties: true
      properties:
        id:
          type: string
          description: 区间类别稳定 ID，前端可用于编辑列表 key
        label:
          type: string
          description: 图例显示名称，通常由区间端点自动生成
        min:
          type:
            - number
            - 'null'
          description: 区间最小值；默认类使用 null 表示无数值或空值
        max:
          type:
            - number
            - 'null'
          description: 区间最大值；默认类使用 null 表示无数值或空值
        color:
          type: string
          pattern: ^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$
          description: 区间颜色；平台内置图标会按图标 ID 与颜色生成运行时图片 ID
        iconImage:
          type: string
          description: 图标 ID。平台内置图标必须使用 `gm-*` 英文 ID，并在 Mapbox 图层引用前通过 `addImage` 注册
        size:
          type: number
          minimum: 0
          description: 区间图标缩放或点半径倍率
        count:
          type: integer
          minimum: 0
          description: 当前加载数据中落入该区间的要素数量；服务端持久化时可省略或置 0
        visible:
          type: boolean
          description: 该区间是否在地图和图例中显示
    UniqueValueSymbolClass:
      type: object
      required:
        - id
        - label
        - values
        - color
        - iconImage
        - visible
      additionalProperties: true
      properties:
        id:
          type: string
          description: 类别稳定 ID，前端可用于编辑列表 key
        label:
          type: string
          description: 图例显示名称
        values:
          type: array
          description: 归入该类别的原始字段值；空数组仅用于默认类
          items:
            type: string
        color:
          type: string
          pattern: ^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$
          description: 类别颜色；平台内置图标会按图标 ID 与颜色生成运行时图片 ID
        iconImage:
          type: string
          description: 图标 ID。平台内置图标必须使用 `gm-*` 英文 ID，并在 Mapbox 图层引用前通过 `addImage` 注册
        size:
          type: number
          minimum: 0
          description: 类别图标缩放或点半径倍率
        count:
          type: integer
          minimum: 0
          description: 当前加载数据中归入该类别的要素数量；服务端持久化时可省略或置 0
        visible:
          type: boolean
          description: 该类别是否在地图和图例中显示
    RasterDataset:
      type: object
      required:
        - id
        - name
        - code
        - status
        - sourcePath
        - processedPath
        - sourceMetadataPath
        - processedMetadataPath
        - dataResourceId
        - mapLayerId
        - bandCount
        - bounds3857
        - bounds4326
        - imageCoordinates
        - defaultRules
        - sourceFileSize
        - processedFileSize
        - progressLog
        - errorMessage
        - importedAt
        - processedAt
        - metadata
        - sourceFileName
        - sourceFormat
        - sourceManifest
        - sourceChecksumSha256
        - rasterKind
      properties:
        id:
          type: integer
          description: 栅格数据集 ID
        name:
          type: string
          description: 数据集名称
        code:
          type: string
          description: 数据集编码
        status:
          type: string
          enum:
            - pending
            - processing
            - ready
            - failed
          description: 预处理状态
        sourcePath:
          type: string
          description: 原始栅格相对路径
        processedPath:
          type: string
          description: 预处理 COG 相对路径
        sourceMetadataPath:
          type: string
          description: 原始文件元数据相对路径
        processedMetadataPath:
          type: string
          description: 预处理文件元数据相对路径
        dataResourceId:
          type:
            - integer
            - 'null'
          description: 关联数据资源 ID
        mapLayerId:
          type:
            - integer
            - 'null'
          description: 关联地图图层 ID
        bandCount:
          type: integer
          description: 波段数量
        bounds3857:
          type: array
          description: EPSG:3857 边界
          items:
            type: number
        bounds4326:
          type: array
          description: WGS84 边界
          items:
            type: number
        imageCoordinates:
          type: array
          description: WGS84 图像角点坐标
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: number
        defaultRules:
          $ref: '#/components/schemas/RasterSymbolizationRules'
        sourceFileSize:
          type: integer
          description: 原始文件大小，单位字节
        processedFileSize:
          type: integer
          description: 预处理文件大小，单位字节
        progressLog:
          type: string
          description: 导入或预处理日志
        errorMessage:
          type: string
          description: 失败原因
        importedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: 导入完成时间
        processedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: 预处理完成时间
        metadata:
          $ref: '#/components/schemas/RasterMetadata'
        sourceFileName:
          type: string
          description: 用户上传或目录扫描时的主栅格原始文件名
        sourceFormat:
          type: string
          description: GDAL 识别到的源格式或驱动简称
        sourceManifest:
          type: array
          description: 原始栅格数据包内的文件清单
          items:
            $ref: '#/components/schemas/RasterSourceAsset'
        sourceChecksumSha256:
          type: string
          description: 主栅格文件 SHA256；未计算时为空字符串
        rasterKind:
          type: string
          enum:
            - imagery
            - continuous
            - categorical
          description: 栅格数据语义，用于选择默认重采样和符号化策略
    RasterMetadata:
      type: object
      required:
        - size
        - driver
        - coordinateSystem
        - bands
      properties:
        size:
          type: array
          description: 栅格像素尺寸 [width, height]
          items:
            type: integer
        driver:
          type: string
          description: GDAL 驱动简称
        coordinateSystem:
          oneOf:
            - type: string
            - type: integer
          description: 坐标系统 EPSG 或描述文本
        bands:
          type: array
          description: 波段元数据
          items:
            $ref: '#/components/schemas/RasterBandInfo'
    RasterBandInfo:
      type: object
      required:
        - band
        - type
        - description
        - colorInterpretation
        - min
        - max
        - isInteger
      properties:
        band:
          type: integer
          description: 1-based 波段编号
        type:
          type: string
          description: GDAL 波段类型
        description:
          type: string
          description: 波段描述
        colorInterpretation:
          type: string
          description: 颜色解释
        min:
          type: number
          description: 波段最小值
        max:
          type: number
          description: 波段最大值
        isInteger:
          type: boolean
          description: 是否为整型波段
    RasterSymbolizationRules:
      type: object
      additionalProperties: true
      description: 栅格符号化规则对象，具体结构由后端符号化规则引擎校验
    AsyncJobResponse:
      type: object
      required:
        - id
        - kind
        - status
        - stage
        - progressPercent
        - messages
        - result
        - error
        - startedAt
        - finishedAt
      properties:
        id:
          type: string
          description: 异步任务 ID
        kind:
          type: string
          enum:
            - import
            - scan
            - render
            - export
          description: 任务类型
        status:
          type: string
          enum:
            - queued
            - running
            - ready
            - failed
          description: 任务状态
        stage:
          type: string
          description: 当前处理阶段，例如 queued、validating、preprocessing、publishing、ready 或 failed
        progressPercent:
          type: integer
          minimum: 0
          maximum: 100
          description: 任务进度百分比
        messages:
          type: array
          description: 任务进度消息
          items:
            type: string
        result:
          oneOf:
            - $ref: '#/components/schemas/RasterRenderResult'
            - $ref: '#/components/schemas/RasterDataset'
            - $ref: '#/components/schemas/RasterDatasetScanResult'
            - $ref: '#/components/schemas/ExportJobResult'
            - type: 'null'
          description: 任务完成后的结果；未完成或失败时为 null
        error:
          type: string
          description: 失败原因
        startedAt:
          type: number
          format: double
          description: 任务创建时间戳
        finishedAt:
          type:
            - number
            - 'null'
          format: double
          description: 任务结束时间戳
    RasterDatasetScanResult:
      type: object
      required:
        - items
        - count
      properties:
        items:
          type: array
          description: 扫描或导入得到的栅格数据集
          items:
            $ref: '#/components/schemas/RasterDataset'
        count:
          type: integer
          description: 数据集数量
    ExportJobResult:
      type: object
      required:
        - filename
        - downloadUrl
      properties:
        filename:
          type: string
          description: 导出文件名
        downloadUrl:
          type: string
          description: 导出文件下载路径
    DirectoryTreeResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          description: 数据目录列表
          items:
            $ref: '#/components/schemas/Directory'
    Directory:
      type: object
      required:
        - id
        - name
        - code
        - parentId
        - description
        - sortOrder
        - resources
      properties:
        id:
          type: integer
          description: 目录 ID
        name:
          type: string
          description: 目录名称
        code:
          type: string
          description: 目录编码
        parentId:
          type:
            - integer
            - 'null'
          description: 父目录 ID
        description:
          type: string
          description: 目录描述
        sortOrder:
          type: integer
          description: 排序值
        resources:
          type: array
          description: 目录下的数据资源
          items:
            $ref: '#/components/schemas/DataResource'
    ResourceListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          description: 数据资源列表
          items:
            $ref: '#/components/schemas/DataResource'
    ScanResponse:
      type: object
      required:
        - items
        - count
      properties:
        items:
          type: array
          description: 本次扫描发现或同步的资源
          items:
            $ref: '#/components/schemas/DataResource'
        count:
          type: integer
          description: 资源数量
    ImportPreviewResponse:
      type: object
      required:
        - columns
        - rows
        - rowCount
        - suggestedTableName
        - suggestedName
        - activeSheetName
        - sheets
        - duplicateTarget
        - detected
        - limitations
      properties:
        columns:
          type: array
          description: 表格列名
          items:
            type: string
        rows:
          type: array
          description: 前若干行预览数据，键为列名，值为文本
          items:
            type: object
            additionalProperties:
              type: string
        rowCount:
          type: integer
          description: 总行数
        suggestedTableName:
          type: string
          description: 建议后台存储标识；每次预检生成不同值，提交后可能因后端冲突保护再次改写
        suggestedName:
          type: string
          description: 建议数据名称
        activeSheetName:
          type:
            - string
            - 'null'
          description: 当前读取的 Excel 工作表名称；CSV 为 null
        sheets:
          type: array
          description: Excel 工作表拆分清单；CSV 为空数组
          items:
            $ref: '#/components/schemas/ImportWorkbookSheet'
        duplicateTarget:
          oneOf:
            - $ref: '#/components/schemas/ImportDuplicateTarget'
            - type: 'null'
          description: 按建议数据名称检测到的同名数据资源；无重复时为 null
        detected:
          $ref: '#/components/schemas/ImportDetectedInfo'
        limitations:
          type: array
          description: 导入限制提示
          items:
            type: string
    ImportWorkbookSheet:
      type: object
      required:
        - name
