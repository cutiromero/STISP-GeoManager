      description: |
        解析上传的 Excel/CSV，Excel 会识别全部工作表并按当前工作表读取字段，自动推测经纬度列，
        并返回样例行、字段列表、工作表清单、建议后台存储标识和建议数据名称是否重名。该接口不执行坐标数据校验，不写入数据。
        上传文件大小上限取 `application.limits.upload_max_mb` 与 16 MB 的较小值，避免整表解析耗尽内存。
        需要 `catalog.add_dataresource`。
      operationId: importPreview
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: .csv / .xls / .xlsx 文件
                sheetName:
                  type: string
                  description: 可选；Excel 工作表名称。为空时默认读取第一张工作表。
      responses:
        '200':
          description: 预检成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportPreviewResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/catalog/import/validate/:
    post:
      tags:
        - 数据目录
      summary: 上传数据校验
      description: 按当前表单选择的数据名称、工作表、导入类型、后台存储标识和经纬度列校验上传文件，不写入数据。重复检测按前端显示的数据名称执行。上传文件大小上限取 `application.limits.upload_max_mb` 与 16 MB 的较小值。需要 `catalog.add_dataresource`。
      operationId: importValidate
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - payload
              properties:
                file:
                  type: string
                  format: binary
                  description: 与预检一致的文件
                payload:
                  type: string
                  description: JSON 字符串，包含 name、sheetName、importMode、tableName、longitudeColumn、latitudeColumn；name 是前端显示的数据名称，用于同名数据检测；sheetName 是 Excel 工作表名称；tableName 是后台存储标识建议值。
      responses:
        '200':
          description: 校验成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportValidateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/catalog/import/commit/:
    post:
      tags:
        - 数据目录
      summary: 提交数据导入
      description: |
        将预检后的 Excel/CSV 导入统一存储。选择地理数据时写入 GeoPackage，
        选择非地理数据时写入 SQLite。接口每次导入都会生成唯一后台存储标识并创建新的 DataResource。
        上传文件大小上限取 `application.limits.upload_max_mb` 与 16 MB 的较小值，避免整表解析耗尽内存。
        `payload.domainType` 在兼容期继续保存为 DataResource.domainType；V1 新客户端同时提交 `payload.categoryCode` 作为甲方四大类权威业务主分类，
        资源列表页和地理/非地理数据分类筛选均以该字段为准。
        需要 `catalog.add_dataresource`；前端显示名已存在时必须在数据校验阶段确认，并在提交时显式传入 duplicateConfirmed=true 才允许继续导入。继续导入会创建新的 DataResource 和唯一后台存储标识，不覆盖已有数据。
      operationId: importCommit
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - payload
              properties:
                file:
                  type: string
                  format: binary
                payload:
                  type: string
                  description: JSON 字符串，包含导入配置；name 是前端显示的数据名称，categoryCode 是甲方四大类主分类叶节点，domainType 为兼容业务标签，sheetName 是 Excel 工作表名称，tableName 是后台存储标识建议值，后端会在冲突时自动改写为唯一值；同名显示数据必须传 duplicateConfirmed=true；可包含 accessGroupIds 指定额外可见用户组。
                  example: '{"name":"胡杨群落样方数据","categoryCode":"thematic_community","domainType":"community","importMode":"geographic","tableName":"community_plots","longitudeColumn":"Longitude","latitudeColumn":"Latitude","duplicateConfirmed":false,"includedColumns":["SamplePlot","Longitude","Latitude"],"fieldMetadata":{"SamplePlot":"样方编号"},"accessGroupIds":[]}'
      responses:
        '201':
          description: 导入成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportCommitResponse'
        '400':
          description: 校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportErrorResponse'
              examples:
                missingDomainType:
                  summary: 缺少业务数据类型
                  value:
                    detail: 请选择业务数据类型
                invalidDomainType:
                  summary: 业务数据类型编码无效
                  value:
                    detail: 无效的数据业务类型
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
