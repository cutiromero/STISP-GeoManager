        isGeographic:
          type: boolean
          description: 是否自动识别为地理表
        longitudeColumn:
          type:
            - string
            - 'null'
          description: 自动识别的经度列
        latitudeColumn:
          type:
            - string
            - 'null'
          description: 自动识别的纬度列
        coordinateStats:
          oneOf:
            - $ref: '#/components/schemas/CoordinateStats'
            - type: 'null'
          description: 坐标统计，预览阶段为 null
        validationIssues:
          type: array
          description: 坐标校验问题，预览阶段为空数组
          items:
            $ref: '#/components/schemas/ValidationIssue'
    ImportValidateResponse:
      type: object
      required:
        - coordinateStats
        - validationIssues
        - duplicateTarget
      properties:
        coordinateStats:
          oneOf:
            - $ref: '#/components/schemas/CoordinateStats'
            - type: 'null'
          description: 坐标统计；非地理导入时为 null
        validationIssues:
          type: array
          description: 坐标校验问题
          items:
            $ref: '#/components/schemas/ValidationIssue'
        duplicateTarget:
          oneOf:
            - $ref: '#/components/schemas/ImportDuplicateTarget'
            - type: 'null'
          description: 按当前前端显示数据名称检测到的同名数据资源；无重复时为 null
    ImportDuplicateTarget:
      type: object
      required:
        - targetType
        - targetName
        - message
      properties:
        targetType:
          type: string
          enum:
            - data_resource_name
          description: 重复目标类型；data_resource_name 表示前端显示的数据名称已存在
        targetName:
          type: string
          description: 重复的前端显示数据名称
        message:
          type: string
          description: 用户可读提示
    CoordinateStats:
      type: object
      required:
        - totalRows
        - validRows
        - missingRows
        - quantizationErrorMeters
      properties:
        totalRows:
          type: integer
          description: 总行数
        validRows:
          type: integer
          description: 坐标有效行数
        missingRows:
          type: integer
          description: 缺少或无效坐标行数
        quantizationErrorMeters:
          type: object
          required:
            - min
            - max
          description: 坐标文本小数位引入的位置误差范围，单位米
          properties:
            min:
              type:
                - number
                - 'null'
              description: 最小估算误差
            max:
              type:
                - number
                - 'null'
              description: 最大估算误差
    ImportCommitResponse:
      oneOf:
        - $ref: '#/components/schemas/GeographicImportCommitResponse'
        - $ref: '#/components/schemas/TableImportCommitResponse'
    GeographicImportCommitResponse:
      type: object
      required:
        - mode
        - resourceId
        - resourceName
        - layerName
        - tableName
        - importedRows
        - skippedRows
        - bounds
        - coordinateStats
        - validationIssues
      properties:
        mode:
          type: string
          enum:
            - geographic
          description: 地理表导入模式
        resourceId:
          type: integer
          description: 创建的数据资源 ID
        resourceName:
          type: string
          description: 创建的数据资源名称
        layerName:
          type: string
          description: 写入 GeoPackage 的唯一图层名
        tableName:
          type: string
          description: 写入 GeoPackage 的唯一图层名，与 layerName 相同
        importedRows:
          type: integer
          description: 成功导入行数
        skippedRows:
          type: integer
          description: 跳过行数
        bounds:
          type: array
          description: 导入数据边界 [minLng, minLat, maxLng, maxLat]，无有效坐标时为空数组
          items:
            type: number
        coordinateStats:
          $ref: '#/components/schemas/CoordinateStats'
        validationIssues:
          type: array
          description: 导入时发现的坐标校验问题
          items:
            $ref: '#/components/schemas/ValidationIssue'
    TableImportCommitResponse:
      type: object
      required:
        - mode
        - resourceId
        - resourceName
        - layerId
        - tableName
        - importedRows
        - skippedRows
        - coordinateStats
        - validationIssues
      properties:
        mode:
          type: string
          enum:
            - table
          description: 非地理表导入模式
        resourceId:
          type: integer
          description: 创建的数据资源 ID
        resourceName:
          type: string
          description: 创建的数据资源名称
        layerId:
          type:
            - integer
            - 'null'
          description: 非地理表不创建地图图层，固定为 null
        tableName:
          type: string
          description: SQLite 唯一表名
        importedRows:
          type: integer
          description: 成功导入行数
        skippedRows:
          type: integer
          description: 跳过行数
        coordinateStats:
          oneOf:
            - $ref: '#/components/schemas/CoordinateStats'
            - type: 'null'
          description: 非地理导入固定为 null
        validationIssues:
          type: array
          description: 非地理导入固定为空数组
          items:
            $ref: '#/components/schemas/ValidationIssue'
    VectorImportFieldPreview:
      type: object
      required:
        - name
        - type
        - nullable
        - sampleValues
      properties:
        name:
          type: string
          description: 源属性字段名
        type:
          type: string
          description: GeoPandas/Pandas 字段类型
        nullable:
          type: boolean
          description: 字段是否包含空值
        sampleValues:
          type: array
          description: 前若干个非空样例值
          items:
            oneOf:
              - type: string
              - type: number
              - type: boolean
              - type: 'null'
    VectorGeometryQuality:
      type: object
      required:
        - validCount
        - invalidCount
        - emptyCount
        - nullCount
        - mixedGeometry
      properties:
        validCount:
          type: integer
          description: 有效几何数量
        invalidCount:
          type: integer
          description: 无效几何数量
        emptyCount:
          type: integer
          description: 空几何数量
        nullCount:
          type: integer
          description: null 几何数量
        mixedGeometry:
          type: boolean
          description: 是否存在多种基础几何类型
    VectorImportLayerPreview:
      type: object
      required:
        - sourceLayerName
        - suggestedName
        - suggestedTableName
        - geometryType
        - featureCount
        - vertexCount
        - bounds
        - coordinateSystem
        - epsg
        - encoding
        - fields
        - previewRows
        - quality
      properties:
        sourceLayerName:
          type: string
          description: 源文件中的图层名称；GeoJSON 为文件名去扩展名
        suggestedName:
          type: string
          description: 建议的数据资源显示名称
        suggestedTableName:
          type: string
          description: 建议写入统一 GeoPackage 的图层名
        geometryType:
          type: string
          description: Point、LineString、Polygon、MultiPoint、MultiLineString、MultiPolygon 或 Mixed
        featureCount:
          type: integer
          description: 要素总数
        vertexCount:
          type: integer
          description: 几何坐标顶点总数
        bounds:
          type: array
          description: 源坐标系边界 [minX, minY, maxX, maxY]
          items:
            type: number
        coordinateSystem:
          type:
            - string
            - 'null'
          description: 解析到的坐标系文本；缺失时为 null
        epsg:
          type:
            - integer
            - 'null'
          description: 解析到的 EPSG 编码；无法识别时为 null
        encoding:
          type:
            - string
            - 'null'
          description: Shapefile DBF 使用的编码；其他格式可能为 null
        fields:
          type: array
          description: 属性字段预览
          items:
            $ref: '#/components/schemas/VectorImportFieldPreview'
        previewRows:
          type: array
          description: 前若干行属性预览，不包含几何坐标
          items:
            type: object
            additionalProperties: true
        quality:
          $ref: '#/components/schemas/VectorGeometryQuality'
    VectorImportPreviewResponse:
      type: object
      required:
        - sourceFileName
        - sourceFormat
        - layers
        - limitations
      properties:
        sourceFileName:
          type: string
          description: 原始上传文件名
        sourceFormat:
          type: string
          enum:
            - SHAPEFILE
            - GEOJSON
            - GPKG
          description: 识别到的矢量源格式
        layers:
          type: array
          minItems: 1
          description: 文件中可选择导入的矢量图层
          items:
            $ref: '#/components/schemas/VectorImportLayerPreview'
        limitations:
          type: array
          description: 当前矢量导入限制和处理提示
          items:
            type: string
    VectorImportValidateRequest:
      type: object
      required:
        - name
        - sourceLayerName
        - tableName
      properties:
        name:
          type: string
          description: 数据资源显示名称
        sourceLayerName:
          type: string
          description: 预检结果中的源图层名称
        tableName:
          type: string
          description: 建议写入统一 GeoPackage 的图层名
        encoding:
          type:
            - string
            - 'null'
          description: Shapefile DBF 编码覆盖值
        sourceCrs:
          type:
            - string
            - 'null'
          description: 源文件缺少坐标系时人工指定的 EPSG 编码或 CRS 字符串
        repairInvalidGeometries:
          type: boolean
          default: false
          description: 是否使用 make_valid 尝试修复无效几何
        skipInvalidGeometries:
          type: boolean
          default: false
          description: 是否跳过修复后仍无效、空或 null 的几何
    VectorImportValidateResponse:
      type: object
      required:
        - layer
        - validationIssues
        - duplicateTarget
      properties:
        layer:
          $ref: '#/components/schemas/VectorImportLayerPreview'
        validationIssues:
          type: array
          description: 坐标系、编码和几何质量问题
          items:
            $ref: '#/components/schemas/ValidationIssue'
        duplicateTarget:
          oneOf:
            - $ref: '#/components/schemas/ImportDuplicateTarget'
            - type: 'null'
          description: 同名数据资源；无重复时为 null
    VectorImportCommitRequest:
      allOf:
        - $ref: '#/components/schemas/VectorImportValidateRequest'
        - type: object
          required:
            - domainType
            - duplicateConfirmed
            - accessGroupIds
            - fieldMetadata
          properties:
            domainType:
              $ref: '#/components/schemas/DataDomainType'
            categoryCode:
              type: string
              description: 甲方四大类体系中的业务主分类叶节点编码；V1 新客户端提交，旧客户端兼容期可省略
            duplicateConfirmed:
              type: boolean
              description: 是否已确认创建同名数据资源
            accessGroupIds:
              type: array
              description: 额外可访问用户组 ID
              items:
                type: integer
            fieldMetadata:
              type: object
              description: 字段名到中文说明的映射
              additionalProperties:
                type: string
    VectorImportCommitResponse:
      type: object
      required:
        - mode
        - resourceId
        - resourceName
        - vectorDatasetId
        - layerId
        - layerName
        - sourceLayerName
        - importedFeatures
        - skippedFeatures
        - bounds
        - geometryType
        - coordinateSystem
        - sourceEncoding
        - validationIssues
      properties:
        mode:
          type: string
          enum:
            - vector
          description: 矢量文件导入模式
        resourceId:
          type: integer
          description: 创建的数据资源 ID
        resourceName:
          type: string
          description: 创建的数据资源显示名称
        vectorDatasetId:
          type: integer
          description: 创建的 VectorDataset 技术元数据记录 ID
        layerId:
          type: integer
          description: 创建的 MapLayer ID
        layerName:
          type: string
          description: 写入统一 GeoPackage 的唯一图层名
        sourceLayerName:
          type: string
          description: 源文件中的图层名称
        importedFeatures:
          type: integer
          description: 成功写入的有效要素数量
        skippedFeatures:
          type: integer
          description: 因空、null 或无效几何被跳过的要素数量
        bounds:
          type: array
          description: EPSG:4326 边界 [minLng, minLat, maxLng, maxLat]
          items:
            type: number
        geometryType:
          type: string
          description: 标准化后的几何类型
        coordinateSystem:
          type: string
          description: 标准化存储坐标系，固定为 EPSG:4326
        sourceEncoding:
          type:
            - string
            - 'null'
          description: 源 Shapefile DBF 编码；其他格式可能为 null
        validationIssues:
          type: array
          description: 导入时确认或处理的质量问题
          items:
            $ref: '#/components/schemas/ValidationIssue'
    ImportErrorResponse:
      type: object
