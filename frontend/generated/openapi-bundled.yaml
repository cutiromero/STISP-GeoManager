        name:
          type: string
          description: 字段名
        type:
          type: string
          description: 字段数据类型
        nullable:
          type: boolean
          description: 是否存在空值
        sampleValues:
          type: array
          description: 非空样例值
          items:
            oneOf:
              - type: string
              - type: number
              - type: boolean
              - type: 'null'
        description:
          type: string
          description: 字段描述
    NonGeoScalar:
      oneOf:
        - type: string
        - type: number
        - type: boolean
        - type: 'null'
      description: 非地理数据单元格或分类值；空值统一返回 null
    NonGeoFieldRole:
      type: string
      enum:
        - identifier
        - category
        - measure
        - date
        - text
        - coordinate
        - unknown
      description: 字段在分析视图中的推断角色
    NonGeoTableQueryRequest:
      type: object
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 500
          default: 80
          description: 本页最多返回的记录数
        offset:
          type: integer
          minimum: 0
          maximum: 10000000
          default: 0
          description: 从零开始的记录偏移量
        sortField:
          type:
            - string
            - 'null'
          description: 可选排序字段，必须与资源实际字段完全一致
        sortDirection:
          type: string
          enum:
            - asc
            - desc
          default: asc
          description: 排序方向
    NonGeoTableField:
      type: object
      required:
        - name
        - type
        - nullable
        - sampleValues
        - description
      properties:
        name:
          type: string
          description: 字段名
        type:
          type: string
          enum:
            - integer
            - float
            - boolean
            - string
          description: 后端根据当前真实数据推断的字段类型
        nullable:
          type: boolean
          description: 当前结果中是否检测到空值
        sampleValues:
          type: array
          maxItems: 3
          description: 当前结果中最多三个非空样例值
          items:
            $ref: '#/components/schemas/NonGeoScalar'
        description:
          type: string
          description: 后台字段元数据说明；没有说明时为空字符串
    NonGeoTableRow:
      type: object
      description: 以字段名为键的非地理明细记录
      additionalProperties:
        $ref: '#/components/schemas/NonGeoScalar'
    NonGeoTableQueryResponse:
      type: object
      required:
        - resourceId
        - resourceName
        - totalCount
        - returnedCount
        - limit
        - offset
        - fields
        - rows
      properties:
        resourceId:
          type: integer
          description: 数据资源 ID
        resourceName:
          type: string
          description: 数据资源显示名称
        totalCount:
          type: integer
          minimum: 0
          description: 资源真实总记录数，不受当前分页限制影响
        returnedCount:
          type: integer
          minimum: 0
          maximum: 500
          description: 本次实际返回记录数
        limit:
          type: integer
          minimum: 1
          maximum: 500
          description: 本次使用的分页大小
        offset:
          type: integer
          minimum: 0
          maximum: 10000000
          description: 本次使用的记录偏移量
        fields:
          type: array
          description: 当前结果字段定义
          items:
            $ref: '#/components/schemas/NonGeoTableField'
        rows:
          type: array
          description: 当前页真实记录
          items:
            $ref: '#/components/schemas/NonGeoTableRow'
    NonGeoFieldProfile:
      type: object
      required:
        - name
        - type
        - label
        - description
        - unit
        - role
        - nullable
        - nonNullCount
        - nullCount
        - completeness
        - uniqueCount
        - sampleValues
      properties:
        name:
          type: string
          description: 字段名
        type:
          type: string
          enum:
            - integer
            - float
            - boolean
            - string
          description: 后端推断的数据类型
        label:
          type: string
          description: 分析界面显示标签
        description:
          type: string
          description: 后台字段元数据说明
        unit:
          type: string
          description: 字段单位；未配置时为空字符串
        role:
          $ref: '#/components/schemas/NonGeoFieldRole'
        nullable:
          type: boolean
          description: 分析样本中是否检测到空值
        nonNullCount:
          type: integer
          minimum: 0
          description: 非空记录数；抽样分析时按真实总数估算
        nullCount:
          type: integer
          minimum: 0
          description: 空记录数；抽样分析时按真实总数估算
        completeness:
          type: number
          minimum: 0
          maximum: 1
          description: 分析样本中的字段完整率
        uniqueCount:
          type: integer
          minimum: 0
          description: 分析样本中的非空唯一值数量
        sampleValues:
          type: array
          maxItems: 3
          description: 最多三个非空样例值
          items:
            $ref: '#/components/schemas/NonGeoScalar'
        min:
          type:
            - number
            - 'null'
          description: 数值字段最小值；非数值字段省略
        max:
          type:
            - number
            - 'null'
          description: 数值字段最大值；非数值字段省略
        mean:
          type:
            - number
            - 'null'
          description: 数值字段平均值；非数值字段省略
    NonGeoAnalyticsSummary:
      type: object
      required:
        - rowCount
        - analyzedRowCount
        - sampled
        - fieldCount
        - numericFieldCount
        - textFieldCount
        - categoricalFieldCount
        - completeness
        - updatedAt
        - suggestedView
      properties:
        rowCount:
          type: integer
          minimum: 0
          description: 资源真实总记录数
        analyzedRowCount:
          type: integer
          minimum: 0
          maximum: 10000
          description: 本次实际参与画像与统计的记录数
        sampled:
          type: boolean
          description: 是否因超过 10,000 条记录而使用抽样分析
        fieldCount:
          type: integer
          minimum: 0
          description: 字段总数
        numericFieldCount:
          type: integer
          minimum: 0
          description: 推断为数值指标的字段数
        textFieldCount:
          type: integer
          minimum: 0
          description: 推断为文本或标识符的字段数
        categoricalFieldCount:
          type: integer
          minimum: 0
          description: 推断为分类字段的字段数
        completeness:
          type: number
          minimum: 0
          maximum: 1
          description: 所有字段完整率的平均值
        updatedAt:
          type: string
          format: date-time
          description: 数据资源更新时间
        suggestedView:
          type: string
          enum:
            - species
            - community
            - traits
            - environment
            - generic
          description: 根据字段名推断的前端分析视图
    NonGeoCategoricalDistributionItem:
      type: object
