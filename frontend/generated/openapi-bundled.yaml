        - id
        - accessionCode
        - sampleCode
        - taxon
        - sourceSite
        - materialType
        - resourceType
        - sex
        - isCore
        - storageStatus
        - sourceResourceId
        - createdAt
        - updatedAt
      properties:
        id:
